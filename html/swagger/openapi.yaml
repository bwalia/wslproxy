    CacheConfig:
      type: object
      properties:
        server_name:
          type: string
          description: The domain name of the server
        cache_enabled:
          type: boolean
          description: Whether caching is enabled for this server
          default: false
        cache_ttl:
          type: number
          description: Cache time-to-live in seconds
          default: 3600
        cache_max_size:
          type: string
          description: Maximum cache size
          default: "100m"
        cache_inactive:
          type: string
          description: Time after which inactive items are removed
          default: "60m"
        cache_valid_codes:
          type: array
          items:
            type: number
          description: HTTP status codes to cache
          default: [200, 301, 302]
        cache_bypass_cookie:
          type: string
          description: Cookie name that will bypass cache
          default: ""
        cache_bypass_header:
          type: string
          description: Header name that will bypass cache
          default: ""
        cached_extensions:
          type: array
          items:
            type: string
          description: File extensions to cache
          default: ["js", "css", "woff", "woff2", "jpg", "png", "gif", "svg", "ico"]
        cached_mime_types:
          type: array
          items:
            type: string
          description: MIME types to cache
          default: ["text/css", "application/javascript", "image/jpeg", "image/png", "font/woff2"]
        updated_at:
          type: number
          description: Timestamp when config was last updated

    McpManifest:
      type: object
      description: MCP server manifest following the Model Context Protocol specification
      properties:
        jsonrpc:
          type: string
          default: "2.0"
        result:
          type: object
          properties:
            protocolVersion:
              type: string
              description: MCP protocol version
              default: "2025-03-26"
            serverInfo:
              type: object
              properties:
                name:
                  type: string
                  default: "wslproxy-mcp"
                version:
                  type: string
                  default: "1.0.0"
                description:
                  type: string
                vendor:
                  type: string
                  default: "WSLProxy"
                homepage:
                  type: string
                  default: "https://www.wslproxy.com/"
            capabilities:
              type: object
              properties:
                resources:
                  type: object
                  properties:
                    subscribe:
                      type: boolean
                      default: false
                    listChanged:
                      type: boolean
                      default: false
                tools:
                  type: object
                  nullable: true
            instructions:
              type: string

    McpCapabilities:
      type: object
      description: Detailed MCP server capabilities for agent discovery
      properties:
        server:
          type: string
        version:
          type: string
        protocol_version:
          type: string
        mode:
          type: string
          enum: [read-only, read-write]
        capabilities:
          type: object
          properties:
            resources:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  uri:
                    type: string
                  mimeType:
                    type: string
                  category:
                    type: string
                  read_only:
                    type: boolean
            tools:
              type: array
              nullable: true
              items:
                type: object
                properties:
                  name:
                    type: string
                  description:
                    type: string
                  inputSchema:
                    type: object
            authentication:
              type: object
              properties:
                type:
                  type: string
                header:
                  type: string
                description:
                  type: string
        metadata:
          type: object
          properties:
            x-ai-agent:
              type: boolean
            x-mcp-compatible:
              type: boolean
            platform:
              type: string
            gateway_type:
              type: string

    McpResourceList:
      type: object
      properties:
        jsonrpc:
          type: string
          default: "2.0"
        result:
          type: object
          properties:
            resources:
              type: array
              items:
                type: object
                properties:
                  uri:
                    type: string
                    description: Resource URI (e.g., wslproxy://resources/servers)
                  name:
                    type: string
                  description:
                    type: string
                  mimeType:
                    type: string
                    default: "application/json"
                  metadata:
                    type: object

    McpResourceResponse:
      type: object
      properties:
        jsonrpc:
          type: string
          default: "2.0"
        result:
          type: object
          properties:
            contents:
              type: array
              items:
                type: object
                properties:
                  uri:
                    type: string
                  mimeType:
                    type: string
                  data:
                    type: object
                    description: The resource data (structure varies by resource type)

    McpToolList:
      type: object
      properties:
        jsonrpc:
          type: string
          default: "2.0"
        result:
          type: object
          properties:
            tools:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  description:
                    type: string
                  inputSchema:
                    type: object
                  annotations:
                    type: object

    McpToolResult:
      type: object
      properties:
        jsonrpc:
          type: string
          default: "2.0"
        result:
          type: object
          properties:
            tool:
              type: string
            result:
              type: object
            isError:
              type: boolean

    McpJsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          default: "2.0"
        id:
          oneOf:
            - type: string
            - type: number
        method:
          type: string
          description: "MCP method: initialize, resources/list, resources/read, tools/list, tools/call, ping"
          enum: ["initialize", "resources/list", "resources/read", "tools/list", "tools/call", "ping"]
        params:
          type: object
          description: Method-specific parameters

    McpJsonRpcResponse:
      type: object
      properties:
        jsonrpc:
          type: string
          default: "2.0"
        id:
          oneOf:
            - type: string
            - type: number
        result:
          type: object
          description: Successful result (present if no error)
        error:
          type: object
          description: Error object (present if request failed)
          properties:
            code:
              type: number
            message:
              type: string