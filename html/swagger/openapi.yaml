openapi: 3.0.0
info:
  title: WSLProxy OpsAPI Gateway & MCP Server Documentation
  description: API endpoints reference for performing CRUD operations for Servers, Security Rules and HTTP Routes. Includes MCP (Model Context Protocol) endpoints for AI agent integration with typed resource schemas, Swagger-to-MCP mappers, and JSON-RPC 2.0 support.
  version: 1.4.0
tags:
  - name: Servers  
    description: Create and Manage servers aka HTTP hosts
  - name: Rules
    description: Create and Manage host specific Security Rules and HTTP Routes
  - name: Cache
    description: Enable and Manage static content caching per server
  - name: WAF Rules
    description: Create and manage Web Application Firewall detection rules (SQLi, XSS, command injection, LFI, protocol violations, and custom patterns)
  - name: WAF Policies
    description: Create and manage WAF policies that group rules with anomaly scoring, whitelisting, and blocking configuration
  - name: WAF Events
    description: View real-time WAF security events (blocked and monitored requests)
  - name: Traffic
    description: Traffic management APIs for multi-backend routing, canary releases, A/B testing, and weighted load balancing
  - name: MCP
    description: |
      Model Context Protocol (MCP) server endpoints for AI agent integration.
      Provides structured, read-only access to WSLProxy configuration and status
      with typed resource schemas (wslproxy.server, wslproxy.rule, etc.) and
      Swagger-to-MCP resource mappers. Responses include typed envelopes with
      explicit relationships between resources.
      Compatible with Claude MCP client, OpenAI Agents, and Cursor IDE.
    x-ai-agent: true
paths:
  /api/rules:
    get:
      tags:
        - Rules
      summary: Retrieve a list of all the security rules and the routes. 
      operationId: getRules
      parameters:
        - name: params
          in: query
          description: Search keyword
          required: false
          schema:
            type: object
            properties:
              pagination:
                type: object
                default: {page: 1, perPage: 10}
              sort:
                type: object
                default: {field: id, order: ASC}
              filter:
                type: object
                default: {profile_id: prod}
      responses:
        '200':
          description: Successfully retrieved a list of all HTTP Security rules and or the routes
      security:
        - bearerAuth: []          
          
    post:
      tags:
        - Rules
      summary: Create a new rule
      operationId: createRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rules'
      responses:
        '201':
          description: Successfully created a new Security Rule and HTTP Route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
      security:
        - bearerAuth: []                
                
  /api/rules/{id}:
    get:
      tags:
        - Rules
      summary: Retrieve HTTP Route or Security Rule by ID
      operationId: getRuleById
      parameters:
        - name: id
          in: path
          description: ID of the rule to retrieve
          required: true
          schema:
            type: string
        - name: envprofile
          in: query
          description: Profile Name
          required: false
          schema:
            type: string
            default: test
      responses:
         '200':
            description: Returned information about a specific rule
         '404':
            description: Not found
      security:
        - bearerAuth: []            
            
    put:
      tags:
        - Rules
      summary: Update a security rule or HTTP Route by ID
      operationId: updateRuleById
      parameters:
        - name: id
          in: path
          description: ID of the rule to update
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rules'
      responses:
        '200':
          description: Successfully updated rule
        '404':
          description: Not found
      security:
        - bearerAuth: []          
          
          
    delete:
      tags:
        - Rules
      summary: Delete a security rule or HTTP Route by ID
      operationId: deleteRuleById
      parameters:
        - name: id
          in: path
          description: ID of the rule to delete
          required: true
          schema:
            type: string
        - name: envProfile
          in: query
          description: Profile Name
          required: false
          schema:
            type: string
            default: test
      responses:
        '200':
          description: Successfully deleted a rule
      security:
        - bearerAuth: []
            
  /api/servers:
    get:
      tags:
        - Servers
      summary: Retrieve a list of all the HTTP server hosts. 
      operationId: getServers
      parameters:
        - name: params
          in: query
          description: Search keyword
          required: false
          schema:
            type: object
            properties:
              pagination:
                type: object
                default: {page: 1, perPage: 10}
              sort:
                type: object
                default: {field: id, order: ASC}
              filter:
                type: object
                default: {profile_id: prod}
      responses:
        '200':
          description: Successfully retrieved a list of all the HTTP servers
      security:
        - bearerAuth: []

    post:
      tags:
        - Servers
      summary: Create a new server
      operationId: createServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Servers'
      responses:
        '201':
          description: Successfully created a new server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
      security:
        - bearerAuth: []                
                
  /api/servers/{id}:
    get:
      tags:
        - Servers
      summary: Retrieve a HTTP server by ID
      operationId: getServerById
      parameters:
        - name: id
          in: path
          description: ID of the server to retrieve
          required: true
          schema:
            type: string
        - name: envprofile
          in: query
          description: Profile Name
          required: false
          schema:
            type: string
            default: test
      responses:
         '200':
            description: Returned information about a specific server
         '404':
            description: Item not found
      security:
        - bearerAuth: []            
          
    put:
      tags:
        - Servers
      summary: Update a HTTP server by ID
      operationId: updateItemById
      parameters:
        - name: id
          in: path
          description: ID of the server to update
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Servers'
      responses:
        '200':
          description: OK
        '404':
          description: Item not found
      security:
        - bearerAuth: []          
          
          
    delete:
      tags:
        - Servers
      summary: Delete a HTTP server by ID
      operationId: deleteServerById
      parameters:
        - name: id
          in: path
          description: ID of the item to delete
          required: true
          schema:
            type: string
        - name: envProfile
          in: query
          description: Profile Name
          required: false
          schema:
            type: string
            default: test
      responses:
        '200':
          description: Successfully deleted a server
      security:
        - bearerAuth: []

  /api/profiles:
    get:
      tags:
        - Profiles
      summary: Retrieve a list of all the security rules and the routes. 
      operationId: getProfiles
      parameters:
        - name: params
          in: query
          description: Search keyword
          required: false
          schema:
            type: object
            properties:
              pagination:
                type: object
                default: {page: 1, perPage: 10}
              sort:
                type: object
                default: {field: id, order: ASC}
              filter:
                type: object
                default: {profile_id: prod}
      responses:
        '200':
          description: Successfully retrieved a list of all HTTP Security rules and or the routes
      security:
        - bearerAuth: []          
          
    post:
      tags:
        - Profiles
      summary: Create a new profile
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: prod
      responses:
        '201':
          description: Successfully created a new Security Rule and HTTP Route
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    default: 200
                  message:
                    type: string
                    default: Success
      security:
        - bearerAuth: []                
  
  /api/user/login:
    post:
        tags:
        - Login
        summary: Login to server
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    default: email@mail.com
                  password:
                    type: string
                    default: abc123
        responses:
          '201':
            description: Login Successfull
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: number
                      default: 200
                    message:
                      type: string
                      default: Success

  /password/reset:
    post:
      tags:
        - PasswordReset
      summary: Password Reset API
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword:
                  type: string
                  default: abc123
                newPassword:
                  type: string
                  default: abc123
      responses:
        '201':
          description: Successfully resets the password
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    default: 200
                  message:
                    type: string
                    default: Success
      security:
        - bearerAuth: []     


  /api/openresty_status:
    get:
      tags:
      - Openresty
      summary: Check the status of openresty (openresty -t)
      responses:
        '200':
          description: nginx the configuration file /usr/local/openresty/nginx/conf/nginx.conf syntax is ok
      security:
        - bearerAuth: []   
          
  /api/openresty/error_logs:
    get:
      tags:
      - Openresty
      summary: Get all the logs of openresty
      responses:
        '200':
          description: signal process started     
      security:
        - bearerAuth: []
        
  /api/push-data:
    post:
      tags:
      - Syncing Data
      summary: Login to server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instance:
                  type: string
                  default: uuid of instance
                profile:
                  type: string
                  default: your profile name
      responses:
        '200':
          description: signal process started     
      security:
        - bearerAuth: []
        
  /api/password/reset:
    post:
      tags:
      - Reset Password
      summary: Reset you password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword:
                  type: string
                  default: old password
                newPassword:
                  type: string
                  default: new password
      responses:
        '200':
          description: Password has been successfully reset
      security:
        - bearerAuth: []

  /api/cache/status/{server_name}:
    get:
      tags:
        - Cache
      summary: Get cache status for a server
      operationId: getCacheStatus
      parameters:
        - name: server_name
          in: path
          description: The server domain name (e.g., example.com)
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cache status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      server_name:
                        type: string
                      cache_enabled:
                        type: boolean
                      cache_ttl:
                        type: number
                      message:
                        type: string
      security:
        - bearerAuth: []

  /api/cache/config/{server_name}:
    get:
      tags:
        - Cache
      summary: Get cache configuration for a server
      operationId: getCacheConfig
      parameters:
        - name: server_name
          in: path
          description: The server domain name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cache configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheConfig'
      security:
        - bearerAuth: []
    post:
      tags:
        - Cache
      summary: Update cache configuration for a server
      operationId: updateCacheConfig
      parameters:
        - name: server_name
          in: path
          description: The server domain name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheConfig'
      responses:
        '200':
          description: Cache configuration updated successfully
      security:
        - bearerAuth: []

  /api/cache/configs:
    get:
      tags:
        - Cache
      summary: List all cache configurations
      operationId: listCacheConfigs
      responses:
        '200':
          description: List of all cache configurations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CacheConfig'
      security:
        - bearerAuth: []

  /api/cache/stats:
    get:
      tags:
        - Cache
      summary: Get global cache statistics
      operationId: getCacheStats
      responses:
        '200':
          description: Cache statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      capacity:
                        type: number
                      free_space:
                        type: number
                      keys_count:
                        type: number
      security:
        - bearerAuth: []

  /api/cache/stats/{server_name}:
    get:
      tags:
        - Cache
      summary: Get cache statistics for a specific server
      operationId: getServerCacheStats
      parameters:
        - name: server_name
          in: path
          description: The server domain name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Server cache statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      server_name:
                        type: string
                      cached_items:
                        type: number
                      total_size_bytes:
                        type: number
      security:
        - bearerAuth: []

  /api/cache/enable/{server_name}:
    post:
      tags:
        - Cache
      summary: Enable caching for a server
      operationId: enableCache
      parameters:
        - name: server_name
          in: path
          description: The server domain name
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cache_ttl:
                  type: number
                  description: Cache TTL in seconds
                  default: 3600
                cached_extensions:
                  type: array
                  items:
                    type: string
                  description: File extensions to cache
      responses:
        '200':
          description: Caching enabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  server_name:
                    type: string
                  cache_enabled:
                    type: boolean
      security:
        - bearerAuth: []

  /api/cache/disable/{server_name}:
    post:
      tags:
        - Cache
      summary: Disable caching for a server
      operationId: disableCache
      parameters:
        - name: server_name
          in: path
          description: The server domain name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Caching disabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  server_name:
                    type: string
                  cache_enabled:
                    type: boolean
      security:
        - bearerAuth: []

  /api/cache/clear/{server_name}:
    post:
      tags:
        - Cache
      summary: Clear cache for a specific server
      operationId: clearServerCache
      parameters:
        - name: server_name
          in: path
          description: The server domain name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cache cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  server_name:
                    type: string
      security:
        - bearerAuth: []

  /api/cache/clear-all:
    post:
      tags:
        - Cache
      summary: Clear all cached content
      operationId: clearAllCache
      responses:
        '200':
          description: All cache cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      security:
        - bearerAuth: []

  /api/traffic/topology:
    get:
      tags:
        - Traffic
      summary: Get traffic routing topology
      description: Returns the complete servers-to-rules-to-backends graph for the ingress overview. Includes server nodes, rules with multi-backend routing, backend stats, and connection mappings with weight percentages.
      operationId: getTrafficTopology
      parameters:
        - name: profile_id
          in: query
          description: Environment profile
          required: false
          schema:
            type: string
            default: prod
      responses:
        '200':
          description: Traffic topology retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TrafficTopology'
      security:
        - bearerAuth: []

  /api/traffic/backends:
    get:
      tags:
        - Traffic
      summary: Get backend stats for a rule
      description: Returns per-backend statistics including request count, error count, average latency, health status, and current weight for all backends of a specific rule.
      operationId: getTrafficBackendStats
      parameters:
        - name: rule_id
          in: query
          description: The rule ID to get backend stats for
          required: true
          schema:
            type: string
        - name: profile_id
          in: query
          description: Environment profile
          required: false
          schema:
            type: string
            default: prod
      responses:
        '200':
          description: Backend stats retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TrafficBackendStats'
        '400':
          description: Missing rule_id parameter
        '404':
          description: Rule not found
      security:
        - bearerAuth: []

  /api/traffic/backends/weights:
    post:
      tags:
        - Traffic
      summary: Update backend traffic weights
      description: Update the weight distribution for a rule's backends. Weights are normalized to sum to 100%. Changes take effect immediately without nginx reload (gateway reads from disk per-request).
      operationId: updateTrafficWeights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrafficWeightUpdate'
      responses:
        '200':
          description: Weights updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rule_id:
                        type: string
                      backends:
                        type: array
                        items:
                          $ref: '#/components/schemas/TrafficBackend'
                      effective_immediately:
                        type: boolean
                        default: true
                      timestamp:
                        type: string
        '400':
          description: Validation error (missing rule_id, invalid backends)
        '404':
          description: Rule not found
      security:
        - bearerAuth: []

  /api/traffic/backends/promote:
    post:
      tags:
        - Traffic
      summary: Promote a backend to 100% traffic
      description: Promote a specific backend to receive 100% of traffic. All other backends are set to 0% weight. The rule's redirect_uri is updated to point to the promoted backend. Used to complete a canary deployment.
      operationId: promoteBackend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule_id, promote_label]
              properties:
                rule_id:
                  type: string
                  description: The rule ID containing the backend to promote
                promote_label:
                  type: string
                  description: Label of the backend to promote (e.g., 'canary')
                profile_id:
                  type: string
                  description: Environment profile
                  default: prod
      responses:
        '200':
          description: Backend promoted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rule_id:
                        type: string
                      promoted_label:
                        type: string
                      promoted_address:
                        type: string
                      backends:
                        type: array
                        items:
                          $ref: '#/components/schemas/TrafficBackend'
                      timestamp:
                        type: string
        '400':
          description: Validation error
        '404':
          description: Rule or backend not found
      security:
        - bearerAuth: []

  /api/traffic/backends/rollback:
    post:
      tags:
        - Traffic
      summary: Rollback to single-backend routing
      description: Remove the backends array and routing configuration from a rule, restoring single-backend routing via redirect_uri. Use this to undo a canary or A/B test deployment.
      operationId: rollbackBackend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule_id]
              properties:
                rule_id:
                  type: string
                  description: The rule ID to rollback
                profile_id:
                  type: string
                  description: Environment profile
                  default: prod
      responses:
        '200':
          description: Rollback completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rule_id:
                        type: string
                      redirect_uri:
                        type: string
                      removed_backends:
                        type: array
                        items:
                          $ref: '#/components/schemas/TrafficBackend'
                      timestamp:
                        type: string
        '400':
          description: Validation error
        '404':
          description: Rule not found
      security:
        - bearerAuth: []

  /api/traffic/health:
    get:
      tags:
        - Traffic
      summary: Get backend health status
      description: Returns health status of all backends across all rules that have multi-backend routing configured. Health is determined by active health checks (if configured) or defaults to healthy.
      operationId: getTrafficHealth
      parameters:
        - name: profile_id
          in: query
          description: Environment profile
          required: false
          schema:
            type: string
            default: prod
      responses:
        '200':
          description: Backend health retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrafficRuleHealth'
      security:
        - bearerAuth: []

  /api/waf_rules:
    get:
      tags:
        - WAF Rules
      summary: List all WAF detection rules
      description: Retrieve a paginated list of all WAF rules. Supports filtering by profile, sorting, and pagination.
      operationId: listWafRules
      parameters:
        - name: pagination[page]
          in: query
          description: Page number
          required: false
          schema:
            type: number
            default: 1
        - name: pagination[perPage]
          in: query
          description: Items per page
          required: false
          schema:
            type: number
            default: 25
        - name: sort[field]
          in: query
          description: Field to sort by
          required: false
          schema:
            type: string
            default: id
        - name: sort[order]
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
        - name: filter[profile_id]
          in: query
          description: Environment profile filter
          required: false
          schema:
            type: string
            default: prod
      responses:
        '200':
          description: Successfully retrieved WAF rules list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WafRule'
                  total:
                    type: number
      security:
        - bearerAuth: []

    post:
      tags:
        - WAF Rules
      summary: Create a new WAF rule
      operationId: createWafRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WafRuleInput'
      responses:
        '201':
          description: WAF rule created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WafRule'
        '400':
          description: Validation error (invalid pattern, missing required fields, duplicate name)
      security:
        - bearerAuth: []

  /api/waf_rules/{id}:
    get:
      tags:
        - WAF Rules
      summary: Get a WAF rule by ID
      operationId: getWafRuleById
      parameters:
        - name: id
          in: path
          description: WAF rule ID (e.g., waf-rule-sqli-001)
          required: true
          schema:
            type: string
        - name: envprofile
          in: query
          description: Environment profile
          required: false
          schema:
            type: string
            default: prod
      responses:
        '200':
          description: WAF rule retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WafRule'
        '404':
          description: WAF rule not found
      security:
        - bearerAuth: []

    put:
      tags:
        - WAF Rules
      summary: Update a WAF rule by ID
      operationId: updateWafRuleById
      parameters:
        - name: id
          in: path
          description: WAF rule ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WafRuleInput'
      responses:
        '200':
          description: WAF rule updated successfully
        '400':
          description: Validation error
