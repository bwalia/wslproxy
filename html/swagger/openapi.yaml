openapi: 3.0.0
info:
  title: WSLProxy OpsAPI Gateway Consumer Documentation
  description: API endpoints reference for performing CRUD operations for Servers, Security Rules and HTTP Routes. Includes MCP (Model Context Protocol) endpoints for AI agent integration.
  version: 1.1.0
tags:
  - name: Servers  
    description: Create and Manage servers aka HTTP hosts
  - name: Rules
    description: Create and Manage host specific Security Rules and HTTP Routes
  - name: Cache
    description: Enable and Manage static content caching per server
  - name: MCP
    description: |
      Model Context Protocol (MCP) server endpoints for AI agent integration.
      Provides structured, read-only access to WSLProxy configuration and status.
      Compatible with Claude MCP client, OpenAI Agents, and Cursor IDE.
    x-ai-agent: true
paths:
  /api/rules:
    get:
      tags:
        - Rules
      summary: Retrieve a list of all the security rules and the routes. 
      operationId: getRules
      parameters:
        - name: params
          in: query
          description: Search keyword
          required: false
          schema:
            type: object
            properties:
              pagination:
                type: object
                default: {page: 1, perPage: 10}
              sort:
                type: object
                default: {field: id, order: ASC}
              filter:
                type: object
                default: {profile_id: prod}
      responses:
        '200':
          description: Successfully retrieved a list of all HTTP Security rules and or the routes
      security:
        - bearerAuth: []          
          
    post:
      tags:
        - Rules
      summary: Create a new rule
      operationId: createRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rules'
      responses:
        '201':
          description: Successfully created a new Security Rule and HTTP Route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
      security:
        - bearerAuth: []                
                
  /api/rules/{id}:
    get:
      tags:
        - Rules
      summary: Retrieve HTTP Route or Security Rule by ID
      operationId: getRuleById
      parameters:
        - name: id
          in: path
          description: ID of the rule to retrieve
          required: true
          schema:
            type: string
        - name: envprofile
          in: query
          description: Profile Name
          required: false
          schema:
            type: string
            default: test
      responses:
         '200':
            description: Returned information about a specific rule
         '404':
            description: Not found
      security:
        - bearerAuth: []            
            
    put:
      tags:
        - Rules
      summary: Update a security rule or HTTP Route by ID
      operationId: updateRuleById
      parameters:
        - name: id
          in: path
          description: ID of the rule to update
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rules'
      responses:
        '200':
          description: Successfully updated rule
        '404':
          description: Not found
      security:
        - bearerAuth: []          
          
          
    delete:
      tags:
        - Rules
      summary: Delete a security rule or HTTP Route by ID
      operationId: deleteRuleById
      parameters:
        - name: id
          in: path
          description: ID of the rule to delete
          required: true
          schema:
            type: string
        - name: envProfile
          in: query
          description: Profile Name
          required: false
          schema:
            type: string
            default: test
      responses:
        '200':
          description: Successfully deleted a rule
      security:
        - bearerAuth: []
            
  /api/servers:
    get:
      tags:
        - Servers
      summary: Retrieve a list of all the HTTP server hosts. 
      operationId: getServers
      parameters:
        - name: params
          in: query
          description: Search keyword
          required: false
          schema:
            type: object
            properties:
              pagination:
                type: object
                default: {page: 1, perPage: 10}
              sort:
                type: object
                default: {field: id, order: ASC}
              filter:
                type: object
                default: {profile_id: prod}
      responses:
        '200':
          description: Successfully retrieved a list of all the HTTP servers
      security:
        - bearerAuth: []

    post:
      tags:
        - Servers
      summary: Create a new server
      operationId: createServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Servers'
      responses:
        '201':
          description: Successfully created a new server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
      security:
        - bearerAuth: []                
                
  /api/servers/{id}:
    get:
      tags:
        - Servers
      summary: Retrieve a HTTP server by ID
      operationId: getServerById
      parameters:
        - name: id
          in: path
          description: ID of the server to retrieve
          required: true
          schema:
            type: string
        - name: envprofile
          in: query
          description: Profile Name
          required: false
          schema:
            type: string
            default: test
      responses:
         '200':
            description: Returned information about a specific server
         '404':
            description: Item not found
      security:
        - bearerAuth: []            
          
    put:
      tags:
        - Servers
      summary: Update a HTTP server by ID
      operationId: updateItemById
      parameters:
        - name: id
          in: path
          description: ID of the server to update
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Servers'
      responses:
        '200':
          description: OK
        '404':
          description: Item not found
      security:
        - bearerAuth: []          
          
          
    delete:
      tags:
        - Servers
      summary: Delete a HTTP server by ID
      operationId: deleteServerById
      parameters:
        - name: id
          in: path
          description: ID of the item to delete
          required: true
          schema:
            type: string
        - name: envProfile
          in: query
          description: Profile Name
          required: false
          schema:
            type: string
            default: test
      responses:
        '200':
          description: Successfully deleted a server
      security:
        - bearerAuth: []

  /api/profiles:
    get:
      tags:
        - Profiles
      summary: Retrieve a list of all the security rules and the routes. 
      operationId: getProfiles
      parameters:
        - name: params
          in: query
          description: Search keyword
          required: false
          schema:
            type: object
            properties:
              pagination:
                type: object
                default: {page: 1, perPage: 10}
              sort:
                type: object
                default: {field: id, order: ASC}
              filter:
                type: object
                default: {profile_id: prod}
      responses:
        '200':
          description: Successfully retrieved a list of all HTTP Security rules and or the routes
      security:
        - bearerAuth: []          
          
    post:
      tags:
        - Profiles
      summary: Create a new profile
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: prod
      responses:
        '201':
          description: Successfully created a new Security Rule and HTTP Route
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    default: 200
                  message:
                    type: string
                    default: Success
      security:
        - bearerAuth: []                
  
  /api/user/login:
    post:
        tags:
        - Login
        summary: Login to server
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    default: email@mail.com
                  password:
                    type: string
                    default: abc123
        responses:
          '201':
            description: Login Successfull
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: number
                      default: 200
                    message:
                      type: string
                      default: Success

  /password/reset:
    post:
      tags:
        - PasswordReset
      summary: Password Reset API
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword:
                  type: string
                  default: abc123
                newPassword:
                  type: string
                  default: abc123
      responses:
        '201':
          description: Successfully resets the password
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    default: 200
                  message:
                    type: string
                    default: Success
      security:
        - bearerAuth: []     


  /api/openresty_status:
    get:
      tags:
      - Openresty
      summary: Check the status of openresty (openresty -t)
      responses:
        '200':
          description: nginx the configuration file /usr/local/openresty/nginx/conf/nginx.conf syntax is ok
      security:
        - bearerAuth: []   
          
  /api/openresty/error_logs:
    get:
      tags:
      - Openresty
      summary: Get all the logs of openresty
      responses:
        '200':
          description: signal process started     
      security:
        - bearerAuth: []
        
  /api/push-data:
    post:
      tags:
      - Syncing Data
      summary: Login to server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instance:
                  type: string
                  default: uuid of instance
                profile:
                  type: string
                  default: your profile name
      responses:
        '200':
          description: signal process started     
      security:
        - bearerAuth: []
        
  /api/password/reset:
    post:
      tags:
      - Reset Password
      summary: Reset you password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword:
                  type: string
                  default: old password
                newPassword:
                  type: string
                  default: new password
      responses:
        '200':
          description: Password has been successfully reset
      security:
        - bearerAuth: []

  /api/cache/status/{server_name}:
    get:
      tags:
        - Cache
      summary: Get cache status for a server
      operationId: getCacheStatus
      parameters:
        - name: server_name
          in: path
          description: The server domain name (e.g., example.com)
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cache status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      server_name:
                        type: string
                      cache_enabled:
                        type: boolean
                      cache_ttl:
                        type: number
                      message:
                        type: string
      security:
        - bearerAuth: []

  /api/cache/config/{server_name}:
    get:
      tags:
        - Cache
      summary: Get cache configuration for a server
      operationId: getCacheConfig
      parameters:
        - name: server_name
          in: path
          description: The server domain name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cache configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheConfig'
      security:
        - bearerAuth: []
    post:
      tags:
        - Cache
      summary: Update cache configuration for a server
      operationId: updateCacheConfig
      parameters:
        - name: server_name
          in: path
          description: The server domain name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheConfig'
      responses:
        '200':
          description: Cache configuration updated successfully
      security:
        - bearerAuth: []

  /api/cache/configs:
    get:
      tags:
        - Cache
      summary: List all cache configurations
      operationId: listCacheConfigs
      responses:
        '200':
          description: List of all cache configurations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CacheConfig'
      security:
        - bearerAuth: []

  /api/cache/stats:
    get:
      tags:
        - Cache
      summary: Get global cache statistics
      operationId: getCacheStats
      responses:
        '200':
          description: Cache statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      capacity:
                        type: number
                      free_space:
                        type: number
                      keys_count:
                        type: number
      security:
        - bearerAuth: []

  /api/cache/stats/{server_name}:
    get:
      tags:
        - Cache
      summary: Get cache statistics for a specific server
      operationId: getServerCacheStats
      parameters:
        - name: server_name
          in: path
          description: The server domain name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Server cache statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      server_name:
                        type: string
                      cached_items:
                        type: number
                      total_size_bytes:
                        type: number
      security:
        - bearerAuth: []

  /api/cache/enable/{server_name}:
    post:
      tags:
        - Cache
      summary: Enable caching for a server
      operationId: enableCache
      parameters:
        - name: server_name
          in: path
          description: The server domain name
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cache_ttl:
                  type: number
                  description: Cache TTL in seconds
                  default: 3600
                cached_extensions:
                  type: array
                  items:
                    type: string
                  description: File extensions to cache
      responses:
        '200':
          description: Caching enabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  server_name:
                    type: string
                  cache_enabled:
                    type: boolean
      security:
        - bearerAuth: []

  /api/cache/disable/{server_name}:
    post:
      tags:
        - Cache
      summary: Disable caching for a server
      operationId: disableCache
      parameters:
        - name: server_name
          in: path
          description: The server domain name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Caching disabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  server_name:
                    type: string
                  cache_enabled:
                    type: boolean
      security:
        - bearerAuth: []

  /api/cache/clear/{server_name}:
    post:
      tags:
        - Cache
      summary: Clear cache for a specific server
      operationId: clearServerCache
      parameters:
        - name: server_name
          in: path
          description: The server domain name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cache cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  server_name:
                    type: string
      security:
        - bearerAuth: []

  /api/cache/clear-all:
    post:
      tags:
        - Cache
      summary: Clear all cached content
      operationId: clearAllCache
      responses:
        '200':
          description: All cache cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      security:
        - bearerAuth: []

  /mcp/manifest:
    get:
      tags:
        - MCP
      summary: Get MCP server manifest
      description: Returns the MCP server manifest describing protocol version, server info, and capabilities. This is the primary discovery endpoint for AI agents.
      operationId: mcpManifest
      x-ai-agent: true
      responses:
        '200':
          description: MCP manifest returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpManifest'
              example:
                jsonrpc: "2.0"
                result:
                  protocolVersion: "2025-03-26"
                  serverInfo:
                    name: "wslproxy-mcp"
                    version: "1.0.0"
                    description: "WSLProxy MCP Server"
                  capabilities:
                    resources:
                      subscribe: false
                      listChanged: false
      security:
        - mcpApiKey: []
        - bearerAuth: []

  /mcp/capabilities:
    get:
      tags:
        - MCP
      summary: Get detailed MCP capabilities
      description: Returns detailed capability information including available resources, tools, authentication requirements, and rate limiting configuration.
      operationId: mcpCapabilities
      x-ai-agent: true
      responses:
        '200':
          description: Capabilities returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpCapabilities'
      security:
        - mcpApiKey: []
        - bearerAuth: []

  /mcp/resources:
    get:
      tags:
        - MCP
      summary: List available MCP resources
      description: Returns a list of all available MCP resources that can be read by AI agents. Resources include servers, rules, upstreams, SSL configs, cache configs, health status, and metrics.
      operationId: mcpListResources
      x-ai-agent: true
      responses:
        '200':
          description: Resource list returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpResourceList'
      security:
        - mcpApiKey: []
        - bearerAuth: []

  /mcp/resources/{resourceId}:
    get:
      tags:
        - MCP
      summary: Read a specific MCP resource
      description: Fetches the data for a specific resource by ID. Available resources are servers, rules, upstreams, profiles, ssl, cache, health, metrics, and settings. Secrets are automatically redacted.
      operationId: mcpReadResource
      x-ai-agent: true
      parameters:
        - name: resourceId
          in: path
          required: true
          description: "Resource identifier. One of: servers, rules, upstreams, profiles, ssl, cache, health, metrics, settings"
          schema:
            type: string
            enum: [servers, rules, upstreams, profiles, ssl, cache, health, metrics, settings]
        - name: profile_id
          in: query
          required: false
          description: Environment profile filter (e.g., prod, dev, staging)
          schema:
            type: string
            default: prod
      responses:
        '200':
          description: Resource data returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpResourceResponse'
        '404':
          description: Resource not found
      security:
        - mcpApiKey: []
        - bearerAuth: []

  /mcp/tools:
    get:
      tags:
        - MCP
      summary: List available MCP tools
      description: Returns a list of available MCP tools. Tools are feature-flagged and must be explicitly enabled via mcp.tools_enabled configuration.
      operationId: mcpListTools
      x-ai-agent: true
      responses:
        '200':
          description: Tool list returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpToolList'
      security:
        - mcpApiKey: []
        - bearerAuth: []

  /mcp/tools/{toolName}:
    post:
      tags:
        - MCP
      summary: Execute an MCP tool
      description: Executes a specific MCP tool. Available tools are validate_config, get_error_logs, and reload_config. Tools must be enabled and appropriate mode must be set.
      operationId: mcpExecuteTool
      x-ai-agent: true
      parameters:
        - name: toolName
          in: path
          required: true
          description: "Tool name. One of: validate_config, get_error_logs, reload_config"
          schema:
            type: string
            enum: [validate_config, get_error_logs, reload_config]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Tool-specific parameters
              properties:
                dry_run:
                  type: boolean
                  description: "For reload_config: if true, only validates without reloading"
                  default: true
                lines:
                  type: number
                  description: "For get_error_logs: maximum lines to return"
                  default: 100
      responses:
        '200':
          description: Tool executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpToolResult'
        '400':
          description: Tool error or tools disabled
      security:
        - mcpApiKey: []
        - bearerAuth: []

  /mcp/jsonrpc:
    post:
      tags:
        - MCP
      summary: JSON-RPC 2.0 endpoint
      description: Full MCP protocol JSON-RPC 2.0 endpoint. Supports methods initialize, resources/list, resources/read, tools/list, tools/call, and ping.
      operationId: mcpJsonRpc
      x-ai-agent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpJsonRpcRequest'
            examples:
              initialize:
                summary: Initialize MCP session
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: "initialize"
                  params:
                    protocolVersion: "2025-03-26"
                    clientInfo:
                      name: "my-agent"
                      version: "1.0.0"
              list_resources:
                summary: List available resources
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: "resources/list"
              read_resource:
                summary: Read a resource
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: "resources/read"
                  params:
                    uri: "wslproxy://resources/health"
      responses:
        '200':
          description: JSON-RPC response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpJsonRpcResponse'
      security:
        - mcpApiKey: []
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:            # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT
    mcpApiKey:
      type: apiKey
      in: header
      name: X-MCP-API-Key
      description: API key for MCP endpoint authentication
  schemas:
    Servers:
      type: object
      properties:
        server_name:
          type: string
          default: localhost
        profile_id:
          type: string
          default: test
        root:
          type: string
          default: /var/www/html
        rules:
          type: string
          default: f8107018-2979-4c16-cd61-ab8a8b3303b1 (Rule uuid)
        index:
          type: string
          default: index.html
        locations:
          type: object
          default: {
            "location_path": "/api",
            "location_opts": ["allow", "try_files"],
            "location_vals": { "allow": "127.0.0.1", "try_files": "html" }
          }
        access_log:
          type: string
          default: logs/access.log
        error_log:
          type: string
          default: logs/error.log
        match_cases:
          type: object
          default: [
            { "statement": "a0b5fe52-2fdc-cf47-2b82-f3c69ee39ae2 (Rule uuid)", "condition": "and"}
          ]
        listens:
          type: object
          default: [{ "listen": "8080" }]
        created_at:
          type: number
          default: 1687334596
        custom_block:
          type: object
          default: [{ "additional_block": "include /tmp/resolver.conf;" }]
        config:
          type: string
          default: "server {\n        listen 8080;  # Listen on port (HTTP)\n        server_name localhost;  # Your domain name\n        root /var/www/html;  # Document root directory\n        index index.html;  # Default index files\n        access_log /logs/access.log;  # Access log file location\n        error_log /logs/error.log;  # Error log file location\n\n        location /api {\n                  allow 127.0.0.1\ntry_files html\n                  }\n        include resolver.conf;\n    }\n    "
        config_status:
          type: boolean
          default: false
    ServerResponse:
      type: object
      properties:
        id:
          type: string
          default: ef9d2897-92ea-9a96-ce7d-268dd0cb36b7
        server_name:
          type: string
          default: localhost
        profile_id:
          type: string
          default: test
        root:
          type: string
          default: /var/www/html
        rules:
          type: string
          default: f8107018-2979-4c16-cd61-ab8a8b3303b1 (Rule uuid)
        index:
          type: string
          default: index.html
        locations:
          type: object
          default: {
            "location_path": "/api",
            "location_opts": ["allow", "try_files"],
            "location_vals": { "allow": "127.0.0.1", "try_files": "html" }
          }
        access_log:
          type: string
          default: logs/access.log
        error_log:
          type: string
          default: logs/error.log
        match_cases:
          type: object
          default: [
