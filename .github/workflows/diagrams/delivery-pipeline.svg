<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <linearGradient id="stageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="prodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffe3e3"/>
    </linearGradient>
    <linearGradient id="triggerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7f5ff"/>
      <stop offset="100%" stop-color="#d0ebff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#212529">Delivery Pipeline</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#868e96">deploy-wslproxy-delivery-pipeline.yml</text>

  <!-- Trigger -->
  <rect x="280" y="65" width="340" height="40" rx="20" fill="url(#triggerGrad)" stroke="#339af0" stroke-width="1.5"/>
  <text x="450" y="90" text-anchor="middle" font-weight="600" fill="#1864ab">Push to release / Manual dispatch</text>

  <line x1="450" y1="105" x2="450" y2="125" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 1 -->
  <rect x="200" y="125" width="500" height="55" rx="8" fill="url(#stageGrad)" stroke="#adb5bd" stroke-width="1"/>
  <text x="220" y="148" font-weight="bold" fill="#495057">Stage 1</text>
  <text x="300" y="148" fill="#212529">Build &amp; Validate</text>
  <text x="680" y="148" text-anchor="end" font-size="11" fill="#868e96">ubuntu-latest</text>
  <text x="220" y="168" font-size="11" fill="#495057">Validate JSON configs + Jinja2 templates</text>

  <line x1="450" y1="180" x2="450" y2="200" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="200" y="200" width="500" height="55" rx="8" fill="url(#stageGrad)" stroke="#adb5bd" stroke-width="1"/>
  <text x="220" y="223" font-weight="bold" fill="#495057">Stage 2</text>
  <text x="300" y="223" fill="#212529">Deploy Int (192.168.1.193)</text>
  <text x="680" y="223" text-anchor="end" font-size="11" fill="#868e96">self-hosted, local</text>
  <text x="220" y="243" font-size="11" fill="#495057">deploy-environment.yml → connection_mode: local</text>

  <line x1="450" y1="255" x2="450" y2="275" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="200" y="275" width="500" height="55" rx="8" fill="url(#stageGrad)" stroke="#adb5bd" stroke-width="1"/>
  <text x="220" y="298" font-weight="bold" fill="#495057">Stage 3</text>
  <text x="300" y="298" fill="#212529">Smoke Test Int</text>
  <text x="680" y="298" text-anchor="end" font-size="11" fill="#868e96">self-hosted</text>
  <text x="220" y="318" font-size="11" fill="#495057">Go health checks + API endpoint verification</text>

  <line x1="450" y1="330" x2="450" y2="350" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="200" y="350" width="500" height="55" rx="8" fill="url(#stageGrad)" stroke="#adb5bd" stroke-width="1"/>
  <text x="220" y="373" font-weight="bold" fill="#495057">Stage 4</text>
  <text x="300" y="373" fill="#212529">Deploy Test (192.168.1.140)</text>
  <text x="680" y="373" text-anchor="end" font-size="11" fill="#868e96">self-hosted, SSH</text>
  <text x="220" y="393" font-size="11" fill="#495057">deploy-environment.yml → connection_mode: ssh</text>

  <line x1="450" y1="405" x2="450" y2="425" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 5 -->
  <rect x="200" y="425" width="500" height="55" rx="8" fill="url(#stageGrad)" stroke="#adb5bd" stroke-width="1"/>
  <text x="220" y="448" font-weight="bold" fill="#495057">Stage 5</text>
  <text x="300" y="448" fill="#212529">Deploy ACC (187.77.179.206)</text>
  <text x="680" y="448" text-anchor="end" font-size="11" fill="#868e96">self-hosted, SSH+key</text>
  <text x="220" y="468" font-size="11" fill="#495057">deploy-environment.yml → connection_mode: ssh_key</text>

  <line x1="450" y1="480" x2="450" y2="500" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 6a -->
  <rect x="200" y="500" width="500" height="55" rx="8" fill="url(#prodGrad)" stroke="#e03131" stroke-width="1"/>
  <text x="220" y="523" font-weight="bold" fill="#c92a2a">Stage 6a</text>
  <text x="310" y="523" fill="#212529">Deploy Prod pop0 (187.124.112.155)</text>
  <text x="680" y="523" text-anchor="end" font-size="11" fill="#868e96">self-hosted, SSH+key</text>
  <text x="220" y="543" font-size="11" fill="#495057">Health: https://prod-our.wslproxy.com/health</text>

  <line x1="450" y1="555" x2="450" y2="575" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 6b -->
  <rect x="200" y="575" width="500" height="55" rx="8" fill="url(#prodGrad)" stroke="#e03131" stroke-width="1"/>
  <text x="220" y="598" font-weight="bold" fill="#c92a2a">Stage 6b</text>
  <text x="310" y="598" fill="#212529">Deploy Prod lon1 (195.20.255.201)</text>
  <text x="680" y="598" text-anchor="end" font-size="11" fill="#868e96">self-hosted, SSH+key</text>
  <text x="220" y="618" font-size="11" fill="#495057">Health: http://195.20.255.201:7691/health</text>

  <line x1="450" y1="630" x2="450" y2="650" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Summary -->
  <rect x="280" y="650" width="340" height="40" rx="8" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1"/>
  <text x="450" y="675" text-anchor="middle" fill="#495057">Pipeline Summary</text>

  <!-- Legend -->
  <rect x="200" y="720" width="500" height="80" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="220" y="742" font-weight="bold" font-size="12" fill="#495057">Legend</text>
  <rect x="220" y="752" width="14" height="14" rx="3" fill="url(#stageGrad)" stroke="#adb5bd" stroke-width="1"/>
  <text x="242" y="764" font-size="11" fill="#495057">Non-production stage</text>
  <rect x="400" y="752" width="14" height="14" rx="3" fill="url(#prodGrad)" stroke="#e03131" stroke-width="1"/>
  <text x="422" y="764" font-size="11" fill="#495057">Production stage</text>
  <rect x="580" y="752" width="14" height="14" rx="3" fill="url(#triggerGrad)" stroke="#339af0" stroke-width="1"/>
  <text x="602" y="764" font-size="11" fill="#495057">Trigger</text>
  <text x="220" y="785" font-size="11" fill="#868e96">Each stage must pass before the next runs. Failure → Slack alert → pipeline stops.</text>
</svg>
