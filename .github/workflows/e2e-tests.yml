name: WSL Proxy Dashboard E2E Tests

on:
  push:
    branches:
      - new/changes
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      TARGET_ENV:
        type: choice
        description: "Target environment to test"
        default: "prod"
        required: true
        options:
          - prod
          - int

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Credentials file on the self-hosted runner: { "email": "...", "password": "..." }
  TEST_CREDS_FILE: /home/bwalia/.secrets/wslproxy/prod/login-creds.json
  # Default deployed frontend URL to test against
  E2E_BASE_URL: https://prod-our.wslproxy.com

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: [self-hosted]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: openresty-admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: openresty-admin/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Validate test credentials
        working-directory: .
        run: |
          if [ ! -f "$TEST_CREDS_FILE" ]; then
            echo "::error::Test credentials file not found at $TEST_CREDS_FILE"
            echo "Create it with: echo '{\"ADMIN_EMAIL\":\"...\",\"ADMIN_PASSWORD\":\"...\",\"GATEWAY_URL\":\"...\"}' > $TEST_CREDS_FILE"
            exit 1
          fi
          if ! python3 -c "import json; d=json.load(open('$TEST_CREDS_FILE')); assert 'ADMIN_EMAIL' in d and 'ADMIN_PASSWORD' in d and 'GATEWAY_URL' in d" 2>/dev/null; then
            echo "::error::Test credentials file is missing required keys (ADMIN_EMAIL, ADMIN_PASSWORD, GATEWAY_URL)"
            exit 1
          fi
          echo "Test credentials validated."

      - name: Load test credentials
        id: creds
        working-directory: .
        run: |
          EMAIL=$(python3 -c "import json; print(json.load(open('$TEST_CREDS_FILE'))['ADMIN_EMAIL'])")
          PASSWORD=$(python3 -c "import json; print(json.load(open('$TEST_CREDS_FILE'))['ADMIN_PASSWORD'])")
          GATEWAY_URL=$(python3 -c "import json; print(json.load(open('$TEST_CREDS_FILE'))['GATEWAY_URL'])")
          echo "::add-mask::$EMAIL"
          echo "::add-mask::$PASSWORD"
          echo "email=$EMAIL" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"
          echo "gateway_url=$GATEWAY_URL" >> "$GITHUB_OUTPUT"
          echo "Using gateway URL: $GATEWAY_URL"

      - name: Wait for frontend to be reachable
        working-directory: .
        env:
          TARGET_URL: ${{ steps.creds.outputs.gateway_url || env.E2E_BASE_URL }}
        run: |
          echo "Checking frontend at $TARGET_URL ..."
          for i in $(seq 1 12); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$TARGET_URL" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "Frontend is reachable (HTTP $STATUS)."
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting 5s..."
            sleep 5
          done
          echo "::error::Frontend not reachable at $TARGET_URL after 60s"
          exit 1

      - name: Run Playwright tests
        id: tests
        env:
          E2E_TEST_EMAIL: ${{ steps.creds.outputs.email }}
          E2E_TEST_PASSWORD: ${{ steps.creds.outputs.password }}
          E2E_BASE_URL: ${{ steps.creds.outputs.gateway_url || env.E2E_BASE_URL }}
          CI: "true"
        run: npx playwright test 2>&1 | tee playwright-output.txt || true

      - name: Parse test results
        id: results
        if: always()
        run: |
          OUTPUT=$(cat playwright-output.txt 2>/dev/null || echo "No output")
          # Extract pass/fail counts from Playwright output
          PASSED=$(echo "$OUTPUT" | grep -oP '\d+ passed' | grep -oP '\d+' || echo "0")
          FAILED=$(echo "$OUTPUT" | grep -oP '\d+ failed' | grep -oP '\d+' || echo "0")
          TOTAL=$((PASSED + FAILED))
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          # Set overall status
          if [ "$FAILED" -gt 0 ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: openresty-admin/playwright-report/
          retention-days: 14

      - name: Upload test traces & screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: openresty-admin/test-results/
          retention-days: 7

      - name: Slack notification - Tests Passed
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: github-updates
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://github.com/rtCamp.png?size=48
          SLACK_MESSAGE: |
            WSL Proxy E2E Tests passed :white_check_mark:
            *Tests:* ${{ steps.results.outputs.passed }}/${{ steps.results.outputs.total }} passed
            *Target:* ${{ env.E2E_BASE_URL }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* `${{ github.sha }}`
            *Triggered by:* ${{ github.event_name }} (${{ github.actor }})
          SLACK_TITLE: WSL Proxy E2E Tests - All Passed
          SLACK_USERNAME: GitHub Actions
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

      - name: Slack notification - Tests Failed
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: github-updates
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://github.com/rtCamp.png?size=48
          SLACK_MESSAGE: |
            WSL Proxy E2E Tests FAILED :x:
            *Tests:* ${{ steps.results.outputs.failed }} failed, ${{ steps.results.outputs.passed }} passed out of ${{ steps.results.outputs.total }}
            *Target:* ${{ env.E2E_BASE_URL }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* `${{ github.sha }}`
            *Triggered by:* ${{ github.event_name }} (${{ github.actor }})
            *Screenshots & Traces:* Download from workflow artifacts
            *Workflow logs:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_TITLE: WSL Proxy E2E Tests - Failed
          SLACK_USERNAME: GitHub Actions
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

      - name: Upload screenshot to Slack
        if: failure() && env.SLACK_BOT_TOKEN != ''
        working-directory: .
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          # Find the first failure screenshot
          SCREENSHOT=$(find openresty-admin/test-results -name "*.png" -type f | head -1)
          if [ -n "$SCREENSHOT" ]; then
            echo "Uploading screenshot: $SCREENSHOT"
            curl -s -F "file=@$SCREENSHOT" \
              -F "channels=github-updates" \
              -F "initial_comment=WSL Proxy E2E test failure screenshot — ${{ github.ref_name }} (${{ github.sha }})" \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              https://slack.com/api/files.upload
          else
            echo "No screenshot found to upload."
          fi
