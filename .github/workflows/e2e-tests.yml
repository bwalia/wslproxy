name: WSL Proxy Dashboard E2E Tests

on:
  push:
    branches:
      - new/changes
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      TARGET_ENV:
        type: choice
        description: "Target environment to test"
        default: "prod"
        required: true
        options:
          - prod
          - int

jobs:
  setup:
    name: "Setup test matrix"
    runs-on: [self-hosted]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Determine environments to test
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'matrix={"environment":["${{ inputs.TARGET_ENV }}"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"environment":["prod","int"]}' >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: "E2E Tests (${{ matrix.environment }})"
    needs: setup
    runs-on: [self-hosted]
    timeout-minutes: 10
    concurrency:
      group: e2e-tests-${{ github.ref }}-${{ matrix.environment }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: openresty-admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set environment config
        id: env_config
        working-directory: .
        run: |
          if [ "${{ matrix.environment }}" = "int" ]; then
            echo "base_url=https://int-our.wslproxy.com" >> "$GITHUB_OUTPUT"
            echo "creds_file=/home/bwalia/.secrets/wslproxy/int/login-creds.json" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://prod-our-v1.wslproxy.com" >> "$GITHUB_OUTPUT"
            echo "creds_file=/home/bwalia/.secrets/wslproxy/prod/login-creds.json" >> "$GITHUB_OUTPUT"
          fi
          echo "Environment: ${{ matrix.environment }}"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: openresty-admin/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Validate test credentials
        working-directory: .
        env:
          TEST_CREDS_FILE: ${{ steps.env_config.outputs.creds_file }}
        run: |
          if [ ! -f "$TEST_CREDS_FILE" ]; then
            echo "::error::Test credentials file not found at $TEST_CREDS_FILE"
            echo "Create it with: echo '{\"ADMIN_EMAIL\":\"...\",\"ADMIN_PASSWORD\":\"...\",\"GATEWAY_URL\":\"...\"}' > $TEST_CREDS_FILE"
            exit 1
          fi
          if ! python3 -c "import json; d=json.load(open('$TEST_CREDS_FILE')); assert 'ADMIN_EMAIL' in d and 'ADMIN_PASSWORD' in d and 'GATEWAY_URL' in d" 2>/dev/null; then
            echo "::error::Test credentials file is missing required keys (ADMIN_EMAIL, ADMIN_PASSWORD, GATEWAY_URL)"
            exit 1
          fi
          echo "Test credentials validated for ${{ matrix.environment }}."

      - name: Load test credentials
        id: creds
        working-directory: .
        env:
          TEST_CREDS_FILE: ${{ steps.env_config.outputs.creds_file }}
        run: |
          EMAIL=$(python3 -c "import json; print(json.load(open('$TEST_CREDS_FILE'))['ADMIN_EMAIL'])")
          PASSWORD=$(python3 -c "import json; print(json.load(open('$TEST_CREDS_FILE'))['ADMIN_PASSWORD'])")
          GATEWAY_URL=$(python3 -c "import json; print(json.load(open('$TEST_CREDS_FILE'))['GATEWAY_URL'])")
          echo "::add-mask::$EMAIL"
          echo "::add-mask::$PASSWORD"
          echo "email=$EMAIL" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"
          echo "gateway_url=$GATEWAY_URL" >> "$GITHUB_OUTPUT"
          echo "Using gateway URL: $GATEWAY_URL"

      - name: Wait for frontend to be reachable
        working-directory: .
        env:
          TARGET_URL: ${{ steps.creds.outputs.gateway_url || steps.env_config.outputs.base_url }}
        run: |
          echo "Checking frontend at $TARGET_URL (${{ matrix.environment }}) ..."
          for i in $(seq 1 12); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$TARGET_URL" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "Frontend is reachable (HTTP $STATUS)."
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting 5s..."
            sleep 5
          done
          echo "::error::Frontend not reachable at $TARGET_URL after 60s"
          exit 1

      - name: Run Playwright tests
        id: tests
        env:
          E2E_TEST_EMAIL: ${{ steps.creds.outputs.email }}
          E2E_TEST_PASSWORD: ${{ steps.creds.outputs.password }}
          E2E_BASE_URL: ${{ steps.creds.outputs.gateway_url || steps.env_config.outputs.base_url }}
          CI: "true"
        run: npx playwright test 2>&1 | tee playwright-output.txt || true

      - name: Parse test results
        id: results
        if: always()
        run: |
          OUTPUT=$(cat playwright-output.txt 2>/dev/null || echo "No output")
          # Extract pass/fail/skip counts from Playwright output
          PASSED=$(echo "$OUTPUT" | grep -oP '\d+ passed' | grep -oP '\d+' || echo "0")
          FAILED=$(echo "$OUTPUT" | grep -oP '\d+ failed' | grep -oP '\d+' || echo "0")
          SKIPPED=$(echo "$OUTPUT" | grep -oP '\d+ skipped' | grep -oP '\d+' || echo "0")
          TOTAL=$((PASSED + FAILED))
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          # Set overall status
          if [ "$FAILED" -gt 0 ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload test report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.environment }}
          path: openresty-admin/playwright-report/
          retention-days: 14

      - name: Upload test traces & screenshots
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces-${{ matrix.environment }}
          path: openresty-admin/test-results/
          retention-days: 7

      - name: Slack notification - Tests Passed
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          curl -sf -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg env "${{ matrix.environment }}" \
              --arg passed "${{ steps.results.outputs.passed }}" \
              --arg total "${{ steps.results.outputs.total }}" \
              --arg skipped "${{ steps.results.outputs.skipped }}" \
              --arg target "${{ steps.creds.outputs.gateway_url || steps.env_config.outputs.base_url }}" \
              --arg branch "${{ github.ref_name }}" \
              --arg commit "${{ github.sha }}" \
              --arg event "${{ github.event_name }}" \
              --arg actor "${{ github.actor }}" \
              '{channel: "github-updates", username: "GitHub Actions", text: ("WSL Proxy E2E Tests passed :white_check_mark:\n*Environment:* \($env)\n*Tests:* \($passed)/\($total) passed (\($skipped) skipped)\n*Target:* \($target)\n*Branch:* \($branch)\n*Commit:* `\($commit)`\n*Triggered by:* \($event) (\($actor))")}')"

      - name: Slack notification - Tests Failed
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          curl -sf -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg env "${{ matrix.environment }}" \
              --arg failed "${{ steps.results.outputs.failed }}" \
              --arg passed "${{ steps.results.outputs.passed }}" \
              --arg total "${{ steps.results.outputs.total }}" \
              --arg skipped "${{ steps.results.outputs.skipped }}" \
              --arg target "${{ steps.creds.outputs.gateway_url || steps.env_config.outputs.base_url }}" \
              --arg branch "${{ github.ref_name }}" \
              --arg commit "${{ github.sha }}" \
              --arg event "${{ github.event_name }}" \
              --arg actor "${{ github.actor }}" \
              --arg logs "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{channel: "github-updates", username: "GitHub Actions", text: ("WSL Proxy E2E Tests FAILED :x:\n*Environment:* \($env)\n*Tests:* \($failed) failed, \($passed) passed out of \($total) (\($skipped) skipped)\n*Target:* \($target)\n*Branch:* \($branch)\n*Commit:* `\($commit)`\n*Triggered by:* \($event) (\($actor))\n*Screenshots & Traces:* Download from workflow artifacts\n*Workflow logs:* \($logs)")}')"

      - name: Upload screenshot to Slack
        if: failure() && env.SLACK_BOT_TOKEN != ''
        working-directory: .
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          # Find the first failure screenshot
          SCREENSHOT=$(find openresty-admin/test-results -name "*.png" -type f | head -1)
          if [ -n "$SCREENSHOT" ]; then
            echo "Uploading screenshot: $SCREENSHOT"
            curl -s -F "file=@$SCREENSHOT" \
              -F "channels=github-updates" \
              -F "initial_comment=WSL Proxy E2E test failure screenshot (${{ matrix.environment }}) — ${{ github.ref_name }} (${{ github.sha }})" \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              https://slack.com/api/files.upload
          else
            echo "No screenshot found to upload."
          fi
