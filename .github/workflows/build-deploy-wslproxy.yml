name: Build and Deploy WSLProxy
# Pipeline: Validate → Int → Smoke Test → Test → Acc → Prod (pop0 + lon1)
# Promotion pipeline: each environment must pass before the next deploys
# Default: code-only deploy (lua, nginx conf, data, admin UI). Tick FULL_BUILD to compile OpenResty & update OS packages.

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - dummy-branch-for-wslproxy-deploy

  workflow_dispatch:
    inputs:
      DEPLOY_BRANCH:
        type: string
        description: "Branch to deploy (type any existing branch name)"
        default: "release"
        required: true

      TARGET_ENV:
        type: choice
        description: "Please choose the Target environment"
        default: "prod"
        required: true
        options:
          - int
          - test
          - acc
          - prod

      TARGET_HOST:
        type: choice
        description: "Please choose the Target host"
        default: "all"
        required: true
        options:
          - all
          - 192.168.1.193
          - 192.168.1.140
          - 187.77.179.206
          - 187.124.112.155
          - 72.62.211.28
          - 187.124.112.156

      DEPLOY_DASHBOARD_ONLY:
        type: boolean
        description: "Only rebuild & deploy openresty-admin dashboard UI (skip full build)"
        default: false

      FULL_BUILD:
        type: boolean
        description: "Full build: compile OpenResty, install luarocks, update OS packages (slow). Default: off (code-only deploy)"
        default: false

# Prevent concurrent deployments to same ref (but don't cancel in-progress)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_BRANCH: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}
  DEPLOY_DASHBOARD_ONLY: ${{ github.event.inputs.DEPLOY_DASHBOARD_ONLY || 'false' }}
  FULL_BUILD: ${{ github.event.inputs.FULL_BUILD || 'false' }}
  TARGET_HOST: ${{ github.event.inputs.TARGET_HOST || 'all' }}
  TARGET_ENV: ${{ github.event.inputs.TARGET_ENV || 'prod' }}

jobs:
  # ──────────────────────────────────────────────────────
  # Stage 1: Build & Validate
  # ──────────────────────────────────────────────────────
  build-validate:
    name: "Stage 1: Build & Validate"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Validate all JSON config files
        run: |
          echo "=== Validating All JSON Configs ==="
          ERRORS=0
          VALID=0
          for dir in data/servers data/rules data/waf_rules data/waf_policies; do
            for file in $(find "$dir" -name '*.json' 2>/dev/null); do
              if python3 -m json.tool "$file" > /dev/null 2>&1; then
                VALID=$((VALID+1))
              else
                echo "::error file=$file::Invalid JSON syntax"
                ERRORS=$((ERRORS+1))
              fi
            done
          done
          echo "Total: $VALID valid, $ERRORS invalid"
          if [ $ERRORS -gt 0 ]; then exit 1; fi

      - name: Validate Jinja2 templates
        run: |
          pip3 -q install jinja2
          ERRORS=0
          for file in $(find devops/ansible/roles -name '*.j2' 2>/dev/null); do
            if python3 -c "
          from jinja2 import Environment, BaseLoader, exceptions
          env = Environment(loader=BaseLoader(), undefined=__import__('jinja2').Undefined)
          try:
              env.parse(open('$file').read())
          except exceptions.TemplateSyntaxError as e:
              print(f'Syntax error in $file: {e}')
              exit(1)
          " 2>/dev/null; then
              true
            else
              echo "::error file=$file::Invalid Jinja2 template"
              ERRORS=$((ERRORS+1))
            fi
          done
          if [ $ERRORS -gt 0 ]; then exit 1; fi
          echo "All templates valid"

      - name: Slack notify - Validation failed
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: github-updates
          SLACK_COLOR: danger
          SLACK_ICON: https://github.com/rtCamp.png?size=48
          SLACK_MESSAGE: |
            :x: *Stage 1 FAILED: Build & Validate*
            Config validation errors found — pipeline stopped.
            *Branch:* ${{ github.ref_name }} | *Commit:* `${{ github.sha }}`
            *Triggered by:* ${{ github.actor }} (${{ github.event_name }})
            *Logs:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_TITLE: "WSLProxy Pipeline Failed — Stage 1"
          SLACK_USERNAME: GitHub Actions
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ──────────────────────────────────────────────────────
  # Stage 2: Deploy Int (192.168.1.193 — local connection)
  # ──────────────────────────────────────────────────────
  deploy-int:
    name: "Stage 2: Deploy Int (192.168.1.193)"
    runs-on: [self-hosted, Linux]
    needs: [build-validate]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Install Ansible
        run: |
          if command -v zypper &> /dev/null; then
            sudo zypper install -y ansible
          elif command -v apt-get &> /dev/null; then
            sudo apt-get install -y ansible
          else
            echo "::error::No supported package manager found (zypper or apt-get)"
            exit 1
          fi
      - name: Decode settings file (INT)
        run: |
          echo "${{ secrets.DOT_WSLPROXY_SETTINGS_INT }}" | base64 -d > /tmp/settings_brahmstra_192.168.1.193.json
          if [ ! -s /tmp/settings_brahmstra_192.168.1.193.json ]; then
            echo "::error::INT settings file is empty or failed to decode"
            exit 1
          fi
          python3 -m json.tool /tmp/settings_brahmstra_192.168.1.193.json > /dev/null 2>&1 || {
            echo "::error::INT settings file contains invalid JSON"; exit 1;
          }
          echo "INT settings validated"

      - name: Decode env file (INT)
        run: |
          echo "${{ secrets.DOT_WSLPROXY_ENV_CREDS_INT }}" | base64 -d > /tmp/.env_brahmstra_192.168.1.193
          if [ ! -s /tmp/.env_brahmstra_192.168.1.193 ]; then
            echo "::warning::INT env file is empty (may be expected)"
          fi

      - name: "Prepare: Clean up Docker resources"
        run: |
          echo "Pruning unused Docker resources on 192.168.1.193..."
          sudo docker system prune -y 2>&1 || echo "::warning::Docker prune failed (docker may not be installed)"
          echo "Docker cleanup complete"

      - name: Run Ansible Playbook (192.168.1.193 / int)
        timeout-minutes: 25
        run: |
          TAGS_FLAG=""
          if [[ "${{ env.DEPLOY_DASHBOARD_ONLY }}" == "true" ]]; then
            TAGS_FLAG="--tags dashboard"
            echo "Dashboard-only deploy to 192.168.1.193 (env: int)"
          elif [[ "${{ env.FULL_BUILD }}" != "true" ]]; then
            TAGS_FLAG="--skip-tags base_packages,build"
            echo "Code-only deploy to 192.168.1.193 (env: int) — skipping OS updates and OpenResty build"
          else
            echo "Full build + deploy to 192.168.1.193 (env: int) via local connection"
          fi
          sudo ansible-playbook devops/ansible/wslproxy-ops.yml \
            -i devops/ansible/hosts \
            -l 192.168.1.193 \
            --connection=local \
            $TAGS_FLAG \
            --extra-vars "nginx_user_password=THISCOMESFROMSECRETS target_env=int local_settings_file_path=/tmp/settings_brahmstra_192.168.1.193.json local_env_file_path=/tmp/.env_brahmstra_192.168.1.193"

      - name: Deploy server configs and rules (int)
        timeout-minutes: 5
        run: |
          echo "Deploying server configs for env: int to 192.168.1.193"
          sudo ansible-playbook devops/ansible/deploy-configs.yml \
            -i devops/ansible/hosts \
            -l 192.168.1.193 \
            --connection=local \
            -e "target_env=int local_data_dir=${{ github.workspace }}/data"

      - name: Post-deploy health gate
        run: |
          echo "Verifying int deployment on 192.168.1.193..."

          sudo /usr/local/openresty/bin/openresty -t 2>&1 || {
            echo "::error::Nginx config syntax check failed on 192.168.1.193"; exit 1;
          }

          sudo systemctl is-active openresty 2>&1 || {
            echo "::error::OpenResty service is not running on 192.168.1.193"; exit 1;
          }

          for i in $(seq 1 12); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "OpenResty responding (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i/12: HTTP $STATUS — waiting 5s..."
            sleep 5
          done
          echo "::error::OpenResty not responding on 192.168.1.193 after 60s"
          exit 1

      - name: Slack notify - Int deploy failed
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: github-updates
          SLACK_COLOR: danger
          SLACK_ICON: https://github.com/rtCamp.png?size=48
          SLACK_MESSAGE: |
            :x: *Stage 2 FAILED: Deploy Int (192.168.1.193)*
            Deployment or post-deploy health check failed — pipeline stopped.
            *Branch:* ${{ github.ref_name }} | *Commit:* `${{ github.sha }}`
            *Triggered by:* ${{ github.actor }} (${{ github.event_name }})
            *Logs:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_TITLE: "WSLProxy Pipeline Failed — Stage 2 (Int)"
          SLACK_USERNAME: GitHub Actions
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ──────────────────────────────────────────────────────
  # Stage 3: Smoke Test Int Environment
  # ──────────────────────────────────────────────────────
  test-int:
    name: "Stage 3: Smoke Test Int"
    runs-on: [self-hosted, Linux]
    needs: [deploy-int]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.19'
          cache: false

      - name: Run health check tests (Go)
        working-directory: QA
        env:
          TARGET_HOST: "http://localhost:8080"
        run: |
          go test -v -run TestHealthCheck -timeout 60s 2>&1 | tee health-results.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Go health check tests failed"
            exit 1
          fi
          echo "Health check tests passed"

      - name: Verify API endpoints
        run: |
          FAILED=0
          # Core health check on port 8080 (always available)
          for ENDPOINT in /health; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://localhost:8080${ENDPOINT}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              printf "  GET :8080%-20s OK (%s)\n" "$ENDPOINT" "$STATUS"
            else
              printf "  GET :8080%-20s FAIL (%s)\n" "$ENDPOINT" "$STATUS"
              FAILED=$((FAILED+1))
            fi
          done
          # API endpoints on port 8080 (require admin UI enabled, non-blocking)
          for ENDPOINT in /health /api/servers /api/rules /api/waf_rules /api/waf_policies; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://localhost:8080${ENDPOINT}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              printf "  GET :8080%-20s OK (%s)\n" "$ENDPOINT" "$STATUS"
            else
              printf "  GET :8080%-20s SKIP (%s) - requires admin UI\n" "$ENDPOINT" "$STATUS"
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "::error::$FAILED core endpoint check(s) failed on 192.168.1.193"
            exit 1
          fi
          echo "All core endpoint checks passed"

      - name: Slack notify - Tests failed
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: github-updates
          SLACK_COLOR: danger
          SLACK_ICON: https://github.com/rtCamp.png?size=48
          SLACK_MESSAGE: |
            :x: *Stage 3 FAILED: Smoke Test Int*
            Health check or API endpoint tests failed — pipeline stopped before test environment.
            *Branch:* ${{ github.ref_name }} | *Commit:* `${{ github.sha }}`
            *Triggered by:* ${{ github.actor }} (${{ github.event_name }})
            *Logs:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_TITLE: "WSLProxy Pipeline Failed — Stage 3 (Smoke Test)"
          SLACK_USERNAME: GitHub Actions
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ──────────────────────────────────────────────────────
  # Stage 4: Deploy Test (192.168.1.140)
  # ──────────────────────────────────────────────────────
  deploy-test:
    name: "Stage 4: Deploy Test (192.168.1.140)"
    runs-on: [self-hosted, Linux]
    needs: [test-int]
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.TARGET_HOST == '192.168.1.140' || github.event.inputs.TARGET_HOST == 'all'))
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Install Ansible
        run: |
          if command -v zypper &> /dev/null; then
            sudo zypper install -y ansible
          elif command -v apt-get &> /dev/null; then
            sudo apt-get install -y ansible
          else
            echo "::error::No supported package manager found (zypper or apt-get)"
            exit 1
          fi

      - name: Validate secrets files exist (TEST)
        run: |
          SETTINGS="/home/bwalia/.secrets/wslproxy/test/settings.json"
          ENVFILE="/home/bwalia/.secrets/wslproxy/test/.env"
          if [ ! -f "$SETTINGS" ]; then
            echo "::error::Settings file not found: $SETTINGS"
            exit 1
          fi
          python3 -m json.tool "$SETTINGS" > /dev/null 2>&1 || {
            echo "::error::Settings file contains invalid JSON"; exit 1;
          }
          if [ ! -f "$ENVFILE" ]; then
            echo "::warning::Env file not found: $ENVFILE (may be expected)"
          fi
          echo "TEST secrets validated"

      - name: Setup SSH and test connectivity
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H 192.168.1.140 >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o BatchMode=yes -o ConnectTimeout=10 bwalia@192.168.1.140 "echo 'SSH OK'" 2>&1 || {
            echo "::error::SSH connection failed to bwalia@192.168.1.140"; exit 1;
          }

      - name: Run Ansible Playbook (TEST)
        timeout-minutes: 25
        run: |
          TAGS_FLAG=""
          if [[ "${{ env.DEPLOY_DASHBOARD_ONLY }}" == "true" ]]; then
            TAGS_FLAG="--tags dashboard"
            echo "Dashboard-only deploy to test: 192.168.1.140"
          elif [[ "${{ env.FULL_BUILD }}" != "true" ]]; then
            TAGS_FLAG="--skip-tags base_packages,build"
            echo "Code-only deploy to test: 192.168.1.140 — skipping OS updates and OpenResty build"
          else
            echo "Full build + deploy to test: 192.168.1.140"
          fi
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook devops/ansible/wslproxy-ops.yml \
            -i devops/ansible/hosts \
            -l 192.168.1.140 \
            --timeout 30 \
            $TAGS_FLAG \
            --extra-vars "nginx_user_password=THISCOMESFROMSECRETS target_env=test local_settings_file_path=/home/bwalia/.secrets/wslproxy/test/settings.json local_env_file_path=/home/bwalia/.secrets/wslproxy/test/.env"

      - name: Deploy server configs and rules (test)
        timeout-minutes: 5
        run: |
          echo "Deploying server configs for env: test to 192.168.1.140"
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook devops/ansible/deploy-configs.yml \
            -i devops/ansible/hosts \
            -e "target_env=test local_data_dir=${{ github.workspace }}/data" \
            -l 192.168.1.140

      - name: Post-deploy health gate
        run: |
          echo "Verifying test deployment on 192.168.1.140..."

          ssh -o BatchMode=yes -o ConnectTimeout=10 bwalia@192.168.1.140 \
            "sudo /usr/local/openresty/bin/openresty -t" 2>&1 || {
            echo "::error::Nginx config test failed on 192.168.1.140"; exit 1;
          }

          ssh -o BatchMode=yes -o ConnectTimeout=10 bwalia@192.168.1.140 \
            "sudo systemctl is-active openresty" 2>&1 || {
            echo "::error::OpenResty not running on 192.168.1.140"; exit 1;
          }

          for i in $(seq 1 12); do
            STATUS=$(ssh -o BatchMode=yes -o ConnectTimeout=10 bwalia@192.168.1.140 \
              "curl -sf -o /dev/null -w '%{http_code}' http://localhost:8080/health 2>/dev/null" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Test endpoint healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i/12: HTTP $STATUS — waiting 5s..."
            sleep 5
          done
          echo "::error::Test server not responding on 192.168.1.140 after 60s"
          exit 1

      - name: Slack notify - Test deploy failed
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: github-updates
          SLACK_COLOR: danger
          SLACK_ICON: https://github.com/rtCamp.png?size=48
          SLACK_MESSAGE: |
            :x: *Stage 4 FAILED: Deploy Test (192.168.1.140)*
            Deployment or health check failed — pipeline stopped before acceptance.
            *Branch:* ${{ github.ref_name }} | *Commit:* `${{ github.sha }}`
            *Triggered by:* ${{ github.actor }} (${{ github.event_name }})
            *Logs:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_TITLE: "WSLProxy Pipeline Failed — Stage 4 (Test)"
          SLACK_USERNAME: GitHub Actions
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ──────────────────────────────────────────────────────
  # Stage 5: Deploy Acc (187.77.179.206)
  # ──────────────────────────────────────────────────────
  deploy-acc:
    name: "Stage 5: Deploy Acc (187.77.179.206)"
    runs-on: [self-hosted, Linux]
    needs: [deploy-test]
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.TARGET_HOST == '187.77.179.206' || github.event.inputs.TARGET_HOST == 'all'))
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Install Ansible
        run: |
          if command -v zypper &> /dev/null; then
            sudo zypper install -y ansible
          elif command -v apt-get &> /dev/null; then
            sudo apt-get install -y ansible
          else
            echo "::error::No supported package manager found (zypper or apt-get)"
            exit 1
          fi

      - name: Validate secrets files exist (ACC)
        run: |
          SETTINGS="/home/bwalia/.secrets/wslproxy/acc/settings.json"
          ENVFILE="/home/bwalia/.secrets/wslproxy/acc/.env"
          if [ ! -f "$SETTINGS" ]; then
            echo "::error::Settings file not found: $SETTINGS"
            exit 1
          fi
          python3 -m json.tool "$SETTINGS" > /dev/null 2>&1 || {
            echo "::error::Settings file contains invalid JSON"; exit 1;
          }
          if [ ! -f "$ENVFILE" ]; then
            echo "::warning::Env file not found: $ENVFILE (may be expected)"
          fi
          echo "ACC secrets validated"

      - name: Setup SSH and test connectivity
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H 187.77.179.206 >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o ConnectTimeout=10 root@187.77.179.206 "echo 'SSH OK'" 2>&1 || {
            echo "::error::SSH connection failed to root@187.77.179.206"; exit 1;
          }

      - name: "Prepare: Clean up Docker resources"
        run: |
          echo "Pruning unused Docker resources on 187.77.179.206..."
          ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o ConnectTimeout=10 root@187.77.179.206 \
            "docker system prune -y" 2>&1 || echo "::warning::Docker prune failed on ACC"
          echo "Docker cleanup complete"

      - name: Run Ansible Playbook (ACC)
        timeout-minutes: 25
        run: |
          TAGS_FLAG=""
          if [[ "${{ env.DEPLOY_DASHBOARD_ONLY }}" == "true" ]]; then
            TAGS_FLAG="--tags dashboard"
            echo "Dashboard-only deploy to ACC: 187.77.179.206"
          elif [[ "${{ env.FULL_BUILD }}" != "true" ]]; then
            TAGS_FLAG="--skip-tags base_packages,build"
            echo "Code-only deploy to ACC: 187.77.179.206 — skipping OS updates and OpenResty build"
          else
            echo "Full build + deploy to ACC: 187.77.179.206"
          fi
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook devops/ansible/wslproxy-ops.yml \
            -i devops/ansible/hosts \
            -l 187.77.179.206 \
            --private-key ~/.ssh/id_rsa \
            --timeout 30 \
            $TAGS_FLAG \
            --extra-vars "nginx_user_password=THISCOMESFROMSECRETS target_env=acc local_settings_file_path=/home/bwalia/.secrets/wslproxy/acc/settings.json local_env_file_path=/home/bwalia/.secrets/wslproxy/acc/.env"

      - name: Deploy server configs and rules (acc)
        timeout-minutes: 5
        run: |
          echo "Deploying server configs for env: acc to 187.77.179.206"
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook devops/ansible/deploy-configs.yml \
            -i devops/ansible/hosts \
            -e "target_env=acc local_data_dir=${{ github.workspace }}/data" \
            -l 187.77.179.206 \
            --private-key ~/.ssh/id_rsa

      - name: Post-deploy health gate
        run: |
          echo "Verifying ACC deployment on 187.77.179.206..."

          ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o ConnectTimeout=10 root@187.77.179.206 \
            "/usr/local/openresty/bin/openresty -t" 2>&1 || {
            echo "::error::Nginx config test failed on 187.77.179.206"; exit 1;
          }

          ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o ConnectTimeout=10 root@187.77.179.206 \
            "systemctl is-active openresty" 2>&1 || {
            echo "::error::OpenResty not running on 187.77.179.206"; exit 1;
          }

          for i in $(seq 1 12); do
            STATUS=$(ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o ConnectTimeout=10 root@187.77.179.206 \
              "curl -sf -o /dev/null -w '%{http_code}' http://localhost:8080/health 2>/dev/null" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "ACC endpoint healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i/12: HTTP $STATUS — waiting 5s..."
            sleep 5
          done
          echo "::error::ACC not responding on 187.77.179.206 after 60s"
          exit 1

      - name: Slack notify - ACC deployed
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: github-updates
          SLACK_COLOR: good
          SLACK_ICON: https://github.com/rtCamp.png?size=48
          SLACK_MESSAGE: |
            :white_check_mark: *WSLProxy deployed to ACC*
            Acceptance environment deployment complete.
            *Host:* 187.77.179.206 | *Env:* acc
            *Branch:* ${{ github.ref_name }} | *Commit:* `${{ github.sha }}`
            *Triggered by:* ${{ github.actor }} (${{ github.event_name }})
          SLACK_TITLE: "WSLProxy ACC Deployment — Success"
          SLACK_USERNAME: GitHub Actions
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

      - name: Slack notify - ACC deploy failed
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: github-updates
          SLACK_COLOR: danger
          SLACK_ICON: https://github.com/rtCamp.png?size=48
          SLACK_MESSAGE: |
            :x: *Stage 5 FAILED: Deploy ACC (187.77.179.206)*
            Deployment or health check failed — pipeline stopped before production.
