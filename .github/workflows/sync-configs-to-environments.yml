name: Sync Configs to Environments

# Pulls environment-specific server/rule configs from S3 and deploys them
# to the matching WSLProxy instances via Ansible (SSH).
# S3 data is populated by the daily sync-prod-data-to-s3 workflow at 04:00.
#
# Pipeline:  int (self-hosted) → test (self-hosted) → acc (ubuntu-latest)

on:
  # Daily at 04:30 UTC (runs after the prod-to-S3 sync at 04:00)
  schedule:
    - cron: "30 4 * * *"

  # Manual trigger with environment selector
  workflow_dispatch:
    inputs:
      TARGET_ENVS:
        type: choice
        description: "Which environments to sync"
        default: "all"
        required: true
        options:
          - all
          - int
          - test
          - acc

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────────────
  # Stage 1: Deploy int configs (self-hosted runner —
  #           int host is on local network)
  # ──────────────────────────────────────────────────────
  sync-int:
    name: "Sync configs → Int"
    runs-on: [self-hosted, Linux]
    if: >-
      github.event.inputs.TARGET_ENVS == 'all'
      || github.event.inputs.TARGET_ENVS == 'int'
      || github.event_name == 'schedule'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Ansible and AWS CLI
        run: |
          if command -v zypper &> /dev/null; then
            sudo zypper install -y ansible
          elif command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ansible
          else
            echo "::error::No supported package manager found"
            exit 1
          fi
          # Install AWS CLI if not present
          if ! command -v aws &> /dev/null; then
            echo "Installing AWS CLI..."
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -qo /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install --update
            rm -rf /tmp/awscliv2.zip /tmp/aws
          fi
          echo "AWS CLI version: $(aws --version)"

      - name: Setup SSH known hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H 192.168.1.193 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download int configs from S3
        run: |
          S3_BUCKET="${{ secrets.WSLPROXY_S3_BUCKET }}"
          mkdir -p s3-data/servers/int s3-data/rules/int

          echo "Downloading int configs from s3://${S3_BUCKET}/data/"
          aws s3 sync "s3://${S3_BUCKET}/data/servers/int/" s3-data/servers/int/
          aws s3 sync "s3://${S3_BUCKET}/data/rules/int/"   s3-data/rules/int/

          S3_SERVERS=$(find s3-data/servers/int -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          S3_RULES=$(find s3-data/rules/int -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "Downloaded from S3: ${S3_SERVERS} server(s), ${S3_RULES} rule(s)"

      - name: Merge S3 configs on top of repo configs
        run: |
          REPO_SERVERS=$(find data/servers/int -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          REPO_RULES=$(find data/rules/int -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "Repo baseline: ${REPO_SERVERS} server(s), ${REPO_RULES} rule(s)"

          # Merge S3 configs on top of repo data (S3 wins on conflict, no delete)
          rsync -av s3-data/servers/int/ data/servers/int/
          rsync -av s3-data/rules/int/   data/rules/int/

          MERGED_SERVERS=$(find data/servers/int -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          MERGED_RULES=$(find data/rules/int -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "After merge: ${MERGED_SERVERS} server(s), ${MERGED_RULES} rule(s) to deploy"

      - name: Validate int JSON configs
        run: |
          ERRORS=0
          for file in data/servers/int/*.json data/rules/int/*.json; do
            [ -f "$file" ] || continue
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "::error::Invalid JSON: $(basename "$file")"
              ERRORS=$((ERRORS+1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS invalid JSON file(s) — aborting"
            exit 1
          fi
          echo "All int JSON configs valid"

      - name: Deploy int configs via Ansible
        run: |
          echo "Deploying int configs to 192.168.1.193"
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook infra/ansible/deploy-configs.yml \
            -i infra/ansible/hosts \
            -l 192.168.1.193 \
            -e "target_env=int" \
            -e "local_data_dir=${{ github.workspace }}/data" \
            -e "reload_nginx=true"
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ~/.ssh/id_rsa
          # Suppress diff output to avoid leaking secret values in logs
          ANSIBLE_DISPLAY_ARGS_TO_STDOUT: "False"

      - name: Verify deployed files on int
        run: |
          echo "=== Deployed server configs on int ==="
          ssh -o BatchMode=yes -o ConnectTimeout=10 bwalia@192.168.1.193 \
            "ls -la /opt/nginx/data/servers/int/" 2>&1
          echo ""
          echo "=== Deployed rule configs on int ==="
          ssh -o BatchMode=yes -o ConnectTimeout=10 bwalia@192.168.1.193 \
            "ls -la /opt/nginx/data/rules/int/" 2>&1

      - name: Health check int
        run: |
          HTTP_CODE=$(ssh -o BatchMode=yes -o ConnectTimeout=10 bwalia@192.168.1.193 \
            "curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ping" 2>&1) || true
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Int health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Int health check passed (HTTP 200)"

  # ──────────────────────────────────────────────────────
  # Stage 2: Deploy test configs (self-hosted runner —
  #           test host is on local network)
  # ──────────────────────────────────────────────────────
  sync-test:
    name: "Sync configs → Test"
    runs-on: [self-hosted, Linux]
    if: >-
      github.event.inputs.TARGET_ENVS == 'all'
      || github.event.inputs.TARGET_ENVS == 'test'
      || github.event_name == 'schedule'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Ansible and AWS CLI
        run: |
          if command -v zypper &> /dev/null; then
            sudo zypper install -y ansible
          elif command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ansible
          else
            echo "::error::No supported package manager found"
            exit 1
          fi
          # Install AWS CLI if not present
          if ! command -v aws &> /dev/null; then
            echo "Installing AWS CLI..."
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -qo /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install --update
            rm -rf /tmp/awscliv2.zip /tmp/aws
          fi
          echo "AWS CLI version: $(aws --version)"

      - name: Setup SSH known hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H 192.168.1.140 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download test configs from S3
        run: |
          S3_BUCKET="${{ secrets.WSLPROXY_S3_BUCKET }}"
          mkdir -p s3-data/servers/test s3-data/rules/test

          echo "Downloading test configs from s3://${S3_BUCKET}/data/"
          aws s3 sync "s3://${S3_BUCKET}/data/servers/test/" s3-data/servers/test/
          aws s3 sync "s3://${S3_BUCKET}/data/rules/test/"   s3-data/rules/test/

          S3_SERVERS=$(find s3-data/servers/test -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          S3_RULES=$(find s3-data/rules/test -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "Downloaded from S3: ${S3_SERVERS} server(s), ${S3_RULES} rule(s)"

      - name: Merge S3 configs on top of repo configs
        run: |
          mkdir -p data/servers/test data/rules/test
          REPO_SERVERS=$(find data/servers/test -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          REPO_RULES=$(find data/rules/test -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "Repo baseline: ${REPO_SERVERS} server(s), ${REPO_RULES} rule(s)"

          # Merge S3 configs on top of repo data (S3 wins on conflict, no delete)
          rsync -av s3-data/servers/test/ data/servers/test/
          rsync -av s3-data/rules/test/   data/rules/test/

          MERGED_SERVERS=$(find data/servers/test -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          MERGED_RULES=$(find data/rules/test -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "After merge: ${MERGED_SERVERS} server(s), ${MERGED_RULES} rule(s) to deploy"

      - name: Validate test JSON configs
        run: |
          ERRORS=0
          for file in data/servers/test/*.json data/rules/test/*.json; do
            [ -f "$file" ] || continue
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "::error::Invalid JSON: $(basename "$file")"
              ERRORS=$((ERRORS+1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS invalid JSON file(s) — aborting"
            exit 1
          fi
          echo "All test JSON configs valid"

      - name: Deploy test configs via Ansible
        run: |
          echo "Deploying test configs to 192.168.1.140"
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook infra/ansible/deploy-configs.yml \
            -i infra/ansible/hosts \
            -l 192.168.1.140 \
            -e "target_env=test" \
            -e "local_data_dir=${{ github.workspace }}/data" \
            -e "reload_nginx=true"
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ~/.ssh/id_rsa
          ANSIBLE_DISPLAY_ARGS_TO_STDOUT: "False"

      - name: Health check test
        run: |
          HTTP_CODE=$(ssh -o BatchMode=yes -o ConnectTimeout=10 bwalia@192.168.1.140 \
            "curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ping" 2>&1) || true
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Test health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Test health check passed (HTTP 200)"

  # ──────────────────────────────────────────────────────
  # Stage 3: Deploy acc configs (ubuntu-latest —
  #           acc host is publicly reachable)
  # ──────────────────────────────────────────────────────
  sync-acc:
    name: "Sync configs → Acc"
    runs-on: ubuntu-latest
    if: >-
      github.event.inputs.TARGET_ENVS == 'all'
      || github.event.inputs.TARGET_ENVS == 'acc'
      || github.event_name == 'schedule'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 187.77.179.206 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connectivity
        run: |
          ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o ConnectTimeout=10 \
            root@187.77.179.206 "echo 'SSH OK'" 2>&1 || {
            echo "::error::SSH connection failed to acc host"
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download acc configs from S3
        run: |
          S3_BUCKET="${{ secrets.WSLPROXY_S3_BUCKET }}"
          mkdir -p s3-data/servers/acc s3-data/rules/acc

          echo "Downloading acc configs from s3://${S3_BUCKET}/data/"
          aws s3 sync "s3://${S3_BUCKET}/data/servers/acc/" s3-data/servers/acc/ 2>/dev/null || true
          aws s3 sync "s3://${S3_BUCKET}/data/rules/acc/"   s3-data/rules/acc/   2>/dev/null || true

          S3_SERVERS=$(find s3-data/servers/acc -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          S3_RULES=$(find s3-data/rules/acc -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "Downloaded from S3: ${S3_SERVERS} server(s), ${S3_RULES} rule(s)"

      - name: Merge S3 configs on top of repo configs
        run: |
          mkdir -p data/servers/acc data/rules/acc
          REPO_SERVERS=$(find data/servers/acc -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          REPO_RULES=$(find data/rules/acc -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "Repo baseline: ${REPO_SERVERS} server(s), ${REPO_RULES} rule(s)"

          # Merge S3 configs on top of repo data (S3 wins on conflict, no delete)
          rsync -av s3-data/servers/acc/ data/servers/acc/
          rsync -av s3-data/rules/acc/   data/rules/acc/

          MERGED_SERVERS=$(find data/servers/acc -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          MERGED_RULES=$(find data/rules/acc -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "After merge: ${MERGED_SERVERS} server(s), ${MERGED_RULES} rule(s) to deploy"

      - name: Validate acc JSON configs
        run: |
          ERRORS=0
          for file in data/servers/acc/*.json data/rules/acc/*.json; do
            [ -f "$file" ] || continue
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "::error::Invalid JSON: $(basename "$file")"
              ERRORS=$((ERRORS+1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS invalid JSON file(s) — aborting"
            exit 1
          fi
          echo "All acc JSON configs valid"

      - name: Deploy acc configs via Ansible
        run: |
          echo "Deploying acc configs to 187.77.179.206"
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook infra/ansible/deploy-configs.yml \
            -i infra/ansible/hosts \
            -l 187.77.179.206 \
            -e "target_env=acc" \
            -e "local_data_dir=${{ github.workspace }}/data" \
            -e "reload_nginx=true"
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ~/.ssh/id_rsa
          ANSIBLE_DISPLAY_ARGS_TO_STDOUT: "False"

      - name: Health check acc
        run: |
          ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o ConnectTimeout=10 \
            root@187.77.179.206 \
            "curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ping" 2>&1 | {
            read HTTP_CODE
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Acc health check failed (HTTP $HTTP_CODE)"
              exit 1
            fi
            echo "Acc health check passed (HTTP 200)"
          }

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa

  # ──────────────────────────────────────────────────────
  # Summary
  # ──────────────────────────────────────────────────────
  summary:
    name: "Sync Summary"
    runs-on: ubuntu-latest
    needs: [sync-int, sync-test, sync-acc]
    if: always()
    steps:
      - name: Results
        run: |
          echo "=========================================="
          echo "Sync Configs to Environments — Summary"
          echo "=========================================="
          echo "Int sync:  ${{ needs.sync-int.result }}"
          echo "Test sync: ${{ needs.sync-test.result }}"
          echo "Acc sync:  ${{ needs.sync-acc.result }}"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="
