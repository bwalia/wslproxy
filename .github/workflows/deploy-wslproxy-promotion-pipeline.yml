name: CI/CD Promotion Pipeline (main → int → test)
# Deploys from main branch through non-production environments: int → smoke test → test.
# (The `acc` tier on 187.77.179.206 was decommissioned — promotion
# now stops at `test` and prod releases run from the release branch
# via deploy-wslproxy-delivery-pipeline.yml.)
#
# Auto-trigger policy (push to `main`):
#   - int  → `full`  (everything: api code, nginx, servers, both admin
#                     UIs, os_deps, build).  This is the canary host
#                     where every layer is verified before promotion.
#   - test → `code`  (Lua api/* only — int already proved the rest).
#
# Manual `workflow_dispatch` lets ops pick any DEPLOY_MODE and stop
# at any TARGET_ENV — useful for surgical redeploys (e.g. push only
# `dashboard-next` to test after an admin-UI hotfix).
#
# Production hosts are never touched here — use
# deploy-wslproxy-delivery-pipeline.yml for production releases from
# the release branch.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      DEPLOY_MODE:
        type: choice
        description: "What to deploy (full = everything; specific layers for surgical updates)"
        default: "full"
        required: true
        options:
          - full
          - code
          - nginx
          - servers
          - dashboard
          - dashboard-next
          - os_deps
          - build

      TARGET_ENV:
        type: choice
        description: "How far to promote (stops after this environment)"
        default: "test"
        required: true
        options:
          - int
          - test

# Prevent concurrent promotions
concurrency:
  group: promotion-pipeline
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────
  # Stage 1: Validate configs on main branch
  # ──────────────────────────────────────────────────────
  validate:
    name: "Validate Configs (main)"
    # Was [self-hosted, Linux, int] — but this job only runs git
    # checkout + `python -m json.tool` over data/, neither of which
    # needs the int runner.  Moving to ubuntu-latest means the
    # promotion pipeline no longer gets STUCK AT STAGE 1 when int
    # is offline (which is what happened on run 28359601509).
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Show promotion settings
        run: |
          echo "Deploy mode: ${{ github.event.inputs.DEPLOY_MODE }}"
          echo "Promote to:  ${{ github.event.inputs.TARGET_ENV }}"
          echo "Branch:      main"

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate all JSON config files
        run: |
          echo "=== Validating All JSON Configs ==="
          ERRORS=0
          VALID=0
          for dir in data/servers data/rules data/waf_rules data/waf_policies; do
            for file in $(find "$dir" -name '*.json' 2>/dev/null); do
              if python3 -m json.tool "$file" > /dev/null 2>&1; then
                VALID=$((VALID+1))
              else
                echo "::error file=$file::Invalid JSON syntax"
                ERRORS=$((ERRORS+1))
              fi
            done
          done
          echo "Total: $VALID valid, $ERRORS invalid"
          if [ $ERRORS -gt 0 ]; then exit 1; fi

      - name: Slack notify - Validation failed
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          curl -sf -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg actor "${{ github.actor }}" \
              --arg logs "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{channel: "github-updates", username: "GitHub Actions", text: (":x: *Promotion Pipeline: Validation FAILED*\nConfig validation errors on main — promotion stopped.\n*Triggered by:* \($actor)\n*Logs:* \($logs)")}')"

  # ──────────────────────────────────────────────────────
  # Stage 1.5: Probe the int self-hosted runner.
  # Same pattern as the delivery pipeline — see that file for the
  # rationale.  Runs on ubuntu-latest (always available); falls back
  # to "assume online" on API failure so a permissions hiccup never
  # silently skips a real deploy.
  # ──────────────────────────────────────────────────────
  preflight-int:
    name: "Stage 1.5: Probe Int Runner"
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      runner_online: ${{ steps.probe.outputs.online }}
    steps:
      - name: Check if int self-hosted runner is online
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          ONLINE=true
          REASON="(fail-safe default — API not queried)"
          if API_OUT=$(gh api "/repos/${{ github.repository }}/actions/runners" 2>&1); then
            ONLINE_COUNT=$(printf '%s' "$API_OUT" | jq '
              [ .runners[]
                | select(any(.labels[]; .name == "int"))
                | select(.status == "online")
              ] | length
            ')
            if [ "${ONLINE_COUNT:-0}" -gt 0 ]; then
              ONLINE=true
              REASON="$ONLINE_COUNT online int runner(s) found"
            else
              ONLINE=false
              REASON="no online int runner — skipping deploy-int + smoke-test-int"
            fi
          else
            REASON="API query failed; assuming runner online. Response: $(printf '%s' "$API_OUT" | head -c 200)"
          fi
          echo "Decision: online=$ONLINE — $REASON"
          if [ "$ONLINE" = "false" ]; then
            echo "::warning::Int runner offline — deploy-int + smoke-test-int will be skipped. Pipeline will continue to test stage. Reason: $REASON"
          else
            echo "::notice::Int runner check passed — $REASON"
          fi
          echo "online=$ONLINE" >> "$GITHUB_OUTPUT"

      - name: Slack notify - Int skipped (runner offline)
        if: steps.probe.outputs.online == 'false'
        continue-on-error: true
        shell: bash
        run: |
          curl -sf -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg actor "${{ github.actor }}" \
              --arg logs "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{channel: "github-updates", username: "GitHub Actions", text: (":warning: *Promotion Pipeline — Int (192.168.1.193) SKIPPED*\nInt self-hosted runner is offline; deploy + smoke-test skipped, promotion continuing to test.\n*Triggered by:* \($actor)\n*Logs:* \($logs)")}')"

  # ──────────────────────────────────────────────────────
  # Stage 2: Deploy to Int (skipped when int runner is offline)
  # ──────────────────────────────────────────────────────
  deploy-int:
    needs: [validate, preflight-int]
    if: needs.preflight-int.outputs.runner_online == 'true'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: int
      env_label: "Int (192.168.1.193)"
      stage_number: "2"
      host_ip: "192.168.1.193"
      ssh_user: bwalia
      connection_mode: local
      # Secrets decrypted from committed SOPS+age files
      # (infra/secrets/<env>/) using the SOPS_AGE_KEY repo secret.
      secrets_mode: sops
      health_endpoint: "http://localhost:8080/health"
      health_check_mode: local
      docker_prune: false
      notify_success: false
      deploy_branch: main
      # int is the canary — push to main runs `full` so every layer
      # is exercised here before promoting code-only to test/acc.
      # Manual workflow_dispatch can override DEPLOY_MODE for a
      # scoped redeploy.
      deploy_mode: ${{ github.event.inputs.DEPLOY_MODE || 'full' }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      # Kept so emergency rollback to secrets_mode: github_secret works
      # without another commit.
      SETTINGS_SECRET: ${{ secrets.DOT_WSLPROXY_SETTINGS_INT }}
      ENV_CREDS_SECRET: ${{ secrets.DOT_WSLPROXY_ENV_CREDS_INT }}

  # ──────────────────────────────────────────────────────
  # Stage 3: Smoke Test Int
  # ──────────────────────────────────────────────────────
  # Skipped automatically when preflight-int says the runner is
  # offline (otherwise this job would also queue forever waiting
  # for the same offline runner).
  smoke-test-int:
    name: "Smoke Test Int"
    runs-on: [self-hosted, Linux, int]
    needs: [deploy-int, preflight-int]
    if: |
      always() && !failure() && !cancelled() &&
      needs.preflight-int.outputs.runner_online == 'true' &&
      needs.deploy-int.result == 'success'
    timeout-minutes: 10

    steps:
      # actions/checkout's git-clean cannot unlink root-owned build
      # artifacts left in the persistent self-hosted workspace (e.g.
      # openresty-admin-next/.next/BUILD_ID created by a prior root/sudo
      # Next.js build), which fails the Checkout step with EACCES and
      # blocks promotion. Reclaim ownership before checkout runs.
      - name: Pre-checkout cleanup (reclaim runner workspace)
        run: |
          if [ -n "$GITHUB_WORKSPACE" ] && [ -d "$GITHUB_WORKSPACE" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
            sudo rm -rf "$GITHUB_WORKSPACE/openresty-admin-next/.next" 2>/dev/null || true
          fi
        shell: bash

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.19"
          cache: false

      - name: Run health check tests (Go)
        working-directory: QA
        env:
          TARGET_HOST: "http://localhost:8080"
        run: |
          go test -v -run TestHealthCheck -timeout 60s 2>&1 | tee health-results.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Go health check tests failed"
            exit 1
          fi

      - name: Verify core endpoints
        run: |
          FAILED=0
          for ENDPOINT in /health; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://localhost:8080${ENDPOINT}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              printf "  GET :8080%-20s OK (%s)\n" "$ENDPOINT" "$STATUS"
            else
              printf "  GET :8080%-20s FAIL (%s)\n" "$ENDPOINT" "$STATUS"
              FAILED=$((FAILED+1))
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "::error::Core endpoint check failed"
            exit 1
          fi
          echo "All checks passed"

      - name: Slack notify - Smoke test failed
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          curl -sf -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg actor "${{ github.actor }}" \
              --arg logs "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{channel: "github-updates", username: "GitHub Actions", text: (":x: *Promotion Pipeline: Smoke Test FAILED on Int*\nPromotion stopped before test environment.\n*Triggered by:* \($actor)\n*Logs:* \($logs)")}')"

  # ──────────────────────────────────────────────────────
  # Stage 4: Deploy to Test (final stage in this pipeline —
  # `acc` was decommissioned, prod releases run from the release
  # branch via deploy-wslproxy-delivery-pipeline.yml)
  # ──────────────────────────────────────────────────────
  deploy-test:
    needs: [smoke-test-int]
    # `always() && !failure() && !cancelled()` lets test run when
    # smoke-test-int was SKIPPED (because the int runner was
    # offline) but NOT when it actually failed.  Without this, a
    # skipped int would cascade-skip test too — defeating the
    # whole point of the preflight gate above.
    if: >
      always() && !failure() && !cancelled() &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.TARGET_ENV == 'test')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: test
      env_label: "Test (192.168.1.140)"
      stage_number: "4"
      host_ip: "192.168.1.140"
      ssh_user: bwalia
      connection_mode: ssh
      secrets_mode: runner_file
      settings_file_path: "/home/bwalia/.secrets/wslproxy/test/settings.json"
      env_file_path: "/home/bwalia/.secrets/wslproxy/test/.env"
      health_endpoint: "http://localhost:8080/health"
      health_check_mode: ssh
      docker_prune: false
      notify_success: true
      deploy_branch: main
      # Push to main → `code` only (int already proved every other
      # layer in the canary stage above).  Manual workflow_dispatch
      # can override DEPLOY_MODE for a scoped or `full` redeploy.
      deploy_mode: ${{ github.event.inputs.DEPLOY_MODE || 'code' }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ──────────────────────────────────────────────────────
  # Summary
  # ──────────────────────────────────────────────────────
  summary:
    name: Promotion Summary
    runs-on: ubuntu-latest
    needs: [validate, deploy-int, smoke-test-int, deploy-test]
    if: always()
    steps:
      - name: Promotion Summary
        run: |
          echo "============================================"
          echo "  CI/CD Promotion Pipeline Summary"
          echo "============================================"
          echo ""
          echo "  Deploy mode: ${{ github.event.inputs.DEPLOY_MODE }}"
          echo "  Target env:  ${{ github.event.inputs.TARGET_ENV }}"
          echo "  Branch:      main"
          echo ""
          echo "  Validate:        ${{ needs.validate.result }}"
          echo "  Deploy Int:      ${{ needs.deploy-int.result }}"
          echo "  Smoke Test Int:  ${{ needs.smoke-test-int.result }}"
          echo "  Deploy Test:     ${{ needs.deploy-test.result }}"
          echo ""
          echo "  Commit:  ${{ github.sha }}"
          echo "  Trigger: ${{ github.actor }}"
          echo "============================================"

          if [[ "${{ needs.validate.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-int.result }}" == "failure" ]] || \
             [[ "${{ needs.smoke-test-int.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-test.result }}" == "failure" ]]; then
              echo "::error::Promotion pipeline failed — see results above"
              exit 1
          fi
