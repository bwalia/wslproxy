name: Build-Push-Deploy wslproxy to K3S
on:
  push:
    branches:
      - release-for-k3s
  workflow_dispatch:
    inputs:
      TARGET_ENV:
        type: choice
        description: "Please choose the environment"
        default: "test"
        required: true
        options:
          - dev
          - int
          - test
          - acc
          - prod

      TARGET_BRANCH:
        description: "Please choose the branch to build and deploy"
        default: "main"
        required: true

      DEPLOYMENT_TYPE:
        type: choice
        description: "Please select the build only, deploy only or build and deploy"
        default: "build-and-deploy"
        required: true
        options:
          - build
          - deploy
          - build-and-deploy

env:
  IMAGE_NAME: "wslproxy"
  IMAGE_REGISTRY: "bwalia"
  TARGET_IMAGE_TAG: "latest"
  TARGET_STACK: openresty
  TARGET_ENV: ${{ github.event.inputs.TARGET_ENV || 'int' }}
  TARGET_BRANCH: ${{ github.event.inputs.TARGET_BRANCH || 'main' }}
  DEPLOYMENT_TYPE: ${{ github.event.inputs.DEPLOYMENT_TYPE || 'build-and-deploy' }}
  # Docker Hub configuration
  DOCKER_HUB_PUSH_ENABLED: true

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.DEPLOYMENT_TYPE != 'deploy' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/wslproxy
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWD }}

      - name: Build and push wslproxy
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ env.DOCKER_HUB_PUSH_ENABLED == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_REGISTRY }}/wslproxy:latest
            ${{ env.IMAGE_REGISTRY }}/wslproxy:${{ github.sha }}
            ${{ env.IMAGE_REGISTRY }}/wslproxy:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=WSLProxy
            org.opencontainers.image.description=OpenResty-based API Gateway and Reverse Proxy with Auto SSL
            org.opencontainers.image.url=https://github.com/wslproxy/wslproxy
            org.opencontainers.image.source=https://github.com/wslproxy/wslproxy
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push WSLProxy (alternate build)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ env.DOCKER_HUB_PUSH_ENABLED == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_REGISTRY }}/wslproxy-alternate:latest
            ${{ env.IMAGE_REGISTRY }}/wslproxy-alternate:${{ github.sha }}
            ${{ env.IMAGE_REGISTRY }}/wslproxy-alternate:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=WSLProxy Alternate Build
            org.opencontainers.image.description=WSLProxy alternative build variant
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Node app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: demos-origins/node-app/Dockerfile
          push: ${{ env.DOCKER_HUB_PUSH_ENABLED == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_REGISTRY }}/node-app:latest
            ${{ env.IMAGE_REGISTRY }}/node-app:${{ github.sha }}
            ${{ env.IMAGE_REGISTRY }}/node-app:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=WSLProxy Node App
            org.opencontainers.image.description=Sample Node.js backend application for WSLProxy
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push S3 Browser Node app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: demos-origins/s3-browser/Dockerfile
          push: ${{ env.DOCKER_HUB_PUSH_ENABLED == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_REGISTRY }}/s3-browser-app:latest
            ${{ env.IMAGE_REGISTRY }}/s3-browser-app:${{ github.sha }}
            ${{ env.IMAGE_REGISTRY }}/s3-browser-app:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=S3 Browser App
            org.opencontainers.image.description=S3-compatible browser application
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub README (wslproxy)
        if: env.DOCKER_HUB_PUSH_ENABLED == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWD }}
          repository: ${{ env.IMAGE_REGISTRY }}/wslproxy
          short-description: "OpenResty-based API Gateway with Auto SSL, Reverse Proxy, and Admin Dashboard"
          readme-filepath: ./DOCKER.md

  deploy:
    name: Deploy to K3S using Helm
    runs-on: self-hosted
    needs: [build]
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (github.event.inputs.DEPLOYMENT_TYPE != 'build')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Decode and Export Kubeconfig
        run: |
          # Map kubeconfig based on environment
          if [[ "${{ env.TARGET_ENV }}" == "prod" ]]; then
            KUBE_CONFIG_BASE64="${{ secrets.KUBE_CONFIG_DATA_K3S1 }}"
            echo "Using K3S1 cluster for production"
          else
            KUBE_CONFIG_BASE64="${{ secrets.KUBE_CONFIG_DATA_K3S2 }}"
            echo "Using K3S2 cluster (default)"
          fi

          echo "${KUBE_CONFIG_BASE64}" | base64 -d > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV
          echo "Kubeconfig decoded and exported successfully"
        shell: bash

      - name: Check and Install kubectl
        run: |
          if ! command -v kubectl &> /dev/null; then
            echo "kubectl not found. Installing kubectl..."
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
          fi
          kubectl version --client
        shell: bash

      - name: Check and Install Helm
        run: |
          if ! command -v helm &> /dev/null; then
            echo "Helm not found. Installing Helm..."
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi
          helm version
        shell: bash

      - name: Kubeseal - Generate API values file
        run: |
          chmod +x ./devops/kubeseal/kubeseal_automation.sh

          # Select the correct secrets based on environment
          case "${{ env.TARGET_ENV }}" in
            dev)
              ENV_SECRET="${{ secrets.DOT_WSLPROXY_ENV_CREDS_DEV }}"
              SETTINGS_SECRET="${{ secrets.DOT_WSLPROXY_SETTINGS_DEV }}"
              ;;
            int)
              ENV_SECRET="${{ secrets.DOT_WSLPROXY_ENV_CREDS_INT }}"
              SETTINGS_SECRET="${{ secrets.DOT_WSLPROXY_SETTINGS_INT }}"
              ;;
            test)
              ENV_SECRET="${{ secrets.DOT_WSLPROXY_ENV_CREDS_TEST }}"
              SETTINGS_SECRET="${{ secrets.DOT_WSLPROXY_SETTINGS_TEST }}"
              ;;
            acc)
              ENV_SECRET="${{ secrets.DOT_WSLPROXY_ENV_CREDS_ACC }}"
              SETTINGS_SECRET="${{ secrets.DOT_WSLPROXY_SETTINGS_ACC }}"
              ;;
            prod)
              ENV_SECRET="${{ secrets.DOT_WSLPROXY_ENV_CREDS_PROD }}"
              SETTINGS_SECRET="${{ secrets.DOT_WSLPROXY_SETTINGS_PROD }}"
              ;;
            *)
              echo "Unknown environment: ${{ env.TARGET_ENV }}"
              exit 1
              ;;
          esac

          # Run kubeseal automation for API (with optional settings secret)
          if [[ -n "${SETTINGS_SECRET}" ]]; then
            ./devops/kubeseal/kubeseal_automation.sh \
              "${ENV_SECRET}" \
              "${{ env.TARGET_ENV }}" \
              "${{ env.TARGET_ENV }}" \
              "api" \
              "${SETTINGS_SECRET}"
          else
            ./devops/kubeseal/kubeseal_automation.sh \
              "${ENV_SECRET}" \
              "${{ env.TARGET_ENV }}" \
              "${{ env.TARGET_ENV }}" \
              "api"
          fi
        shell: bash

      - name: Kubeseal - Generate Front values file
        run: |
          # Select the correct secrets based on environment
          case "${{ env.TARGET_ENV }}" in
            dev)
              ENV_SECRET="${{ secrets.DOT_WSLPROXY_ENV_CREDS_DEV }}"
              SETTINGS_SECRET="${{ secrets.DOT_WSLPROXY_SETTINGS_DEV }}"
              ;;
            int)
              ENV_SECRET="${{ secrets.DOT_WSLPROXY_ENV_CREDS_INT }}"
              SETTINGS_SECRET="${{ secrets.DOT_WSLPROXY_SETTINGS_INT }}"
              ;;
            test)
              ENV_SECRET="${{ secrets.DOT_WSLPROXY_ENV_CREDS_TEST }}"
              SETTINGS_SECRET="${{ secrets.DOT_WSLPROXY_SETTINGS_TEST }}"
              ;;
            acc)
              ENV_SECRET="${{ secrets.DOT_WSLPROXY_ENV_CREDS_ACC }}"
              SETTINGS_SECRET="${{ secrets.DOT_WSLPROXY_SETTINGS_ACC }}"
              ;;
            prod)
              ENV_SECRET="${{ secrets.DOT_WSLPROXY_ENV_CREDS_PROD }}"
              SETTINGS_SECRET="${{ secrets.DOT_WSLPROXY_SETTINGS_PROD }}"
              ;;
            *)
              echo "Unknown environment: ${{ env.TARGET_ENV }}"
              exit 1
              ;;
          esac

          # Run kubeseal automation for Front (with optional settings secret)
          if [[ -n "${SETTINGS_SECRET}" ]]; then
            ./devops/kubeseal/kubeseal_automation.sh \
              "${ENV_SECRET}" \
              "${{ env.TARGET_ENV }}" \
              "${{ env.TARGET_ENV }}" \
              "front" \
              "${SETTINGS_SECRET}"
          else
            ./devops/kubeseal/kubeseal_automation.sh \
              "${ENV_SECRET}" \
              "${{ env.TARGET_ENV }}" \
              "${{ env.TARGET_ENV }}" \
              "front"
          fi
        shell: bash

      - name: Deploy wslproxy API using Helm
        run: |
          echo "Deploying wslproxy API to ${{ env.TARGET_ENV }} environment..."

          helm upgrade --install wslproxy-api-${{ env.TARGET_ENV }} \
            ./devops/helm-charts/whitefalcon/ \
            -f ./devops/helm-charts/whitefalcon/values-wslproxy-api-${{ env.TARGET_ENV }}.yaml \
            --set image.repository=${{ env.IMAGE_REGISTRY }}/wslproxy \
            --set image.tag=latest \
            --namespace ${{ env.TARGET_ENV }} \
            --create-namespace \
            --wait \
            --timeout 5m
        shell: bash

      - name: Deploy wslproxy Front using Helm
        run: |
          echo "Deploying wslproxy Front to ${{ env.TARGET_ENV }} environment..."

          helm upgrade --install wslproxy-front-${{ env.TARGET_ENV }} \
            ./devops/helm-charts/whitefalcon/ \
            -f ./devops/helm-charts/whitefalcon/values-wslproxy-front-${{ env.TARGET_ENV }}.yaml \
            --set image.repository=${{ env.IMAGE_REGISTRY }}/wslproxy \
            --set image.tag=latest \
            --namespace ${{ env.TARGET_ENV }} \
            --create-namespace \
            --wait \
            --timeout 5m
        shell: bash

      - name: Deploy Node App using Helm
        run: |
          echo "Deploying Node App..."

          helm upgrade --install wslproxy-nodeapp \
            ./devops/helm-charts/node-app/ \
            -f ./devops/helm-charts/node-app/values.yaml \
            --set image.repository=${{ env.IMAGE_REGISTRY }}/node-app \
            --set image.tag=latest \
            --namespace ${{ env.TARGET_ENV }} \
            --create-namespace \
            --wait \
            --timeout 5m || echo "Node app deployment skipped (values file may not exist)"
        shell: bash

      - name: Deploy S3 Browser App using Helm
        run: |
          echo "Deploying S3 Browser App..."

          helm upgrade --install wslproxy-s3-browser \
            ./devops/helm-charts/s3-browser-app/ \
            -f ./devops/helm-charts/s3-browser-app/values.yaml \
            --set image.repository=${{ env.IMAGE_REGISTRY }}/s3-browser-app \
            --set image.tag=latest \
            --namespace ${{ env.TARGET_ENV }} \
            --create-namespace \
            --wait \
            --timeout 5m || echo "S3 Browser app deployment skipped (values file may not exist)"
        shell: bash

      - name: Deploy Server Configs and Rules to K8s
        run: |
          echo "Deploying server configs and rules for ${{ env.TARGET_ENV }}..."
          
          # Check if configs exist for this environment
          SERVER_COUNT=$(ls -1 data/servers/${{ env.TARGET_ENV }}/*.json 2>/dev/null | wc -l || echo "0")
          RULE_COUNT=$(ls -1 data/rules/${{ env.TARGET_ENV }}/*.json 2>/dev/null | wc -l || echo "0")
          
          if [[ "$SERVER_COUNT" -eq 0 ]] && [[ "$RULE_COUNT" -eq 0 ]]; then
            echo "No configs found for environment: ${{ env.TARGET_ENV }}"
            echo "Skipping config deployment..."
            exit 0
          fi
          
          echo "Found $SERVER_COUNT server configs and $RULE_COUNT rule configs"
          
          # Get the API pod name
          API_POD=$(kubectl get pods -n ${{ env.TARGET_ENV }} -l app.kubernetes.io/name=wslproxy -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          
          if [[ -z "$API_POD" ]]; then
            echo "⚠️ No wslproxy pod found in namespace ${{ env.TARGET_ENV }}"
            echo "Configs will be deployed on next pod restart via PVC"
            exit 0
          fi
          
          echo "Found pod: $API_POD"
          
          # Create directories
          kubectl exec -n ${{ env.TARGET_ENV }} $API_POD -- mkdir -p /opt/nginx/data/servers/${{ env.TARGET_ENV }} /opt/nginx/data/rules/${{ env.TARGET_ENV }} 2>/dev/null || true
          
          # Copy server configs
          echo "📦 Deploying server configs..."
          for file in data/servers/${{ env.TARGET_ENV }}/*.json; do
            if [[ -f "$file" ]]; then
              filename=$(basename "$file")
              echo "  → $filename"
              kubectl cp "$file" ${{ env.TARGET_ENV }}/$API_POD:/opt/nginx/data/servers/${{ env.TARGET_ENV }}/"$filename"
            fi
          done
          
          # Copy rule configs
          echo "📦 Deploying rule configs..."
          for file in data/rules/${{ env.TARGET_ENV }}/*.json; do
            if [[ -f "$file" ]]; then
              filename=$(basename "$file")
              echo "  → $filename"
              kubectl cp "$file" ${{ env.TARGET_ENV }}/$API_POD:/opt/nginx/data/rules/${{ env.TARGET_ENV }}/"$filename"
            fi
          done
          
          echo "✅ Config deployment complete!"
          
          # Verify
          echo ""
          echo "=== Deployed Configs ==="
          kubectl exec -n ${{ env.TARGET_ENV }} $API_POD -- ls -la /opt/nginx/data/servers/${{ env.TARGET_ENV }}/ 2>/dev/null || true
          kubectl exec -n ${{ env.TARGET_ENV }} $API_POD -- ls -la /opt/nginx/data/rules/${{ env.TARGET_ENV }}/ 2>/dev/null || true
        shell: bash

      - name: Restart wslproxy API Pods
        run: |
          kubectl rollout restart deployment/wf-api-${{ env.TARGET_ENV }} -n ${{ env.TARGET_ENV }}
          kubectl rollout status deployment/wf-api-${{ env.TARGET_ENV }} -n ${{ env.TARGET_ENV }} --timeout=3m
        shell: bash

      - name: Restart wslproxy Front Pods
        run: |
          kubectl rollout restart deployment/wf-front-${{ env.TARGET_ENV }} -n ${{ env.TARGET_ENV }}
          kubectl rollout status deployment/wf-front-${{ env.TARGET_ENV }} -n ${{ env.TARGET_ENV }} --timeout=3m
        shell: bash

      - name: Show Deployment Status
        if: always()
        run: |
          echo "=== Deployment History ==="
          kubectl rollout history deployment/wf-api-${{ env.TARGET_ENV }} -n ${{ env.TARGET_ENV }} || true
          kubectl rollout history deployment/wf-front-${{ env.TARGET_ENV }} -n ${{ env.TARGET_ENV }} || true

          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.TARGET_ENV }} -o wide

          echo ""
          echo "=== Services ==="
          kubectl get svc -n ${{ env.TARGET_ENV }}

          echo ""
          echo "=== Ingress ==="
          kubectl get ingress -n ${{ env.TARGET_ENV }}
        shell: bash

      - name: Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: "general"
          slack-message: |
            :rocket: *wslproxy Deployment*
            • *Environment:* ${{ env.TARGET_ENV }}
            • *Branch:* ${{ env.TARGET_BRANCH }}
            • *Status:* ${{ job.status }}
            • *Commit:* ${{ github.sha }}
            • *API URL:* https://api-${{ env.TARGET_ENV }}.wslproxy.com/ping
            • *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}

  healthcheck:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Run Health Check
        working-directory: ./QA
        run: |
          # Set API URL based on environment
          case "${{ env.TARGET_ENV }}" in
            dev)
              export API_PING_URL="https://api-dev.wslproxy.com/ping"
              ;;
            int)
              export API_PING_URL="https://api-int.wslproxy.com/ping"
              ;;
            test)
              export API_PING_URL="https://api-test.wslproxy.com/ping"
              ;;
            acc)
              export API_PING_URL="https://api-acc.wslproxy.com/ping"
              ;;
            prod)
              export API_PING_URL="https://api.wslproxy.com/ping"
              ;;
            *)
              echo "Unknown environment: ${{ env.TARGET_ENV }}"
              export API_PING_URL="https://api-int.wslproxy.com/ping"
              ;;
          esac

          echo "Running health check against: ${API_PING_URL}"
          go mod init healthcheck 2>/dev/null || true
          go test 01_healthcheck_test.go -v
        shell: bash

      - name: Slack Notification on Health Check Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: "general"
          slack-message: |
            :warning: *Health Check Failed!*
            • *Environment:* ${{ env.TARGET_ENV }}
            • *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>

            Please investigate immediately!
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
