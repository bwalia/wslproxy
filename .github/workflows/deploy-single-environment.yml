name: Deploy Single Environment
# Deploys ONE environment in isolation, with NO cascade to any other. It reuses
# the tested reusable workflow (deploy-environment.yml) with the same per-host
# settings as the full delivery pipeline — it just drops the promotion chaining.
#
# Environments (Integration -> Test -> Acceptance -> Production):
#   int       -> 192.168.1.193   (Integration)
#   test      -> 192.168.1.140   (Test)
#   acc       -> 192.168.1.47    (Acceptance — LAN)
#   prod | prod-lon1 | prod-pop0
#             -> BOTH production edges in parallel:
#                  lon1.pop0.uk (lon1) + 85.190.106.189 / lon2.pop0.uk (pop0)
# Retired: 18.133.126.242 (pop1) — host gone; ENV=prod must not SSH there.
#
# Non-prod ENVs still map to exactly one host. Production is a dual-POP
# ring: Ring Promoter "prod" (any of the three ENV aliases) always
# refreshes lon1 and lon2 together so the edges stay in sync.
#
# WHY THIS EXISTS
#   deploy-wslproxy-delivery-pipeline.yml is a cumulative promotion cascade and
#   cannot deploy a single environment on its own. Ring Promoter
#   (github.com/bwalia/ring-promoter) models each ring as an INDEPENDENT
#   environment: it promotes one ring at a time and, on a failed post-deploy
#   health check, auto-rolls-back THAT ring only — so it needs to deploy exactly
#   one *ring* per dispatch. For Production the ring is both POPs.
#
# NOTE: prod runs with env_name=prod (served by the `acc` self-hosted runner);
# acc runs with env_name=acc on a dedicated LAN host with its own runner. int
# and test also use env_name matching their runner labels.

on:
  workflow_dispatch:
    inputs:
      ENV:
        type: choice
        description: "Which single environment/ring to deploy (prod = lon1+lon2)"
        required: true
        default: "int"
        options:
          - int
          - test
          - acc
          - prod
          - prod-lon1
          - prod-pop0
      DEPLOY_BRANCH:
        type: string
        description: "Git ref to deploy (branch, tag or commit SHA)"
        required: true
        default: "main"
      DEPLOY_MODE:
        type: choice
        description: >-
          What to deploy. Prefer `code` for Lua/API/html (fast). Use `full` or
          `build` only when OpenResty/OS deps/dashboards must change — OpenResty
          installs from the prebuilt Docker image by default (no on-host compile).
        required: true
        default: "code"
        options:
          - code
          - nginx
          - servers
          - dashboard
          - dashboard-next
          - os_deps
          - build
          - full
          - permissions

# Serialize deploys to the same environment; don't cancel an in-flight deploy.
# All prod ENV aliases share one group so lon1+lon2 never overlap across runs.
concurrency:
  group: >-
    ${{ (inputs.ENV == 'prod' || inputs.ENV == 'prod-lon1' || inputs.ENV == 'prod-pop0')
        && 'deploy-single-prod'
        || format('deploy-single-{0}', inputs.ENV) }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────
  # Integration — int (192.168.1.193), local sudo deploy, SOPS secrets
  # ──────────────────────────────────────────────────────
  int:
    if: ${{ inputs.ENV == 'int' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: int
      env_label: "Integration — int (192.168.1.193)"
      stage_number: "int"
      host_ip: "192.168.1.193"
      ssh_user: bwalia
      connection_mode: local
      secrets_mode: sops
      # Health via :8099 (Next.js admin OpenResty block). Host :8080 is
      # stolen by k3s CNI hostPort DNAT on this node — TCP connect times out
      # even though OpenResty listens. Admin API moved to :8090 in host_vars.
      health_endpoint: "http://127.0.0.1:8099/healthz"
      health_check_mode: local
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ inputs.DEPLOY_BRANCH }}
      deploy_mode: ${{ inputs.DEPLOY_MODE }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      # Kept so an emergency revert to secrets_mode: github_secret needs no
      # secret re-add (mirrors the delivery pipeline's int stage).
      SETTINGS_SECRET: ${{ secrets.DOT_WSLPROXY_SETTINGS_INT }}
      ENV_CREDS_SECRET: ${{ secrets.DOT_WSLPROXY_ENV_CREDS_INT }}

  # ──────────────────────────────────────────────────────
  # Test — test (192.168.1.140), SSH deploy, secrets read from the runner
  # ──────────────────────────────────────────────────────
  test:
    if: ${{ inputs.ENV == 'test' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: test
      env_label: "Test — test (192.168.1.140)"
      stage_number: "test"
      host_ip: "192.168.1.140"
      ssh_user: bwalia
      connection_mode: ssh
      # vault_or_sops so the deploy works from ANY runner — the previous
      # runner_file mode read /home/bwalia/.secrets/wslproxy/test/{...}
      # which only exists on the LAN test runner; moving the job to the
      # mac-studio runner (as we did for prod-pop1) would have broken it.
      secrets_mode: vault_or_sops
      # Same k3s CNI hostPort DNAT foot-gun as int: OpenResty listens on
      # :8080 but TCP connect times out. Next admin block on :8099 is healthy.
      health_endpoint: "http://127.0.0.1:8099/healthz"
      health_check_mode: ssh
      docker_prune: false
      notify_success: true
      deploy_branch: ${{ inputs.DEPLOY_BRANCH }}
      deploy_mode: ${{ inputs.DEPLOY_MODE }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  # ──────────────────────────────────────────────────────
  # Acceptance — acc (192.168.1.47, LAN). vault-first with SOPS fallback
  # (matches the delivery pipeline post-#1125; seed_from_host retired).
  # ──────────────────────────────────────────────────────
  # Migrated off 187.124.112.155 (the old pop0 host). acc
  # now runs on a dedicated LAN box (192.168.1.47 / debian002 — was .48
  # until DHCP drift on 2026-08-19); the `acc`
  # self-hosted runner lives on the shared mac (hh193 / BalindeacStudio,
  # LAN peer) and SSHes into acc as bwalia — its ~/.ssh/id_rsa is already
  # trusted on the target. connection_mode=local would have `sudo`'d on
  # the runner box (macOS, no passwordless sudo) instead of on acc, which
  # is what failed run 30267669485.
  acc:
    if: ${{ inputs.ENV == 'acc' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: acc
      env_label: "Acceptance (192.168.1.47)"
      stage_number: "acc"
      host_ip: "192.168.1.47"
      ssh_user: bwalia
      # ssh_key: ansible SSHes from the runner (mac, LAN peer) into acc
      # using the runner's ~/.ssh/id_rsa. If the `acc` runner is ever
      # moved onto 192.168.1.47 itself, drop this to `local`.
      connection_mode: ssh_key
      secrets_mode: vault_or_sops
      # Was http://localhost:8080/healthz and failed every deploy: twelve
      # attempts, HTTP 000 each time, after a PLAY RECAP with failed=0 and a
      # passing `openresty -t` (run 36042124096). HTTP 000 is a failed TCP
      # connect, not a bad response — nothing was listening, or nothing that
      # could be reached.
      #
      # int and test hit the identical symptom on :8080 and both moved here;
      # their comments attribute it to k3s CNI hostPort DNAT blackholing the
      # port. That cause has NOT been confirmed on acc — no one has been on
      # the box — so treat it as the likely explanation, not a finding.
      #
      # Either way :8099 is the right target: the Next.js admin block serves
      # the same /healthz (nginx.conf.j2:648), and it exists here because acc
      # sets nginx_web_ui_enabled: "yes".
      #
      # 127.0.0.1 rather than localhost, matching int and test: localhost can
      # resolve to ::1 first and these blocks listen on IPv4.
      health_endpoint: "http://127.0.0.1:8099/healthz"
      health_check_mode: ssh
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ inputs.DEPLOY_BRANCH }}
      deploy_mode: ${{ inputs.DEPLOY_MODE }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  # ──────────────────────────────────────────────────────
  # Production ring — ALWAYS both edges when ENV is prod,
  # prod-lon1, or prod-pop0 (Ring Promoter + manual dispatch):
  #   • lon1.pop0.uk  (ssh root)
  #   • 85.190.106.189 / lon2.pop0.uk (ssh administrator)
  # Jobs run in parallel on the `acc` runner label.
  # ──────────────────────────────────────────────────────
  prod-lon1:
    if: >-
      ${{ inputs.ENV == 'prod'
          || inputs.ENV == 'prod-lon1'
          || inputs.ENV == 'prod-pop0' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: prod
      runner_label: acc
      env_label: "Production — lon1 (lon1.pop0.uk)"
      stage_number: "prod-lon1"
      host_ip: "lon1.pop0.uk"
      ssh_user: root
      connection_mode: ssh_key
      secrets_mode: vault_or_sops
      health_endpoint: "https://lon1.pop0.uk/healthz"
      health_check_mode: external
      smoke_domain: "lon1.pop0.uk"
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ inputs.DEPLOY_BRANCH }}
      deploy_mode: ${{ inputs.DEPLOY_MODE }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  # pop0 / lon2 — same Vault/SOPS prod secrets as lon1.
  prod-lon2:
    if: >-
      ${{ inputs.ENV == 'prod'
          || inputs.ENV == 'prod-lon1'
          || inputs.ENV == 'prod-pop0' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: prod
      runner_label: acc
      env_label: "Production — lon2/pop0 (85.190.106.189 / lon2.pop0.uk)"
      stage_number: "prod-lon2"
      host_ip: "85.190.106.189"
      ssh_user: administrator
      connection_mode: ssh_key
      secrets_mode: vault_or_sops
      health_endpoint: "https://lon2.pop0.uk/healthz"
      health_check_mode: external
      smoke_domain: "lon2.pop0.uk"
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ inputs.DEPLOY_BRANCH }}
      deploy_mode: ${{ inputs.DEPLOY_MODE }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
