name: Deploy Single Environment
# Deploys ONE environment in isolation, with NO cascade to any other. It reuses
# the tested reusable workflow (deploy-environment.yml) with the same per-host
# settings as the full delivery pipeline — it just drops the promotion chaining.
#
# Environments (Integration -> Test -> Acceptance -> Production):
#   int       -> 192.168.1.193   (Integration)
#   test      -> 192.168.1.140   (Test)
#   acc       -> 192.168.1.47    (Acceptance — LAN)
#   prod      -> 18.133.126.242  (Production — "pop1", AWS)
#   prod-lon1 -> 195.20.255.201    (Production — "lon1" / lon1.pop0.uk)
#   prod-pop0 -> 85.190.106.189  (Production — "pop0", new VPS, ssh administrator)
#
# Each ENV maps to exactly ONE host, so rings deploy independently.
#
# WHY THIS EXISTS
#   deploy-wslproxy-delivery-pipeline.yml is a cumulative promotion cascade and
#   cannot deploy a single environment on its own. Ring Promoter
#   (github.com/bwalia/ring-promoter) models each ring as an INDEPENDENT
#   environment: it promotes one ring at a time and, on a failed post-deploy
#   health check, auto-rolls-back THAT ring only — so it needs to deploy exactly
#   one environment per dispatch, which is what this workflow provides.
#
# NOTE: prod runs with env_name=prod (served by the `prod` self-hosted runner);
# acc runs with env_name=acc on a dedicated LAN host with its own runner. int
# and test also use env_name matching their runner labels.

on:
  workflow_dispatch:
    inputs:
      ENV:
        type: choice
        description: "Which single environment to deploy (no cascade to others)"
        required: true
        default: "int"
        options:
          - int
          - test
          - acc
          - prod
          - prod-lon1
          - prod-pop0
      DEPLOY_BRANCH:
        type: string
        description: "Git ref to deploy (branch, tag or commit SHA)"
        required: true
        default: "main"
      DEPLOY_MODE:
        type: choice
        description: "What to deploy"
        required: true
        default: "full"
        options:
          - full
          - code
          - nginx
          - servers
          - dashboard
          - dashboard-next
          - os_deps
          - build
          - permissions

# Serialize deploys to the same environment; don't cancel an in-flight deploy.
concurrency:
  group: deploy-single-${{ inputs.ENV }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────
  # Integration — int (192.168.1.193), local sudo deploy, SOPS secrets
  # ──────────────────────────────────────────────────────
  int:
    if: ${{ inputs.ENV == 'int' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: int
      env_label: "Integration — int (192.168.1.193)"
      stage_number: "int"
      host_ip: "192.168.1.193"
      ssh_user: bwalia
      connection_mode: local
      secrets_mode: sops
      health_endpoint: "http://localhost:8080/healthz"
      health_check_mode: local
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ inputs.DEPLOY_BRANCH }}
      deploy_mode: ${{ inputs.DEPLOY_MODE }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      # Kept so an emergency revert to secrets_mode: github_secret needs no
      # secret re-add (mirrors the delivery pipeline's int stage).
      SETTINGS_SECRET: ${{ secrets.DOT_WSLPROXY_SETTINGS_INT }}
      ENV_CREDS_SECRET: ${{ secrets.DOT_WSLPROXY_ENV_CREDS_INT }}

  # ──────────────────────────────────────────────────────
  # Test — test (192.168.1.140), SSH deploy, secrets read from the runner
  # ──────────────────────────────────────────────────────
  test:
    if: ${{ inputs.ENV == 'test' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: test
      env_label: "Test — test (192.168.1.140)"
      stage_number: "test"
      host_ip: "192.168.1.140"
      ssh_user: bwalia
      connection_mode: ssh
      # vault_or_sops so the deploy works from ANY runner — the previous
      # runner_file mode read /home/bwalia/.secrets/wslproxy/test/{...}
      # which only exists on the LAN test runner; moving the job to the
      # mac-studio runner (as we did for prod-pop1) would have broken it.
      secrets_mode: vault_or_sops
      health_endpoint: "http://localhost:8080/healthz"
      health_check_mode: ssh
      docker_prune: false
      notify_success: true
      deploy_branch: ${{ inputs.DEPLOY_BRANCH }}
      deploy_mode: ${{ inputs.DEPLOY_MODE }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  # ──────────────────────────────────────────────────────
  # Acceptance — acc (192.168.1.47, LAN). vault-first with SOPS fallback
  # (matches the delivery pipeline post-#1125; seed_from_host retired).
  # ──────────────────────────────────────────────────────
  # Migrated off 187.124.112.155 (the old pop0 host). acc
  # now runs on a dedicated LAN box (192.168.1.47 / debian002 — was .48
  # until DHCP drift on 2026-08-19); the `acc`
  # self-hosted runner lives on the shared mac (hh193 / BalindeacStudio,
  # LAN peer) and SSHes into acc as bwalia — its ~/.ssh/id_rsa is already
  # trusted on the target. connection_mode=local would have `sudo`'d on
  # the runner box (macOS, no passwordless sudo) instead of on acc, which
  # is what failed run 30267669485.
  acc:
    if: ${{ inputs.ENV == 'acc' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: acc
      env_label: "Acceptance (192.168.1.47)"
      stage_number: "acc"
      host_ip: "192.168.1.47"
      ssh_user: bwalia
      # ssh_key: ansible SSHes from the runner (mac, LAN peer) into acc
      # using the runner's ~/.ssh/id_rsa. If the `acc` runner is ever
      # moved onto 192.168.1.47 itself, drop this to `local`.
      connection_mode: ssh_key
      secrets_mode: vault_or_sops
      health_endpoint: "http://localhost:8080/healthz"
      health_check_mode: ssh
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ inputs.DEPLOY_BRANCH }}
      deploy_mode: ${{ inputs.DEPLOY_MODE }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  # ──────────────────────────────────────────────────────
  # Production — prod / "pop1" (18.133.126.242, AWS eu-west-2, ssh user admin).
  # vault-first with SOPS fallback (matches the delivery pipeline post-#1125).
  # ──────────────────────────────────────────────────────
  # Runner: the historical `prod` runner lives on pop0 (Linux) and has no
  # SSH trust to pop1 — every prod dispatch failed at "SSH connection
  # failed to admin@18.133.126.242" (run 30341173054). Schedule this job
  # on the mac-studio runner tagged `acc` instead — it already has an
  # id_rsa that pop1 trusts (verified: `ssh admin@18.133.126.242 hostname`
  # returns ip-10-0-0-207 with passwordless sudo). env_name stays `prod`
  # so ansible target_env, Vault secret path, and SOPS payload profile
  # all remain prod.
  prod:
    if: ${{ inputs.ENV == 'prod' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: prod
      runner_label: acc
      env_label: "Production — pop1 (18.133.126.242)"
      stage_number: "prod"
      host_ip: "18.133.126.242"
      ssh_user: admin
      connection_mode: ssh_key
      secrets_mode: vault_or_sops
      # pop1 is a DASHBOARD-ONLY pop: nginx_default_server_backend is empty,
      # so no admin block listens on :7691 (unlike lon1, which does). Health-
      # check the public dashboard domain on 443 instead — valid LE cert,
      # serves /healthz 200. (cf. acc/pop0 uses https://prod-our-v1…/healthz.)
      health_endpoint: "https://pop1.diytaxreturn.co.uk/healthz"
      health_check_mode: external
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ inputs.DEPLOY_BRANCH }}
      deploy_mode: ${{ inputs.DEPLOY_MODE }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  # ──────────────────────────────────────────────────────
  # Production — prod / "lon1" (195.20.255.201, IONOS, ssh root).
  # Same prod secrets (Vault/SOPS) as pop0/pop1; UI https://lon1.pop0.uk
  # ──────────────────────────────────────────────────────
  prod-lon1:
    if: ${{ inputs.ENV == 'prod-lon1' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: prod
      runner_label: acc
      env_label: "Production — lon1 (195.20.255.201)"
      stage_number: "prod-lon1"
      host_ip: "195.20.255.201"
      ssh_user: root
      connection_mode: ssh_key
      secrets_mode: vault_or_sops
      health_endpoint: "https://lon1.pop0.uk/healthz"
      health_check_mode: external
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ inputs.DEPLOY_BRANCH }}
      deploy_mode: ${{ inputs.DEPLOY_MODE }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  # ──────────────────────────────────────────────────────
  # Production — prod / "pop0" (85.190.106.189, ssh user `administrator`).
  #
  # New VPS commissioned 2026-08-28, replacing the retired pop0 host
  # 187.124.112.155 (that box became a k3s/traefik node). Same prod secrets
  # (Vault/SOPS) as lon1/pop1.
  #
  # Scheduled on the mac-studio runner (`acc`) — same rationale as lon1/pop1:
  # it is the runner that holds an SSH key trusted by the prod edges. The old
  # `prod` runner lived ON the retired pop0 box and no longer exists.
  #
  # health_check_mode is `ssh` (not `external`): no DNS points at this VPS yet
  # (prod-our.wslproxy.com still resolves to lon1), so an external check would
  # green on the WRONG host. Switch to `external` once DNS is repointed.
  # ──────────────────────────────────────────────────────
  prod-pop0:
    if: ${{ inputs.ENV == 'prod-pop0' }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: prod
      runner_label: acc
      env_label: "Production — pop0 (85.190.106.189)"
      stage_number: "prod-pop0"
      host_ip: "85.190.106.189"
      ssh_user: administrator
      connection_mode: ssh_key
      secrets_mode: vault_or_sops
      health_endpoint: "http://127.0.0.1:7691/healthz"
      health_check_mode: ssh
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ inputs.DEPLOY_BRANCH }}
      deploy_mode: ${{ inputs.DEPLOY_MODE }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
