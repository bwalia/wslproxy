# Build and push the prebuilt OpenResty image used by Ansible bare-metal
# deploys (openresty_install_mode=prebuilt). Compile once with Buildx GHA
# cache; targets pull the image instead of compiling openresty.sh on-host.
#
# Secrets: DOCKER_USER / DOCKER_PASSWD (same as control-plane / CLI builds)

name: Build OpenResty prebuilt image

on:
  push:
    branches: [main]
    paths:
      - "infra/openresty-prebuilt/**"
      - ".github/workflows/build-openresty-prebuilt.yml"
  workflow_dispatch:
    inputs:
      openresty_version:
        description: "OpenResty version tag (also used as image tag)"
        required: false
        default: "1.29.2.1"
      base_image:
        description: "Debian base matching target glibc (e.g. debian:13)"
        required: false
        default: "debian:13"

concurrency:
  group: build-openresty-prebuilt
  cancel-in-progress: true

env:
  IMAGE: docker.io/bwalia/wslproxy-openresty
  OPENRESTY_VERSION_DEFAULT: "1.29.2.1"
  BASE_IMAGE_DEFAULT: "debian:13"

jobs:
  build:
    name: Build + push bwalia/wslproxy-openresty
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Resolve build args
        id: meta
        run: |
          set -euo pipefail
          VER="${{ github.event.inputs.openresty_version }}"
          BASE="${{ github.event.inputs.base_image }}"
          if [ -z "$VER" ]; then VER="${{ env.OPENRESTY_VERSION_DEFAULT }}"; fi
          if [ -z "$BASE" ]; then BASE="${{ env.BASE_IMAGE_DEFAULT }}"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "base_image=$BASE" >> "$GITHUB_OUTPUT"
          echo "Building OpenResty ${VER} on ${BASE}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWD }}

      - name: Build and push bwalia/wslproxy-openresty
        uses: docker/build-push-action@v6
        with:
          context: infra/openresty-prebuilt
          file: infra/openresty-prebuilt/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.base_image }}
            OPENRESTY_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
