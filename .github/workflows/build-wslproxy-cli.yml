name: Build wslproxy-cli

on:
  push:
    branches: [main]
    paths:
      - 'cmd/wslproxy-cli/**'
      - 'internal/cli/**'
      - 'internal/api/**'
      - 'internal/mcp/**'
      - 'html/swagger/openapi.yaml'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'cmd/wslproxy-cli/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-wslproxy-cli.yml'
  pull_request:
    paths:
      - 'cmd/wslproxy-cli/**'
      - 'internal/cli/**'
      - 'internal/api/**'
      - 'internal/mcp/**'
      - 'html/swagger/openapi.yaml'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'cmd/wslproxy-cli/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-wslproxy-cli.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet & test
        run: |
          go mod tidy
          go vet ./cmd/wslproxy-cli/... ./internal/...
          go test ./internal/...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            VERSION="main-${GITHUB_SHA::7}"
          fi
          EXT="${{ matrix.ext }}"
          OUT="wslproxy-cli_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}"
          go build -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "${OUT}" ./cmd/wslproxy-cli
          echo "ARTIFACT=${OUT}" >> "$GITHUB_ENV"
          ls -la "${OUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: wslproxy-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wslproxy-cli_*
          if-no-files-found: error

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/wslproxy-cli
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build args
        id: args
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=${GITHUB_REF_NAME}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "commit=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=ref,event=pr
      - name: Build and push multi-arch (main / dispatch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/wslproxy-cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.args.outputs.version }}
            COMMIT=${{ steps.args.outputs.commit }}
            DATE=${{ steps.args.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build PR image (amd64, local load)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/wslproxy-cli/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}:pr
          build-args: |
            VERSION=${{ steps.args.outputs.version }}
            COMMIT=${{ steps.args.outputs.commit }}
            DATE=${{ steps.args.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm "${IMAGE}:pr" version
          docker run --rm --entrypoint bash "${IMAGE}:pr" -lc \
            'command -v jq && command -v curl && wslproxy-cli version && ls /opt/wslproxy-cli/examples'
      - name: Smoke test published image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker pull "${IMAGE}:sha-${GITHUB_SHA::7}"
          docker run --rm "${IMAGE}:sha-${GITHUB_SHA::7}" version

  release-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wslproxy-cli-*
          merge-multiple: true
      - name: Prepare assets
        run: |
          mkdir -p release
          find dist -type f -name 'wslproxy-cli_*' -exec cp {} release/ \;
          cd release && sha256sum wslproxy-cli_* > SHA256SUMS.txt
          ls -la
      - name: Update rolling release wslproxy-cli-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wslproxy-cli-latest
          name: wslproxy-cli (latest main)
          prerelease: true
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
