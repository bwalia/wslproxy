name: Deploy Server Configs and Rules

on:
  push:
    branches:
      - main
    paths:
      - 'data/servers/**'
      - 'data/rules/**'

  workflow_dispatch:
    inputs:
      TARGET_ENV:
        type: choice
        description: "Target environment to deploy configs"
        default: "prod"
        required: true
        options:
          - prod
          - int
          - test
          - acc
          - dev

      TARGET_HOST:
        type: choice
        description: "Target host to deploy configs to"
        default: "185.237.99.238"
        required: true
        options:
          - 185.237.99.238
          - whisky03

      DRY_RUN:
        type: boolean
        description: "Dry run - validate only, don't deploy"
        default: false

env:
  TARGET_ENV: ${{ github.event.inputs.TARGET_ENV || 'prod' }}
  TARGET_HOST: ${{ github.event.inputs.TARGET_HOST || '185.237.99.238' }}
  DRY_RUN: ${{ github.event.inputs.DRY_RUN || 'false' }}

jobs:
  validate:
    name: Validate JSON Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate server config JSON files
        run: |
          echo "Validating server configs for environment: ${{ env.TARGET_ENV }}"
          ERRORS=0
          for file in data/servers/${{ env.TARGET_ENV }}/*.json; do
            if [[ -f "$file" ]]; then
              echo "Validating: $file"
              if ! jq empty "$file" 2>/dev/null; then
                echo "❌ Invalid JSON: $file"
                ERRORS=$((ERRORS+1))
              else
                echo "✅ Valid: $file"
              fi
            fi
          done
          if [[ $ERRORS -gt 0 ]]; then
            echo "::error::Found $ERRORS invalid JSON file(s)"
            exit 1
          fi
          echo "All server config files are valid"

      - name: Validate rule config JSON files
        run: |
          echo "Validating rule configs for environment: ${{ env.TARGET_ENV }}"
          ERRORS=0
          for file in data/rules/${{ env.TARGET_ENV }}/*.json; do
            if [[ -f "$file" ]]; then
              echo "Validating: $file"
              if ! jq empty "$file" 2>/dev/null; then
                echo "❌ Invalid JSON: $file"
                ERRORS=$((ERRORS+1))
              else
                echo "✅ Valid: $file"
              fi
            fi
          done
          if [[ $ERRORS -gt 0 ]]; then
            echo "::error::Found $ERRORS invalid JSON file(s)"
            exit 1
          fi
          echo "All rule config files are valid"

      - name: List configs to deploy
        run: |
          echo "=== Server Configs ==="
          ls -la data/servers/${{ env.TARGET_ENV }}/ 2>/dev/null || echo "No server configs found"
          echo ""
          echo "=== Rule Configs ==="
          ls -la data/rules/${{ env.TARGET_ENV }}/ 2>/dev/null || echo "No rule configs found"

  deploy-ansible:
    name: Deploy via Ansible
    runs-on: self-hosted
    needs: [validate]
    if: ${{ github.event.inputs.DRY_RUN != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          if command -v zypper &> /dev/null; then
            sudo zypper install -y ansible
          elif command -v apt-get &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ansible
          else
            echo "::error::No supported package manager found (zypper or apt-get)"
            exit 1
          fi

      - name: Setup SSH and test connectivity
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Check if SSH key exists on self-hosted runner
          if [[ -f ~/.ssh/id_rsa ]]; then
            echo "✅ Using existing SSH key at ~/.ssh/id_rsa"
          else
            echo "::error::SSH key not found at ~/.ssh/id_rsa on self-hosted runner"
            exit 1
          fi
          
          # Add host keys to known_hosts
          ssh-keyscan -H ${{ env.TARGET_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Test SSH connectivity
          echo "Testing SSH connection to ${{ env.TARGET_HOST }}..."
          if ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o ConnectTimeout=10 root@${{ env.TARGET_HOST }} "echo 'SSH connection successful'" 2>&1; then
            echo "✅ SSH connection test passed"
          else
            echo "::error::SSH connection test failed to root@${{ env.TARGET_HOST }}"
            exit 1
          fi

      - name: Validate host is in correct environment group
        run: |
          python3 -c "
          import sys
          h='${{ env.TARGET_HOST }}'
          e='${{ env.TARGET_ENV }}'
          hosts = open('devops/ansible/hosts').read()
          group = f'[openresty_{e}]'
          found = group in hosts and h in hosts.split(group)[1]
          if found:
              print(f'✅ Host {h} found in group {group}')
          else:
              print(f'::error::Host {h} not found in group {group}')
              sys.exit(1)
          "

      - name: Deploy configs via Ansible
        run: |
          echo "Deploying configs for environment: ${{ env.TARGET_ENV }} to host: ${{ env.TARGET_HOST }}"
          ansible-playbook devops/ansible/deploy-configs.yml \
            -i devops/ansible/hosts \
            -e "target_env=${{ env.TARGET_ENV }}" \
            -e "local_data_dir=${{ github.workspace }}/data" \
            -l ${{ env.TARGET_HOST }} \
            -v
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ~/.ssh/id_rsa

  deploy-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [validate, deploy-ansible]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "=================================="
          echo "Deployment Summary"
          echo "=================================="
          echo "Environment: ${{ env.TARGET_ENV }}"
          echo "Target Host: ${{ env.TARGET_HOST }}"
          echo "Dry Run: ${{ env.DRY_RUN }}"
          echo "=================================="
          echo ""
          echo "Job Results:"
          echo "  Validate: ${{ needs.validate.result }}"
          echo "  Deploy: ${{ needs.deploy-ansible.result || 'skipped' }}"
