name: Sync Prod Data to Repo

# Pulls servers and rules configs from the live prod server back into the
# repository so that they are captured in version control.  Creates a PR
# for review — never merges directly into main.

on:
  # Every Friday at 10:00 UTC
  schedule:
    - cron: "0 10 * * 5"

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      PROD_HOST:
        type: choice
        description: "Production host to sync from"
        default: "187.124.112.155"
        required: true
        options:
          - 187.124.112.155
          - 72.62.211.28

env:
  PROD_HOST: ${{ github.event.inputs.PROD_HOST || '187.124.112.155' }}
  REMOTE_DATA_DIR: /opt/nginx/data
  TARGET_ENV: prod

jobs:
  sync-prod-data:
    name: "Sync prod data and create PR"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.PROD_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connectivity
        run: |
          echo "Testing SSH to ${{ env.PROD_HOST }}..."
          if ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o ConnectTimeout=10 root@${{ env.PROD_HOST }} "echo 'SSH OK'" 2>&1; then
            echo "✅ SSH connection successful"
          else
            echo "::error::SSH connection failed to root@${{ env.PROD_HOST }}"
            exit 1
          fi

      - name: Sync server configs from prod
        run: |
          echo "Syncing servers from ${{ env.PROD_HOST }}:${{ env.REMOTE_DATA_DIR }}/servers/${{ env.TARGET_ENV }}/"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o ConnectTimeout=10" \
            root@${{ env.PROD_HOST }}:${{ env.REMOTE_DATA_DIR }}/servers/${{ env.TARGET_ENV }}/ \
            data/servers/${{ env.TARGET_ENV }}/

      - name: Sync rule configs from prod
        run: |
          echo "Syncing rules from ${{ env.PROD_HOST }}:${{ env.REMOTE_DATA_DIR }}/rules/${{ env.TARGET_ENV }}/"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o ConnectTimeout=10" \
            root@${{ env.PROD_HOST }}:${{ env.REMOTE_DATA_DIR }}/rules/${{ env.TARGET_ENV }}/ \
            data/rules/${{ env.TARGET_ENV }}/

      - name: Validate synced JSON files
        run: |
          sudo apt-get install -y jq
          ERRORS=0
          echo "=== Validating server configs ==="
          for file in data/servers/${{ env.TARGET_ENV }}/*.json; do
            if [[ -f "$file" ]]; then
              if ! jq empty "$file" 2>/dev/null; then
                echo "❌ Invalid JSON: $file"
                ERRORS=$((ERRORS+1))
              else
                echo "✅ Valid: $file"
              fi
            fi
          done
          echo ""
          echo "=== Validating rule configs ==="
          for file in data/rules/${{ env.TARGET_ENV }}/*.json; do
            if [[ -f "$file" ]]; then
              if ! jq empty "$file" 2>/dev/null; then
                echo "❌ Invalid JSON: $file"
                ERRORS=$((ERRORS+1))
              else
                echo "✅ Valid: $file"
              fi
            fi
          done
          if [[ $ERRORS -gt 0 ]]; then
            echo "::warning::Found $ERRORS invalid JSON file(s) — PR will still be created for review"
          fi

      - name: Check for changes
        id: changes
        run: |
          git add data/servers/${{ env.TARGET_ENV }}/ data/rules/${{ env.TARGET_ENV }}/
          if git diff --cached --quiet; then
            echo "No changes detected — prod data matches repo"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected:"
            git diff --cached --stat
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create branch and PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync-prod-data/$(date +%Y-%m-%d-%H%M%S)"
          echo "Creating branch: $BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git commit -m "sync: pull prod servers and rules from live server $(date +%Y-%m-%d)"

          git push origin "$BRANCH"

          # Build PR body with a diff summary
          SERVERS_CHANGED=$(git diff main --stat -- data/servers/${{ env.TARGET_ENV }}/ | tail -1)
          RULES_CHANGED=$(git diff main --stat -- data/rules/${{ env.TARGET_ENV }}/ | tail -1)

          gh pr create \
            --title "Sync prod data from live server $(date +%Y-%m-%d)" \
            --body "$(cat <<'PREOF'
          ## Summary
          Automated weekly sync of servers and rules configs from the live prod server
          (`${{ env.PROD_HOST }}:${{ env.REMOTE_DATA_DIR }}`) into the repository.

          **Review these changes carefully before merging** — they represent configs
          that were added or modified directly on the prod server.

          ## What changed
          - Server configs: `data/servers/${{ env.TARGET_ENV }}/`
          - Rule configs: `data/rules/${{ env.TARGET_ENV }}/`

          ## Source
          - Host: `${{ env.PROD_HOST }}`
          - Remote path: `${{ env.REMOTE_DATA_DIR }}/`
          - Synced at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ## Checklist
          - [ ] Review changed/new server configs
          - [ ] Review changed/new rule configs
          - [ ] Verify no sensitive data was accidentally included
          - [ ] Approve and merge

          🤖 Generated by [sync-prod-data-to-repo](.github/workflows/sync-prod-data-to-repo.yml) workflow
          PREOF
          )" \
            --base main \
            --head "$BRANCH"

      - name: Summary
        run: |
          echo "=========================================="
          echo "Sync Prod Data — Summary"
          echo "=========================================="
          echo "Source Host:  ${{ env.PROD_HOST }}"
          echo "Environment:  ${{ env.TARGET_ENV }}"
          echo "Changes:      ${{ steps.changes.outputs.has_changes }}"
          echo "=========================================="
