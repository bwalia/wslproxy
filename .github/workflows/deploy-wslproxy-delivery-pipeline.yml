name: Deploy WSLProxy Delivery Pipeline
# Pipeline: Validate → Int → Smoke Test → Test → Acc → Prod (pop0 + lon1)
# Promotion pipeline: each environment must pass before the next deploys
# Deploy modes: code (default for manual) | nginx | servers | dashboard | os_deps | build | full (default for push)

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - dummy-branch-for-wslproxy-deploy

  workflow_dispatch:
    inputs:
      DEPLOY_BRANCH:
        type: string
        description: "Branch to deploy (type any existing branch name)"
        default: "release"
        required: true

      TARGET_ENV:
        type: choice
        description: "Please choose the Target environment"
        default: "prod"
        required: true
        options:
          - int
          - test
          - acc
          - prod

      TARGET_HOST:
        type: choice
        description: "Please choose the Target host"
        default: "all"
        required: true
        options:
          - all
          - 192.168.1.193
          - 192.168.1.140
          - 187.77.179.206
          - 187.124.112.155
          - 72.62.211.28

      DEPLOY_MODE:
        type: choice
        description: "What to deploy"
        default: "code"
        required: true
        options:
          - code
          - nginx
          - servers
          - dashboard
          - dashboard-next
          - os_deps
          - build
          - full

# Prevent concurrent deployments to same ref (but don't cancel in-progress)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────
  # Stage 1: Build & Validate (runs on GitHub-hosted runner)
  # ──────────────────────────────────────────────────────
  build-validate:
    name: "Stage 1: Build & Validate"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Show deploy mode
        run: |
          echo "Deploy mode: ${{ github.event.inputs.DEPLOY_MODE || 'full' }}"
          echo "Target env:  ${{ github.event.inputs.TARGET_ENV || 'prod' }}"
          echo "Target host: ${{ github.event.inputs.TARGET_HOST || 'all' }}"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}

      - name: Sync html/index.html to docs/index.html (single source of truth)
        run: |
          if ! diff -q html/index.html docs/index.html > /dev/null 2>&1; then
            cp html/index.html docs/index.html
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/index.html
            git commit -m "Sync docs/index.html from html/index.html (auto)" || true
            git push || true
            echo "docs/index.html synced from html/index.html"
          else
            echo "docs/index.html already in sync"
          fi

      - name: Validate all JSON config files
        run: |
          echo "=== Validating All JSON Configs ==="
          ERRORS=0
          VALID=0
          for dir in data/servers data/rules data/waf_rules data/waf_policies; do
            for file in $(find "$dir" -name '*.json' 2>/dev/null); do
              if python3 -m json.tool "$file" > /dev/null 2>&1; then
                VALID=$((VALID+1))
              else
                echo "::error file=$file::Invalid JSON syntax"
                ERRORS=$((ERRORS+1))
              fi
            done
          done
          echo "Total: $VALID valid, $ERRORS invalid"
          if [ $ERRORS -gt 0 ]; then exit 1; fi

      - name: Validate Jinja2 templates
        run: |
          pip3 -q install jinja2
          ERRORS=0
          for file in $(find infra/ansible/roles -name '*.j2' 2>/dev/null); do
            if python3 -c "
          from jinja2 import Environment, BaseLoader, exceptions
          env = Environment(loader=BaseLoader(), undefined=__import__('jinja2').Undefined)
          try:
              env.parse(open('$file').read())
          except exceptions.TemplateSyntaxError as e:
              print(f'Syntax error in $file: {e}')
              exit(1)
          " 2>/dev/null; then
              true
            else
              echo "::error file=$file::Invalid Jinja2 template"
              ERRORS=$((ERRORS+1))
            fi
          done
          if [ $ERRORS -gt 0 ]; then exit 1; fi
          echo "All templates valid"

      - name: Slack notify - Validation failed
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          curl -sf -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg text ":x: *Stage 1 FAILED: Build & Validate*\nConfig validation errors found — pipeline stopped.\n*Branch:* ${{ github.ref_name }} | *Commit:* \`${{ github.sha }}\`\n*Triggered by:* ${{ github.actor }} (${{ github.event_name }})\n*Logs:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{channel: "github-updates", username: "GitHub Actions", text: $text}')"

  # ──────────────────────────────────────────────────────
  # Stage 2: Deploy Int (192.168.1.193)
  # ──────────────────────────────────────────────────────
  deploy-int:
    needs: [build-validate]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: int
      env_label: "Int (192.168.1.193)"
      stage_number: "2"
      host_ip: "192.168.1.193"
      ssh_user: bwalia
      connection_mode: local
      # Vault-backed secrets. Matches the promotion pipeline int stage.
      # Pulls settings.json and .env from
      #   secret/data/wslproxy/int/{settings.json,env}
      # via VAULT_ADDR/VAULT_TOKEN (both supplied from repo secrets).
      secrets_mode: vault
      health_endpoint: "http://localhost:8080/health"
      health_check_mode: local
      docker_prune: true
      notify_success: false
      deploy_branch: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}
      deploy_mode: ${{ github.event.inputs.DEPLOY_MODE || 'full' }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      # Kept so emergency rollback to secrets_mode: github_secret is a
      # one-line revert — no secrets need to be re-added.
      SETTINGS_SECRET: ${{ secrets.DOT_WSLPROXY_SETTINGS_INT }}
      ENV_CREDS_SECRET: ${{ secrets.DOT_WSLPROXY_ENV_CREDS_INT }}

  # ──────────────────────────────────────────────────────
  # Stage 3: Smoke Test Int Environment
  # ──────────────────────────────────────────────────────
  test-int:
    name: "Stage 3: Smoke Test Int"
    runs-on: [self-hosted, Linux, int]
    needs: [deploy-int]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.19'
          cache: false

      - name: Run health check tests (Go)
        working-directory: QA
        env:
          TARGET_HOST: "http://localhost:8080"
        run: |
          go test -v -run TestHealthCheck -timeout 60s 2>&1 | tee health-results.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Go health check tests failed"
            exit 1
          fi
          echo "Health check tests passed"

      - name: Verify API endpoints
        run: |
          FAILED=0
          for ENDPOINT in /health; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://localhost:8080${ENDPOINT}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              printf "  GET :8080%-20s OK (%s)\n" "$ENDPOINT" "$STATUS"
            else
              printf "  GET :8080%-20s FAIL (%s)\n" "$ENDPOINT" "$STATUS"
              FAILED=$((FAILED+1))
            fi
          done
          for ENDPOINT in /health /api/servers /api/rules /api/waf_rules /api/waf_policies; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://localhost:8080${ENDPOINT}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              printf "  GET :8080%-20s OK (%s)\n" "$ENDPOINT" "$STATUS"
            else
              printf "  GET :8080%-20s SKIP (%s) - requires admin UI\n" "$ENDPOINT" "$STATUS"
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "::error::$FAILED core endpoint check(s) failed on 192.168.1.193"
            exit 1
          fi
          echo "All core endpoint checks passed"

      - name: Slack notify - Tests failed
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          curl -sf -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg text ":x: *Stage 3 FAILED: Smoke Test Int*\nHealth check or API endpoint tests failed — pipeline stopped before test environment.\n*Branch:* ${{ github.ref_name }} | *Commit:* \`${{ github.sha }}\`\n*Triggered by:* ${{ github.actor }} (${{ github.event_name }})\n*Logs:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{channel: "github-updates", username: "GitHub Actions", text: $text}')"

  # ──────────────────────────────────────────────────────
  # Stage 4: Deploy Test (192.168.1.140)
  # ──────────────────────────────────────────────────────
  deploy-test:
    needs: [test-int]
    if: >
      always() && !failure() && !cancelled() &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.TARGET_HOST == '192.168.1.140' || github.event.inputs.TARGET_HOST == 'all')))
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: test
      env_label: "Test (192.168.1.140)"
      stage_number: "4"
      host_ip: "192.168.1.140"
      ssh_user: bwalia
      connection_mode: ssh
      secrets_mode: runner_file
      settings_file_path: "/home/bwalia/.secrets/wslproxy/test/settings.json"
      env_file_path: "/home/bwalia/.secrets/wslproxy/test/.env"
      health_endpoint: "http://localhost:8080/health"
      health_check_mode: ssh
      docker_prune: false
      notify_success: false
      deploy_branch: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}
      deploy_mode: ${{ github.event.inputs.DEPLOY_MODE || 'full' }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ──────────────────────────────────────────────────────
  # Stage 5: Deploy Acc (187.77.179.206)
  # ──────────────────────────────────────────────────────
  deploy-acc:
    needs: [deploy-test]
    if: >
      always() && !failure() && !cancelled() &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.TARGET_HOST == '187.77.179.206' || github.event.inputs.TARGET_HOST == 'all')))
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: acc
      env_label: "ACC (187.77.179.206)"
      stage_number: "5"
      host_ip: "187.77.179.206"
      ssh_user: root
      connection_mode: ssh_key
      secrets_mode: runner_file
      settings_file_path: "/home/bwalia/.secrets/wslproxy/acc/settings.json"
      env_file_path: "/home/bwalia/.secrets/wslproxy/acc/.env"
      health_endpoint: "http://localhost:8080/health"
      health_check_mode: ssh
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}
      deploy_mode: ${{ github.event.inputs.DEPLOY_MODE || 'full' }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ──────────────────────────────────────────────────────
  # Stage 6a: Deploy Prod pop0 (187.124.112.155)
  # ──────────────────────────────────────────────────────
  deploy-prod-pop0:
    needs: [deploy-acc]
    if: >
      always() && !failure() && !cancelled() &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.TARGET_HOST == '187.124.112.155' || github.event.inputs.TARGET_HOST == 'all')))
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: prod
      env_label: "Prod pop0 (187.124.112.155)"
      stage_number: "6a"
      host_ip: "187.124.112.155"
      ssh_user: root
      connection_mode: ssh_key
      secrets_mode: github_secret
      health_endpoint: "https://prod-our.wslproxy.com/health"
      health_check_mode: external
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}
      deploy_mode: ${{ github.event.inputs.DEPLOY_MODE || 'full' }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SETTINGS_SECRET: ${{ secrets.DOT_WSLPROXY_SETTINGS_PROD }}
      ENV_CREDS_SECRET: ${{ secrets.DOT_WSLPROXY_ENV_CREDS_PROD }}

  # ──────────────────────────────────────────────────────
  # Stage 6b: Deploy Prod lon1 (72.62.211.28)
  # ──────────────────────────────────────────────────────
  deploy-prod-lon1:
    needs: [deploy-prod-pop0]
    if: >
      always() && !failure() && !cancelled() &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.TARGET_HOST == '72.62.211.28' || github.event.inputs.TARGET_HOST == 'all')))
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: prod
      env_label: "Prod lon1 (72.62.211.28)"
      stage_number: "6b"
      host_ip: "72.62.211.28"
      ssh_user: root
      connection_mode: ssh_key
      secrets_mode: runner_file
      settings_file_path: "/home/bwalia/.secrets/wslproxy/lon1/settings.json"
      env_file_path: "/home/bwalia/.secrets/wslproxy/lon1/.env"
      health_endpoint: "http://72.62.211.28:7691/health"
      health_check_mode: external
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}
      deploy_mode: ${{ github.event.inputs.DEPLOY_MODE || 'full' }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ──────────────────────────────────────────────────────
  # Pipeline Summary (always runs — final report)
  # ──────────────────────────────────────────────────────
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-validate, deploy-int, test-int, deploy-test, deploy-acc, deploy-prod-pop0, deploy-prod-lon1]
    if: always()
    steps:
      - name: Pipeline Summary
        run: |
          echo "============================================"
          echo "  WSLProxy Deployment Pipeline Summary"
          echo "============================================"
          echo ""
          echo "  Stage 1  — Build & Validate:     ${{ needs.build-validate.result }}"
          echo "  Stage 2  — Deploy Int:           ${{ needs.deploy-int.result }}"
          echo "  Stage 3  — Smoke Test Int:       ${{ needs.test-int.result }}"
          echo "  Stage 4  — Deploy Test:          ${{ needs.deploy-test.result }}"
          echo "  Stage 5  — Deploy Acc:           ${{ needs.deploy-acc.result }}"
          echo "  Stage 6a — Deploy Prod (pop0):   ${{ needs.deploy-prod-pop0.result }}"
          echo "  Stage 6b — Deploy Prod (lon1):   ${{ needs.deploy-prod-lon1.result }}"
          echo ""
          echo "  Commit:  ${{ github.sha }}"
          echo "  Branch:  ${{ github.ref_name }}"
          echo "  Trigger: ${{ github.event_name }}"
          echo "============================================"

          if [[ "${{ needs.build-validate.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-int.result }}" == "failure" ]] || \
             [[ "${{ needs.test-int.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-test.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-acc.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-prod-pop0.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-prod-lon1.result }}" == "failure" ]]; then
              echo "::error::Pipeline failed — see stage results above"
              exit 1
          fi
