name: Full Build and Deploy WSLProxy Delivery Pipeline
# Pipeline: Validate → Int → Smoke Test → Test → Prod (lon1 + pop1)
# NOTE: pop0 was rebuilt on a NEW VPS (85.190.106.189, ssh user `administrator`)
# on 2026-08-28. The OLD pop0 host 187.124.112.155 was retired — it is a k3s node
# where traefik owns :80/:443. The new pop0 is a DISPATCH-ONLY stage (5c): it is
# not deployed by a push to main/release until DNS is repointed at it and it has
# proven itself. Push-driven prod edges remain lon1 (5a) + pop1 (5b).
# Promotion pipeline: each environment must pass before the next deploys
# Deploy modes: code (default for manual) | nginx | servers | dashboard | os_deps | build | full (default for push)

on:
  push:
    branches:
      - build
  pull_request:
    branches:
      - dummy-branch-for-wslproxy-deploy

  workflow_dispatch:
    inputs:
      DEPLOY_BRANCH:
        type: string
        description: "Branch to deploy (type any existing branch name)"
        default: "build"
        required: true

      TARGET_ENV:
        type: choice
        description: "Please choose the Target environment"
        default: "prod"
        required: true
        options:
          - int
          - test
          - acc
          - prod

      TARGET_HOST:
        type: choice
        description: "Please choose the Target host"
        default: "all"
        required: true
        options:
          - all
          - 192.168.1.193
          - 192.168.1.140
          # 187.77.179.206 (acc) and the OLD pop0 187.124.112.155 were retired.
          # 72.62.211.28 (old lon1) is now a k3s worker only — the lon1 edge
          # moved to lon1.pop0.uk on 2026-08-27.
          - lon1.pop0.uk
          - 18.133.126.242
          # pop0 rebuilt on a new VPS 2026-08-28 — dispatch-only (Stage 5c),
          # never reached by `all` or by a push to main/release.
          - 85.190.106.189

      DEPLOY_MODE:
        type: choice
        description: "What to deploy"
        default: "full"
        required: true
        options:
          - code
          - nginx
          - servers
          - dashboard
          - dashboard-next
          - os_deps
          - build
          - full

# Prevent concurrent deployments to same ref (but don't cancel in-progress)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────
  # Stage 1: Build & Validate (runs on GitHub-hosted runner)
  # ──────────────────────────────────────────────────────
  build-validate:
    name: "Stage 1: Build & Validate"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Show deploy mode
        run: |
          echo "Deploy mode: ${{ github.event.inputs.DEPLOY_MODE || 'full' }}"
          echo "Target env:  ${{ github.event.inputs.TARGET_ENV || 'prod' }}"
          echo "Target host: ${{ github.event.inputs.TARGET_HOST || 'all' }}"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}

      - name: Sync html/index.html to docs/index.html (single source of truth)
        run: |
          if ! diff -q html/index.html docs/index.html > /dev/null 2>&1; then
            cp html/index.html docs/index.html
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/index.html
            git commit -m "Sync docs/index.html from html/index.html (auto)" || true
            git push || true
            echo "docs/index.html synced from html/index.html"
          else
            echo "docs/index.html already in sync"
          fi

      - name: Validate all JSON config files
        run: |
          echo "=== Validating All JSON Configs ==="
          ERRORS=0
          VALID=0
          for dir in data/servers data/rules data/waf_rules data/waf_policies; do
            for file in $(find "$dir" -name '*.json' 2>/dev/null); do
              if python3 -m json.tool "$file" > /dev/null 2>&1; then
                VALID=$((VALID+1))
              else
                echo "::error file=$file::Invalid JSON syntax"
                ERRORS=$((ERRORS+1))
              fi
            done
          done
          echo "Total: $VALID valid, $ERRORS invalid"
          if [ $ERRORS -gt 0 ]; then exit 1; fi

      - name: Validate Jinja2 templates
        run: |
          pip3 -q install jinja2
          ERRORS=0
          for file in $(find infra/ansible/roles -name '*.j2' 2>/dev/null); do
            if python3 -c "
          from jinja2 import Environment, BaseLoader, exceptions
          env = Environment(loader=BaseLoader(), undefined=__import__('jinja2').Undefined)
          try:
              env.parse(open('$file').read())
          except exceptions.TemplateSyntaxError as e:
              print(f'Syntax error in $file: {e}')
              exit(1)
          " 2>/dev/null; then
              true
            else
              echo "::error file=$file::Invalid Jinja2 template"
              ERRORS=$((ERRORS+1))
            fi
          done
          if [ $ERRORS -gt 0 ]; then exit 1; fi
          echo "All templates valid"

      - name: Slack notify - Validation failed
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          curl -sf -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg branch "${{ github.ref_name }}" \
              --arg commit "${{ github.sha }}" \
              --arg actor "${{ github.actor }}" \
              --arg event "${{ github.event_name }}" \
              --arg logs "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{channel: "github-updates", username: "GitHub Actions", text: (":x: *Stage 1 FAILED: Build & Validate*\nConfig validation errors found — pipeline stopped.\n*Branch:* \($branch) | *Commit:* `\($commit)`\n*Triggered by:* \($actor) (\($event))\n*Logs:* \($logs)")}')"

  # ──────────────────────────────────────────────────────
  # Stage 1.5: Probe the int self-hosted runner.
  #
  # The int deploy + smoke-test BOTH run ON the int host itself
  # (`runs-on: [self-hosted, Linux, int]`).  If the host is powered
  # off or unreachable, those jobs sit in GitHub's "queued" state
  # forever — the pipeline is stuck rather than failing, so manual
  # intervention is required before test/prod can run.
  #
  # This job runs on a GitHub-hosted ubuntu-latest runner (always
  # available) and asks the GitHub API whether any self-hosted
  # runner labeled `int` is currently `online`.  If none are,
  # deploy-int + test-int skip, and downstream stages (deploy-test,
  # deploy-prod-*) still run because they already use
  # `always() && !failure() && !cancelled()` guards.
  #
  # Fail-safe default: if the API call itself fails (token
  # permissions, transient network), we ASSUME ONLINE and proceed
  # as today — better to queue and time out than to silently skip
  # a real deploy when the runner is actually fine.
  # ──────────────────────────────────────────────────────
  preflight-int:
    name: "Stage 1.5: Probe Int Runner"
    needs: [build-validate]
    runs-on: ubuntu-latest
    permissions:
      actions: read # required to list self-hosted runners
    outputs:
      runner_online: ${{ steps.probe.outputs.online }}
    steps:
      - name: Check if int self-hosted runner is online
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Default to "online" so an API failure does NOT skip the
          # real deploy.  Only flip to false on a successful query
          # that returns zero online int runners.
          ONLINE=true
          REASON="(fail-safe default — API not queried)"
          if API_OUT=$(gh api "/repos/${{ github.repository }}/actions/runners" 2>&1); then
            ONLINE_COUNT=$(printf '%s' "$API_OUT" | jq '
              [ .runners[]
                | select(any(.labels[]; .name == "int"))
                | select(.status == "online")
              ] | length
            ')
            if [ "${ONLINE_COUNT:-0}" -gt 0 ]; then
              ONLINE=true
              REASON="$ONLINE_COUNT online int runner(s) found"
            else
              ONLINE=false
              REASON="no online int runner — skipping deploy-int + test-int"
            fi
          else
            # API call failed.  Most likely cause: GITHUB_TOKEN
            # doesn't have admin scope for repo-level self-hosted
            # runners.  Log the response so an operator can see why,
            # but proceed normally.
            REASON="API query failed; assuming runner online. Response: $(printf '%s' "$API_OUT" | head -c 200)"
          fi
          echo "Decision: online=$ONLINE — $REASON"
          if [ "$ONLINE" = "false" ]; then
            echo "::warning::Int runner offline — deploy-int + test-int will be skipped. Pipeline will continue to test stage. Reason: $REASON"
          else
            echo "::notice::Int runner check passed — $REASON"
          fi
          echo "online=$ONLINE" >> "$GITHUB_OUTPUT"

      - name: Slack notify - Int skipped (runner offline)
        if: steps.probe.outputs.online == 'false'
        continue-on-error: true
        shell: bash
        run: |
          curl -sf -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg branch "${{ github.ref_name }}" \
              --arg commit "${{ github.sha }}" \
              --arg actor "${{ github.actor }}" \
              --arg logs "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{channel: "github-updates", username: "GitHub Actions", text: (":warning: *Stage 2 SKIPPED: Int (192.168.1.193)*\nInt self-hosted runner is offline — deploy + smoke-test skipped, pipeline continuing to test stage.\n*Branch:* \($branch) | *Commit:* `\($commit)`\n*Triggered by:* \($actor)\n*Logs:* \($logs)")}')"

  # ──────────────────────────────────────────────────────
  # Stage 2: Deploy Int (192.168.1.193)
  # ──────────────────────────────────────────────────────
  deploy-int:
    needs: [build-validate, preflight-int]
    # Honor TARGET_HOST on workflow_dispatch (same as test/prod stages) so a
    # lon1-only / pop0-only / pop1-only run never touches int. Push events
    # still deploy int when the runner is online.
    if: >
      needs.preflight-int.outputs.runner_online == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.TARGET_HOST == '192.168.1.193' ||
       github.event.inputs.TARGET_HOST == 'all')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: int
      env_label: "Int (192.168.1.193)"
      stage_number: "2"
      host_ip: "192.168.1.193"
      ssh_user: bwalia
      connection_mode: local
      # Secrets decrypted from committed SOPS+age files
      # (infra/secrets/<env>/) using the SOPS_AGE_KEY repo secret.
      # Matches the promotion pipeline int stage.
      secrets_mode: sops
      health_endpoint: "http://localhost:8080/healthz"
      health_check_mode: local
      docker_prune: true
      notify_success: false
      deploy_branch: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}
      deploy_mode: ${{ github.event.inputs.DEPLOY_MODE || 'full' }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      # Kept so emergency rollback to secrets_mode: github_secret is a
      # one-line revert — no secrets need to be re-added.
      SETTINGS_SECRET: ${{ secrets.DOT_WSLPROXY_SETTINGS_INT }}
      ENV_CREDS_SECRET: ${{ secrets.DOT_WSLPROXY_ENV_CREDS_INT }}

  # ──────────────────────────────────────────────────────
  # Stage 3: Smoke Test Int Environment
  # ──────────────────────────────────────────────────────
  test-int:
    name: "Stage 3: Smoke Test Int"
    runs-on: [self-hosted, Linux, int]
    needs: [deploy-int, preflight-int]
    # Only smoke-test when the int runner was actually online AND
    # deploy-int succeeded.  Without the preflight gate this job
    # would also queue forever waiting for the offline int runner.
    if: |
      always() && !failure() && !cancelled() &&
      needs.preflight-int.outputs.runner_online == 'true' &&
      needs.deploy-int.result == 'success'
    timeout-minutes: 15
    steps:
      # actions/checkout's git-clean cannot unlink root-owned build
      # artifacts left in the persistent self-hosted workspace (e.g.
      # openresty-admin-next/.next/BUILD_ID created by a prior root/sudo
      # Next.js build), which fails the Checkout step with EACCES and
      # blocks promotion. Reclaim ownership before checkout runs.
      - name: Pre-checkout cleanup (reclaim runner workspace)
        run: |
          if [ -n "$GITHUB_WORKSPACE" ] && [ -d "$GITHUB_WORKSPACE" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
            sudo rm -rf "$GITHUB_WORKSPACE/openresty-admin-next/.next" 2>/dev/null || true
          fi
        shell: bash

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.19"
          cache: false

      - name: Run health check tests (Go)
        working-directory: QA
        env:
          TARGET_HOST: "http://localhost:8080"
        run: |
          go test -v -run TestHealthCheck -timeout 60s 2>&1 | tee health-results.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Go health check tests failed"
            exit 1
          fi
          echo "Health check tests passed"

      - name: Verify API endpoints
        run: |
          FAILED=0
          for ENDPOINT in /healthz; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://localhost:8080${ENDPOINT}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              printf "  GET :8080%-20s OK (%s)\n" "$ENDPOINT" "$STATUS"
            else
              printf "  GET :8080%-20s FAIL (%s)\n" "$ENDPOINT" "$STATUS"
              FAILED=$((FAILED+1))
            fi
          done
          for ENDPOINT in /healthz /api/servers /api/rules /api/waf_rules /api/waf_policies; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://localhost:8080${ENDPOINT}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              printf "  GET :8080%-20s OK (%s)\n" "$ENDPOINT" "$STATUS"
            else
              printf "  GET :8080%-20s SKIP (%s) - requires admin UI\n" "$ENDPOINT" "$STATUS"
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "::error::$FAILED core endpoint check(s) failed on 192.168.1.193"
            exit 1
          fi
          echo "All core endpoint checks passed"

      - name: Slack notify - Tests failed
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          curl -sf -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg branch "${{ github.ref_name }}" \
              --arg commit "${{ github.sha }}" \
              --arg actor "${{ github.actor }}" \
              --arg event "${{ github.event_name }}" \
              --arg logs "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{channel: "github-updates", username: "GitHub Actions", text: (":x: *Stage 3 FAILED: Smoke Test Int*\nHealth check or API endpoint tests failed — pipeline stopped before test environment.\n*Branch:* \($branch) | *Commit:* `\($commit)`\n*Triggered by:* \($actor) (\($event))\n*Logs:* \($logs)")}')"

  # ──────────────────────────────────────────────────────
  # Stage 4: Deploy Test (192.168.1.140)
  # ──────────────────────────────────────────────────────
  deploy-test:
    # List the WHOLE upstream chain, not just the immediate predecessor:
    # GitHub's failure() only sees direct needs, so with needs:[test-int] a
    # hard failure of build-validate or deploy-int (which makes test-int
    # merely *skip*) slipped past the `!failure()` guard and Test/Prod still
    # deployed. Naming the full chain makes any upstream FAILURE block
    # promotion, while always() still lets legitimate SKIPS (offline int
    # runner, host-mismatched stages) pass through.
    needs: [build-validate, deploy-int, test-int]
    if: >
      always() && !failure() && !cancelled() &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.TARGET_HOST == '192.168.1.140' || github.event.inputs.TARGET_HOST == 'all')))
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: test
      env_label: "Test (192.168.1.140)"
      stage_number: "4"
      host_ip: "192.168.1.140"
      ssh_user: bwalia
      connection_mode: ssh
      # vault_or_sops so any runner can deploy; runner_file (previous
      # value) required /home/bwalia/.secrets/wslproxy/test/{...} to
      # exist on the runner FS, which pinned the job to the LAN test
      # runner and broke portability.
      secrets_mode: vault_or_sops
      health_endpoint: "http://localhost:8080/healthz"
      health_check_mode: ssh
      docker_prune: false
      notify_success: false
      deploy_branch: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}
      deploy_mode: ${{ github.event.inputs.DEPLOY_MODE || 'full' }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  # Stage 5 (acc / 187.77.179.206) was decommissioned.  Prod stages
  # below now depend directly on `deploy-test` so the pipeline still
  # gates production behind a successful non-prod deploy.

  # ──────────────────────────────────────────────────────
  # Stage 5a: Deploy Prod lon1 (lon1.pop0.uk)
  # (lon1 relocated 2026-08-27: the old lon1 host 72.62.211.28 is now a k3s
  #  worker only. The former Stage 5a "pop0" / 187.124.112.155 was retired:
  #  that host is a k3s/traefik node with no wslproxy edge and no DNS, so it
  #  never served prod traffic. pop0 was rebuilt on a new VPS — see Stage 5c.)
  # ──────────────────────────────────────────────────────
  deploy-prod-lon1:
    # Full upstream chain — see deploy-test.
    needs: [build-validate, deploy-int, test-int, deploy-test]
    if: >
      always() && !failure() && !cancelled() &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.TARGET_HOST == 'lon1.pop0.uk' || github.event.inputs.TARGET_HOST == 'all')))
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: prod
      # Schedule on mac-studio (`acc`) — same rationale as pop1: the
      # historical `prod` runner on pop0 has no SSH trust to lon1.
      runner_label: acc
      env_label: "Prod lon1 (lon1.pop0.uk)"
      stage_number: "5a"
      host_ip: "lon1.pop0.uk"
      ssh_user: root
      connection_mode: ssh_key
      # Same as pop0/pop1 — runner_file required
      # /home/bwalia/.secrets/wslproxy/lon1/ on the runner FS, which the
      # mac-studio / non-LAN runners do not have (lon1-only dispatch
      # 31281185587 failed at "Settings file not found"). Vault-first
      # with SOPS prod fallback keeps lon1-only nginx deploys portable.
      secrets_mode: vault_or_sops
      # Prefer public dashboard health over IP:7691 so external checks
      # match https://lon1.pop0.uk (admin UI behind public 443).
      health_endpoint: "https://lon1.pop0.uk/healthz"
      health_check_mode: external
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}
      deploy_mode: ${{ github.event.inputs.DEPLOY_MODE || 'full' }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  # ──────────────────────────────────────────────────────
  # Stage 5b: Deploy Prod pop1 (18.133.126.242) — AWS eu-west-2, ssh user admin
  # Runs LAST, after lon1, only when it (and all prior stages) pass.
  # Dashboard domain: pop1.diytaxreturn.co.uk
  # ──────────────────────────────────────────────────────
  deploy-prod-pop1:
    # Full upstream chain — see deploy-test.
    needs: [build-validate, deploy-int, test-int, deploy-test, deploy-prod-lon1]
    if: >
      always() && !failure() && !cancelled() &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.TARGET_HOST == '18.133.126.242' || github.event.inputs.TARGET_HOST == 'all')))
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: prod
      # Schedule on the mac-studio runner (labelled `acc`) rather than the
      # historical `prod` runner on pop0 — pop0 has no SSH trust to pop1
      # and every dispatch failed at "SSH connection failed to
      # admin@18.133.126.242" (run 30341173054). env_name stays `prod` so
      # ansible target_env / Vault path / SOPS payload profile are prod.
      runner_label: acc
      env_label: "Prod pop1 (18.133.126.242)"
      stage_number: "5b"
      host_ip: "18.133.126.242"
      ssh_user: admin
      connection_mode: ssh_key
      # Same rationale as pop0 (Stage 5a) — Vault-first with SOPS
      # fallback so a broken runner SSH key or an offline Vault can't
      # take the pipeline down.
      secrets_mode: vault_or_sops
      # pop1 is DASHBOARD-ONLY: nginx_default_server_backend is empty, so no
      # admin block listens on :7691 (lon1 differs — it sets that var, so its
      # :7691 gate is fine). The old IP:7691 gate could never pass here. Health-
      # check the public dashboard domain on 443 — valid LE cert, /healthz 200.
      health_endpoint: "https://pop1.diytaxreturn.co.uk/healthz"
      health_check_mode: external
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}
      deploy_mode: ${{ github.event.inputs.DEPLOY_MODE || 'full' }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  # ──────────────────────────────────────────────────────
  # Stage 5c: Deploy Prod pop0 (85.190.106.189) — new VPS, ssh user
  # `administrator`, commissioned 2026-08-28 to replace the retired
  # 187.124.112.155.
  #
  # DISPATCH-ONLY BY DESIGN: unlike 5a/5b there is no `push` clause and it is
  # NOT included in TARGET_HOST == 'all'. A brand-new edge with no DNS should
  # not be dragged into every release; select it explicitly. Promote it to the
  # push chain (copy 5a's `if:`) once DNS points here and it has run clean.
  #
  # health_check_mode is `ssh` because nothing resolves to this IP yet — an
  # external check on prod-our.wslproxy.com would green on lon1 instead.
  # ──────────────────────────────────────────────────────
  deploy-prod-pop0:
    # Same upstream gate as the other prod stages — prod is never reached
    # without a green int + smoke test + test.
    needs: [build-validate, deploy-int, test-int, deploy-test]
    if: >
      always() && !failure() && !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.TARGET_HOST == '85.190.106.189'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      env_name: prod
      # mac-studio runner (`acc`) — the old `prod` runner lived ON the retired
      # pop0 box and is gone; `acc` is the runner holding the prod SSH key.
      runner_label: acc
      env_label: "Prod pop0 (85.190.106.189)"
      stage_number: "5c"
      host_ip: "85.190.106.189"
      ssh_user: administrator
      connection_mode: ssh_key
      secrets_mode: vault_or_sops
      health_endpoint: "http://127.0.0.1:7691/healthz"
      health_check_mode: ssh
      docker_prune: true
      notify_success: true
      deploy_branch: ${{ github.event.inputs.DEPLOY_BRANCH || github.ref_name }}
      deploy_mode: ${{ github.event.inputs.DEPLOY_MODE || 'full' }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  # ──────────────────────────────────────────────────────
  # Pipeline Summary (always runs — final report)
  # ──────────────────────────────────────────────────────
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs:
      [
        build-validate,
        deploy-int,
        test-int,
        deploy-test,
        deploy-prod-lon1,
        deploy-prod-pop1,
        deploy-prod-pop0,
      ]
    if: always()
    steps:
      - name: Pipeline Summary
        run: |
          echo "============================================"
          echo "  WSLProxy Deployment Pipeline Summary"
          echo "============================================"
          echo ""
          echo "  Stage 1  — Build & Validate:     ${{ needs.build-validate.result }}"
          echo "  Stage 2  — Deploy Int:           ${{ needs.deploy-int.result }}"
          echo "  Stage 3  — Smoke Test Int:       ${{ needs.test-int.result }}"
          echo "  Stage 4  — Deploy Test:          ${{ needs.deploy-test.result }}"
          echo "  Stage 5a — Deploy Prod (lon1):   ${{ needs.deploy-prod-lon1.result }}"
          echo "  Stage 5b — Deploy Prod (pop1):   ${{ needs.deploy-prod-pop1.result }}"
          echo "  Stage 5c — Deploy Prod (pop0):   ${{ needs.deploy-prod-pop0.result }}"
          echo ""
          echo "  Commit:  ${{ github.sha }}"
          echo "  Branch:  ${{ github.ref_name }}"
          echo "  Trigger: ${{ github.event_name }}"
          echo "============================================"

          if [[ "${{ needs.build-validate.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-int.result }}" == "failure" ]] || \
             [[ "${{ needs.test-int.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-test.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-prod-lon1.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-prod-pop1.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-prod-pop0.result }}" == "failure" ]]; then
              echo "::error::Pipeline failed — see stage results above"
              exit 1
          fi
