# Deploy WSLProxy control plane to k3s1 via Ring Promoter
#
# On merge to main: build/push bwalia/wslproxy:sha-<short> +
# bwalia/wslproxy-admin-next:sha-<short>, then seed wslproxy-k3s1 prod on
# https://rp.workstation.co.uk/ — that creates a ring-exec Job which
# Vault-bootstraps + helm-upgrades wslproxy-ingress in wslproxy-system
# (pinned to cloud003 / cp.pop0.uk) and applies the Traefik path split.
#
# Repo secrets:
#   DOCKER_USER / DOCKER_PASSWD
#   RP_URL    = https://rp.workstation.co.uk
#   RP_TOKEN  = workstation ring-promoter RP_API_TOKEN
#   RP_PROD_PASSWORD (optional; only if RP_PROD_PASSWORD is set on the instance)
#
# One-time cluster prereqs (not created by this workflow):
#   kubectl -n ring-exec create secret generic wslproxy-vault \
#     --from-literal=VAULT_ADDR=https://vault.workstation.co.uk \
#     --from-literal=VAULT_TOKEN=hvs.…
#   kubectl apply -f deploy/ring-promoter/k3s1-rbac.yaml
#   App registered in workstation ConfigMap (ring-promoter deploy/k8s/configmap.yaml)

name: Deploy control plane (k3s1)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "Dockerfile"
      - "docker-entrypoint*.sh"
      - "scripts/write-admin-runtime-config.sh"
      - "scripts/k3s1*.sh"
      - "openresty-admin/**"
      - "openresty-admin-next/**"
      - "ingress-controller/deploy/helm/**"
      - "deploy/k3s1/**"
      - "deploy/postgres/**"
      - "deploy/ring-promoter/**"
      - ".github/workflows/deploy-control-plane-k3s1.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Git ref / SHA to seed (default: this commit SHA)"
        required: false
        default: ""

concurrency:
  group: deploy-control-plane-k3s1
  cancel-in-progress: false

env:
  IMAGE: docker.io/bwalia/wslproxy
  DASHBOARD_IMAGE: docker.io/bwalia/wslproxy-admin-next
  RP_URL_DEFAULT: https://rp.workstation.co.uk

jobs:
  deploy:
    name: Build images + seed prod on rp.workstation.co.uk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${{ github.sha }}"; fi
          SHORT="$(printf '%s' "$VER" | cut -c1-7)"
          if [ "${#VER}" -eq 40 ]; then
            TAG="sha-${SHORT}"
          else
            TAG="$VER"
          fi
          DEPLOY_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Prefer package.json version for the footer when available.
          APP_VER="$(jq -r '.version // empty' openresty-admin-next/package.json 2>/dev/null || true)"
          if [ -z "$APP_VER" ]; then APP_VER="$SHORT"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "deploy_time=$DEPLOY_TIME" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VER" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "Deploy version=${VER} image_tag=${TAG} app_version=${APP_VER}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWD }}

      - name: Build and push bwalia/wslproxy
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Build and push bwalia/wslproxy-admin-next
        uses: docker/build-push-action@v5
        with:
          context: ./openresty-admin-next
          file: ./openresty-admin-next/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.DASHBOARD_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.app_version }}
            NEXT_PUBLIC_APP_BUILD_NUMBER=${{ steps.meta.outputs.build_number }}
            NEXT_PUBLIC_DEPLOYMENT_TIME=${{ steps.meta.outputs.deploy_time }}
            NEXT_PUBLIC_ENV_NAME=prod
            NEXT_PUBLIC_GIT_SHA=${{ steps.meta.outputs.version }}
            NEXT_PUBLIC_GIT_REPO=bwalia/wslproxy
            NEXT_PUBLIC_TARGET_PLATFORM=KUBERNETES
          cache-from: type=gha,scope=admin-next
          cache-to: type=gha,mode=max,scope=admin-next
          provenance: false
          sbom: false

      - name: Seed wslproxy-k3s1 prod via Ring Promoter
        id: seed
        continue-on-error: true
        env:
          RP_URL: ${{ secrets.RP_URL }}
          RP_TOKEN: ${{ secrets.RP_TOKEN }}
          RP_PROD_PASSWORD: ${{ secrets.RP_PROD_PASSWORD }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          RP_URL="${RP_URL:-$RP_URL_DEFAULT}"
          RP_URL="${RP_URL%/}"
          case "$RP_URL" in
            https://rp.workstation.co.uk) ;;
            *)
              echo "::error::RP_URL must be https://rp.workstation.co.uk (got: ${RP_URL})"
              exit 1
              ;;
          esac
          if [ -z "${RP_TOKEN:-}" ]; then
            echo "::error::secrets.RP_TOKEN is empty — set workstation RP_API_TOKEN on bwalia/wslproxy"
            exit 1
          fi

          BODY=$(jq -n \
            --arg ring prod \
            --arg version "$VERSION" \
            --arg password "${RP_PROD_PASSWORD:-}" \
            '{ring:$ring, version:$version} + (if $password != "" then {password:$password} else {} end)')

          echo "POST ${RP_URL}/api/apps/wslproxy-k3s1/seed"
          echo "body: $(echo "$BODY" | jq -c 'del(.password) | . + (if .password then {password:"***"} else {} end)' 2>/dev/null || echo "$BODY" | sed 's/"password":"[^"]*"/"password":"***"/')"

          # Sync seed waits for the k8sjob (timeout 25m on the app).
          # Allow up to 35m wall clock — RP/gateway 504s were aborting at ~12m.
          HTTP_CODE=$(curl -sS -o /tmp/rp-seed.json -w '%{http_code}' \
            --connect-timeout 30 \
            --max-time 2100 \
            -X POST "${RP_URL}/api/apps/wslproxy-k3s1/seed" \
            -H "Authorization: Bearer ${RP_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$BODY")

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/rp-seed.json
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Ring Promoter seed failed (HTTP ${HTTP_CODE}). Images are on Docker Hub; retry seed or helm-upgrade manually."
            exit 1
          fi

          echo "seed accepted"

      # RP sync seed frequently returns HTTP 504 from the edge while the
      # in-cluster ring-exec Job still finishes helm + Traefik apply. Treat
      # gateway timeouts as soft-fail and let smoke decide success.
      - name: Smoke check control plane
        id: smoke
        run: |
          set -euo pipefail
          SEED_OK="${{ steps.seed.outcome }}"
          if [ "$SEED_OK" != "success" ]; then
            echo "::warning::Ring Promoter seed HTTP failed (outcome=${SEED_OK}). Waiting for in-cluster Job; images ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }} + ${{ env.DASHBOARD_IMAGE }}:${{ steps.meta.outputs.tag }} are on Docker Hub."
          fi
          NEXT_OK=0
          for i in $(seq 1 48); do
            code=$(curl -sS -o /tmp/cp-health.body -w '%{http_code}' \
              --connect-timeout 5 --max-time 15 \
              https://cp.pop0.uk/healthz || true)
            echo "attempt $i healthz: HTTP ${code}"
            if [ "$code" = "200" ]; then
              head -c 200 /tmp/cp-health.body; echo
              ui=$(curl -sS -o /tmp/cp-login.body -w '%{http_code}' \
                --connect-timeout 5 --max-time 15 \
                https://cp.pop0.uk/login || true)
              echo "login: HTTP ${ui}"
              if grep -qiE 'next|Outfit|fraunces|WSLProxy Admin|generator" content="Next' /tmp/cp-login.body 2>/dev/null; then
                echo "Next.js UI looks live"
                NEXT_OK=1
                echo "next_ok=1" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::warning::/login did not look like Next.js yet (may still be rolling Traefik path split)"
            fi
            sleep 10
          done
          echo "next_ok=0" >> "$GITHUB_OUTPUT"
          if [ "$SEED_OK" = "success" ]; then
            echo "::warning::seed accepted but cp.pop0.uk did not show Next.js within ~8m — check https://rp.workstation.co.uk/?app=wslproxy-k3s1"
            exit 0
          fi
          echo "::error::Ring Promoter seed failed and cp.pop0.uk did not become healthy with Next.js. Images were pushed — helm-upgrade manually with tag ${{ steps.meta.outputs.tag }} and apply deploy/k3s1/wslproxy-cp-traefik-ingress.yaml."
          exit 1
