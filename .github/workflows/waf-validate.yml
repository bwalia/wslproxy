name: WAF — validate & live attack matrix

# Offline: Lua syntax + policy/schema integrity.
# Live: fire every payments-hard signature / v2 stage at fictionally.org
#        (secure must block; open must not).
#
# Triggers:
#   - push / PR touching WAF code or this suite
#   - push to main (always run live matrix — regression gate)
#   - workflow_dispatch (manual; hosts overridable)

on:
  # Every merge to main — live matrix is the regression gate for payments WAF.
  push:
    branches: [main]
  pull_request:
    paths:
      - "api/waf_*.lua"
      - "data/waf_rules/**"
      - "data/waf_policies/**"
      - "docs/waf-policy.schema.json"
      - "tools/waf_validate.py"
      - "examples/wslproxy-waf-demo/**"
      - ".github/workflows/waf-validate.yml"
  workflow_dispatch:
    inputs:
      SECURE_HOST:
        description: "WAF-protected host"
        required: false
        default: "https://payments-secure.fictionally.org"
      OPEN_HOST:
        description: "Unprotected control host (WAF off)"
        required: false
        default: "https://payments.fictionally.org"
      SKIP_OPEN:
        description: "Skip open-host control assertions (true/false)"
        required: false
        default: "false"

concurrency:
  group: waf-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lua syntax + policy schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT + jsonschema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends luajit >/dev/null
          python3 -m pip install --quiet jsonschema

      - name: Lua syntax check (all WAF modules)
        run: |
          set -e
          fail=0
          for f in api/waf_engine.lua api/waf_stages.lua api/waf_support.lua; do
            if luajit -bl "$f" >/dev/null 2>err.txt; then
              echo "  ok   $f"
            else
              echo "::error file=$f::Lua syntax error"; cat err.txt; fail=1
            fi
          done
          exit $fail

      - name: Validate policies + signatures
        run: python3 tools/waf_validate.py

  live-matrix:
    name: Live WAF attack matrix
    needs: validate
    # Run on main pushes, manual dispatch, and PRs that touch WAF paths.
    # Public HTTPS endpoints — hosted runners are fine.
    if: >
      always() && needs.validate.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve hosts
        id: hosts
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SECURE='${{ inputs.SECURE_HOST }}'
            OPEN='${{ inputs.OPEN_HOST }}'
            SKIP='${{ inputs.SKIP_OPEN }}'
          else
            SECURE='https://payments-secure.fictionally.org'
            OPEN='https://payments.fictionally.org'
            SKIP='false'
          fi
          echo "secure=$SECURE" >> "$GITHUB_OUTPUT"
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"
          echo "skip_open=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Secure: $SECURE"
          echo "Open:   $OPEN"
          echo "Skip open control: $SKIP"

      - name: Preflight connectivity
        run: |
          set -e
          # Use / (not /health): payments.fictionally.org has no /health route.
          for base in "${{ steps.hosts.outputs.secure }}" \
                      "${{ steps.hosts.outputs.open }}"; do
            url="${base}/"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "$url → $code"
            if [ "$code" != "200" ]; then
              echo "::error::$url not healthy (HTTP $code)"
              exit 1
            fi
          done

      - name: Run live WAF matrix (all rules)
        run: |
          set -e
          ARGS=(
            --secure "${{ steps.hosts.outputs.secure }}"
            --open "${{ steps.hosts.outputs.open }}"
            -v
          )
          if [ "${{ steps.hosts.outputs.skip_open }}" = "true" ]; then
            ARGS+=(--skip-open)
          fi
          python3 examples/wslproxy-waf-demo/test_waf_live.py "${ARGS[@]}"
