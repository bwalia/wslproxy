name: WSL Proxy Admin UI Login Tests

on:
  push:
    branches:
      - feat/admin-ui-login-workflow
    paths:
      - "openresty-admin/e2e/login.spec.js"
      - "openresty-admin/e2e/login-next.spec.js"
      - "openresty-admin/e2e/helpers.js"
      - "openresty-admin/e2e/global-setup.js"
      - "openresty-admin/playwright.config.js"
      - "openresty-admin/package*.json"
      - ".github/workflows/e2e-admin-ui-login.yml"
  schedule:
    # Hourly smoke check that the admin login is healthy
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      TARGET_ENV:
        type: choice
        description: "Target environment to test (must be a key in the ADMIN_LOGIN_URLS variable)"
        default: "prod"
        required: true
        options:
          - prod

jobs:
  setup:
    name: "Setup test matrix"
    runs-on: [self-hosted]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Determine environments to test
        id: set-matrix
        env:
          # URLs are NOT hardcoded in this workflow. They live in the
          # ADMIN_LOGIN_URLS repo variable, a JSON map of env -> [urls], e.g.
          #   {"int":["http://.../"],"prod":["https://a","https://b"]}
          # so endpoints can change (or prod can test several URLs) without
          # editing this file.
          URLS_JSON: ${{ vars.ADMIN_LOGIN_URLS }}
          EVENT: ${{ github.event_name }}
          DISPATCH_ENV: ${{ inputs.TARGET_ENV }}
        run: |
          # workflow_dispatch tests only the chosen env; schedule/push test
          # every env present in the variable. Each env fans out to every URL
          # configured for it (so prod runs once per prod URL), and each URL
          # carries the Playwright "suite"/project to run against it
          # (login = React-Admin, login-next = Next.js dashboard). A URL may be
          # a bare string (defaults to the "login" suite) or {url, suite}.
          MATRIX=$(python3 -c '
          import json, os
          urls = json.loads(os.environ.get("URLS_JSON") or "{}")
          envs = [os.environ["DISPATCH_ENV"]] if os.environ.get("EVENT") == "workflow_dispatch" else sorted(urls.keys())
          include = [({"environment": e, "url": it, "suite": "login"} if isinstance(it, str) else {"environment": e, "url": it["url"], "suite": it.get("suite", "login")}) for e in envs for it in urls.get(e, [])]
          print(json.dumps({"include": include}))
          ')
          if [ -z "$(echo "$MATRIX" | python3 -c 'import json,sys; print(json.load(sys.stdin)["include"])')" ] || \
             [ "$MATRIX" = '{"include": []}' ]; then
            echo "::error::No URLs configured in ADMIN_LOGIN_URLS for the selected environment(s)."
            exit 1
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" | python3 -m json.tool

  login:
    name: "${{ matrix.suite == 'login' && 'Legacy Admin UI Login' || 'Admin UI Login' }} (${{ matrix.environment }} ${{ matrix.url }})"
    needs: setup
    # Pin to the runner whose label matches the env under test, so the
    # job lands on the host that actually has that env's login-creds.json
    # (prod creds live on srv1467484, int creds on slworker00, etc.).
    runs-on: [self-hosted, "${{ matrix.environment }}"]
    timeout-minutes: 8
    concurrency:
      # Per (env, url) so the multiple prod URLs don't cancel each other.
      group: e2e-admin-login-${{ github.ref }}-${{ matrix.environment }}-${{ matrix.url }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: openresty-admin

    steps:
      - name: Reset workspace (clear root-owned build artifacts)
        # A prior deploy builds the Next.js admin as root and leaves root-owned
        # files (openresty-admin-next/.next/*) in this runner's workspace.
        # actions/checkout's default `clean` step then fails with
        # `EACCES: permission denied, unlink .../.next/BUILD_ID` and the whole
        # job dies before any test runs. Best-effort reclaim ownership so the
        # checkout can proceed. Runs from the runner workspace root (which always
        # exists) rather than the job's openresty-admin default.
        working-directory: ${{ runner.workspace }}
        run: |
          sudo chown -R "$(id -u)":"$(id -g)" . 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Defence in depth: even if the reclaim above couldn't run (no sudo),
          # don't let leftover untracked root-owned files abort the checkout.
          clean: false

      - name: Set environment config
        id: env_config
        working-directory: .
        env:
          TARGET_URL: ${{ matrix.url }}
        run: |
          ENV="${{ matrix.environment }}"
          # creds_file (email/password) is the only per-env path; the URL under
          # test comes from the matrix (sourced from the ADMIN_LOGIN_URLS repo
          # variable), so no URLs are hardcoded here.
          echo "creds_file=/home/bwalia/.secrets/wslproxy/${ENV}/login-creds.json" >> "$GITHUB_OUTPUT"
          # Slug of the URL for unique artifact / report names (one prod job
          # per prod URL would otherwise collide).
          SLUG=$(printf '%s' "$TARGET_URL" | sed -E 's#^https?://##; s#[^a-zA-Z0-9]+#-#g; s#^-+|-+$##g')
          echo "url_slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Environment: $ENV, URL: $TARGET_URL (slug: $SLUG)"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: openresty-admin/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Validate test credentials
        id: validate
        working-directory: .
        env:
          TEST_CREDS_FILE: ${{ steps.env_config.outputs.creds_file }}
          # Canonical prod admin login, also used by the API test workflows.
          # Only wired as a fallback for prod (the matrix is prod-only today);
          # other envs keep relying solely on their on-runner creds file.
          FALLBACK_EMAIL: ${{ matrix.environment == 'prod' && secrets.LOGIN_EMAIL || '' }}
          FALLBACK_PASSWORD: ${{ matrix.environment == 'prod' && secrets.LOGIN_PASSWORD || '' }}
        run: |
          # Only credentials are required from the file; the URL under test comes
          # from the ADMIN_LOGIN_URLS repo variable, not the creds file.
          valid_creds() {
            [ -f "$1" ] && python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if ('ADMIN_EMAIL' in d and 'ADMIN_PASSWORD' in d) else 1)" "$1" 2>/dev/null
          }
          # Prefer the on-runner file; self-heal from LOGIN_EMAIL/LOGIN_PASSWORD
          # repo secrets when it is missing or malformed (e.g. after a credential
          # rotation that only updated the secret). The healed creds go to a
          # writable temp file — the on-runner login-creds.json is often root-owned
          # (left by a prior deploy) and not writable by the runner user.
          EFFECTIVE="$TEST_CREDS_FILE"
          if ! valid_creds "$TEST_CREDS_FILE"; then
            if [ -n "$FALLBACK_EMAIL" ] && [ -n "$FALLBACK_PASSWORD" ]; then
              echo "On-runner creds file missing/invalid — using LOGIN_EMAIL/LOGIN_PASSWORD repo secrets."
              EFFECTIVE="${RUNNER_TEMP:-/tmp}/wslproxy-login-creds.json"
              EFFECTIVE="$EFFECTIVE" python3 -c "import json,os; json.dump({'ADMIN_EMAIL':os.environ['FALLBACK_EMAIL'],'ADMIN_PASSWORD':os.environ['FALLBACK_PASSWORD']}, open(os.environ['EFFECTIVE'],'w'))"
              chmod 600 "$EFFECTIVE" 2>/dev/null || true
              # Best-effort: refresh the on-runner file too so other workflows
              # (e2e-tests.yml) benefit. Ignore failure if it isn't writable.
              cp "$EFFECTIVE" "$TEST_CREDS_FILE" 2>/dev/null || true
            else
              echo "::error::Test credentials file at $TEST_CREDS_FILE is missing/invalid and no LOGIN_EMAIL/LOGIN_PASSWORD fallback is available for ${{ matrix.environment }}."
              echo "Create it with: echo '{\"ADMIN_EMAIL\":\"...\",\"ADMIN_PASSWORD\":\"...\"}' > $TEST_CREDS_FILE"
              exit 1
            fi
          fi
          if ! valid_creds "$EFFECTIVE"; then
            echo "::error::Test credentials still invalid after fallback for ${{ matrix.environment }} (ADMIN_EMAIL, ADMIN_PASSWORD required)."
            exit 1
          fi
          # Downstream steps read from the resolved path (on-runner file or the
          # temp fallback), not the raw env_config path.
          echo "creds_file=$EFFECTIVE" >> "$GITHUB_OUTPUT"
          echo "Test credentials validated for ${{ matrix.environment }}."

      - name: Load test credentials
        id: creds
        working-directory: .
        env:
          TEST_CREDS_FILE: ${{ steps.validate.outputs.creds_file }}
        run: |
          EMAIL=$(python3 -c "import json; print(json.load(open('$TEST_CREDS_FILE'))['ADMIN_EMAIL'])")
          PASSWORD=$(python3 -c "import json; print(json.load(open('$TEST_CREDS_FILE'))['ADMIN_PASSWORD'])")
          echo "::add-mask::$EMAIL"
          echo "::add-mask::$PASSWORD"
          echo "email=$EMAIL" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Wait for admin UI to be reachable
        working-directory: .
        env:
          TARGET_URL: ${{ matrix.url }}
        run: |
          echo "Checking admin UI at $TARGET_URL (${{ matrix.environment }}) ..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL" 2>/dev/null || echo "000")
            # Treat any 2xx/3xx as reachable — prod gateway redirects with 307
            # to /login, which is the expected behavior for an unauthenticated GET.
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "Admin UI is reachable (HTTP $STATUS)."
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS - waiting 5s..."
            sleep 5
          done
          echo "::error::Admin UI not reachable at $TARGET_URL after 60s"
          exit 1

      - name: Preflight - verify login credentials against the backend
        # The browser tests below fail cryptically ("Parse test results") when
        # the *credentials* are stale rather than the login being down — e.g.
        # after the 2026-06-29 secrets migration re-wrote prod's
        # settings.super_user without updating this test's creds file/secret.
        # Hit /api/user/login directly with the exact creds the tests will use
        # and classify the outcome, so the failure is actionable and the Slack
        # message doesn't wrongly cry "Admin UI login may be broken".
        working-directory: .
        env:
          TARGET_URL: ${{ matrix.url }}
          E2E_TEST_EMAIL: ${{ steps.creds.outputs.email }}
          E2E_TEST_PASSWORD: ${{ steps.creds.outputs.password }}
        run: |
          # Body is masked by ::add-mask:: on email/password already; only the
          # HTTP status is echoed here.
          STATUS=$(EMAIL="$E2E_TEST_EMAIL" PASSWORD="$E2E_TEST_PASSWORD" python3 - "$TARGET_URL" <<'PY'
          import json, os, sys, urllib.request, urllib.error
          url = sys.argv[1].rstrip('/') + '/api/user/login'
          body = json.dumps({'email': os.environ['EMAIL'], 'password': os.environ['PASSWORD']}).encode()
          req = urllib.request.Request(url, data=body, method='POST',
                                       headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  print(r.status)
          except urllib.error.HTTPError as e:
              print(e.code)
          except Exception:
              print('000')
          PY
          )
          echo "Login API responded HTTP $STATUS for ${{ matrix.url }}"
          case "$STATUS" in
            200)
              echo "Credentials accepted by the backend — proceeding to UI tests." ;;
            401|403)
              echo "::error::Login credentials REJECTED (HTTP $STATUS) by ${{ matrix.url }}. This is a credential mismatch, not a UI outage: the backend settings.super_user no longer matches this job's test creds (on-runner login-creds.json / LOGIN_EMAIL+LOGIN_PASSWORD secrets). Reconcile the two — see api/api.lua login handler and infra/ansible/.../deploy_data.yml."
              exit 1 ;;
            000)
              echo "::error::Could not reach the login API at ${{ matrix.url }}/api/user/login (network/TLS/timeout)."
              exit 1 ;;
            *)
              echo "::error::Login API returned unexpected HTTP $STATUS for ${{ matrix.url }} — the admin login backend may be broken."
              exit 1 ;;
          esac

      - name: Run Admin UI Login tests
        id: tests
        env:
          E2E_TEST_EMAIL: ${{ steps.creds.outputs.email }}
          E2E_TEST_PASSWORD: ${{ steps.creds.outputs.password }}
          E2E_BASE_URL: ${{ matrix.url }}
          CI: "true"
        run: npx playwright test --project=${{ matrix.suite }} 2>&1 | tee playwright-output.txt || true

      - name: Parse test results
        id: results
        if: always()
        run: |
          OUTPUT=$(cat playwright-output.txt 2>/dev/null || echo "No output")
          PASSED=$(echo "$OUTPUT" | grep -oP '\d+ passed' | grep -oP '\d+' || echo "0")
          FAILED=$(echo "$OUTPUT" | grep -oP '\d+ failed' | grep -oP '\d+' || echo "0")
          SKIPPED=$(echo "$OUTPUT" | grep -oP '\d+ skipped' | grep -oP '\d+' || echo "0")
          TOTAL=$((PASSED + FAILED))
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          # Treat "no tests ran" as a failure. A global-setup error or a wrong
          # URL makes Playwright exit having run 0 tests (0 passed / 0 failed);
          # without this guard that silently reported as a green "passed".
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No tests executed (0 passed, 0 failed) for ${{ matrix.url }} — Playwright likely errored before running tests (check the run log)."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: admin-login-report-${{ matrix.environment }}-${{ steps.env_config.outputs.url_slug }}
          path: openresty-admin/playwright-report/
          retention-days: 14

      - name: Upload traces & screenshots
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: admin-login-traces-${{ matrix.environment }}-${{ steps.env_config.outputs.url_slug }}
          path: openresty-admin/test-results/
          retention-days: 7

      - name: Slack notification - Login Tests Passed
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          curl -sf -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg env "${{ matrix.environment }}" \
              --arg passed "${{ steps.results.outputs.passed }}" \
              --arg total "${{ steps.results.outputs.total }}" \
              --arg skipped "${{ steps.results.outputs.skipped }}" \
              --arg url "${{ matrix.url }}" \
              --arg branch "${{ github.ref_name }}" \
              --arg commit "${{ github.sha }}" \
              --arg event "${{ github.event_name }}" \
              --arg actor "${{ github.actor }}" \
              '{channel: "github-updates", username: "GitHub Actions", text: (":white_check_mark: *WSL Proxy — Admin UI login is working*\nThe automated login tests just ran against the *\($env)* environment and everything passed, so admins can sign in normally.\n\n*What we checked:* \($passed) of \($total) login tests passed (\($skipped) skipped)\n*Where:* \($url)\n*From code:* branch `\($branch)` at commit `\($commit)`\n*Started by:* \($event) (\($actor))")}')"

      - name: Slack notification - Login Tests Failed
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          curl -sf -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg env "${{ matrix.environment }}" \
              --arg failed "${{ steps.results.outputs.failed }}" \
              --arg passed "${{ steps.results.outputs.passed }}" \
              --arg total "${{ steps.results.outputs.total }}" \
              --arg skipped "${{ steps.results.outputs.skipped }}" \
              --arg url "${{ matrix.url }}" \
              --arg branch "${{ github.ref_name }}" \
              --arg commit "${{ github.sha }}" \
              --arg event "${{ github.event_name }}" \
              --arg actor "${{ github.actor }}" \
              --arg logs "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{channel: "github-updates", username: "GitHub Actions", text: (":x: *WSL Proxy — Admin UI login may be broken*\nThe automated login tests just ran against the *\($env)* environment and some of them failed, so admins might not be able to sign in. Please take a look.\n\n*What we found:* \($failed) failed and \($passed) passed out of \($total) login tests (\($skipped) skipped)\n*Where:* \($url)\n*From code:* branch `\($branch)` at commit `\($commit)`\n*Started by:* \($event) (\($actor))\n*To debug:* screenshots and traces are attached to the workflow artifacts\n*Full logs:* \($logs)")}')"
