name: Build and Publish WSLProxy Ingress Controller

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    tags:
      - 'ingress-v*.*.*'
    paths:
      - 'ingress-controller/**'
      - '.github/workflows/build-publish-ingress.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'ingress-controller/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'dev'
      push_images:
        description: 'Push images to Docker Hub'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  CONTROLLER_IMAGE: bwalia/wslproxy-ingress-controller
  OPENRESTY_IMAGE: bwalia/wslproxy-openresty-ingress
  GO_VERSION: '1.21'
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # Job 1: Test Go code
  test:
    name: Test Go Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ingress-controller
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ingress-controller/go.sum

      - name: Download dependencies
        run: go mod download && go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./ingress-controller/coverage.out
          flags: unittests
          name: codecov-ingress-controller

      - name: Generate coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ingress-controller/coverage.html

  # Job 2: Lint Go code
  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ingress-controller
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ingress-controller/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: ingress-controller
          args: --timeout=5m --verbose

  # Job 3: Build Go binary
  build-binary:
    name: Build Go Binary
    runs-on: ubuntu-latest
    needs: [test, lint]
    strategy:
      matrix:
        os: [linux]
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ingress-controller/go.sum

      - name: Extract version info
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/ingress-}
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Build binary
        working-directory: ./ingress-controller
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-w -s \
              -X main.Version=${{ steps.version.outputs.version }} \
              -X main.Commit=${{ steps.version.outputs.commit }} \
              -X main.BuildDate=${{ steps.version.outputs.build_date }}" \
            -o bin/controller-${{ matrix.os }}-${{ matrix.arch }} \
            ./cmd/controller/main.go

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: ingress-controller/bin/controller-${{ matrix.os }}-${{ matrix.arch }}

  # Job 4: Build and push Controller Docker image
  build-push-controller:
    name: Build & Push Controller Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWD }}

      - name: Extract version info
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/ingress-}
          elif [[ "${{ github.event.inputs.tag }}" != "" ]]; then
            VERSION=${{ github.event.inputs.tag }}
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CONTROLLER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=ingress-v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/ingress-v') }}
            type=match,pattern=ingress-v(\d+\.\d+),group=1,enable=${{ startsWith(github.ref, 'refs/tags/ingress-v') }}
            type=match,pattern=ingress-v(\d+),group=1,enable=${{ startsWith(github.ref, 'refs/tags/ingress-v') }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=WSLProxy Ingress Controller
            org.opencontainers.image.description=Kubernetes Ingress Controller with zero-downtime updates
            org.opencontainers.image.vendor=WSLProxy
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ingress-controller
          file: ./ingress-controller/Dockerfile.controller
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}

      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'sarif'
          output: 'trivy-controller-results.sarif'

      - name: Upload Trivy results to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-controller-results.sarif'

  # Job 5: Build and push OpenResty Docker image
  build-push-openresty:
    name: Build & Push OpenResty Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWD }}

      - name: Extract version info
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/ingress-}
          elif [[ "${{ github.event.inputs.tag }}" != "" ]]; then
            VERSION=${{ github.event.inputs.tag }}
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.OPENRESTY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=ingress-v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/ingress-v') }}
            type=match,pattern=ingress-v(\d+\.\d+),group=1,enable=${{ startsWith(github.ref, 'refs/tags/ingress-v') }}
            type=match,pattern=ingress-v(\d+),group=1,enable=${{ startsWith(github.ref, 'refs/tags/ingress-v') }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=WSLProxy OpenResty Ingress
            org.opencontainers.image.description=OpenResty with dynamic Lua upstream management
            org.opencontainers.image.vendor=WSLProxy
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ingress-controller
          file: ./ingress-controller/Dockerfile.openresty
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openresty
          cache-to: type=gha,mode=max,scope=openresty

      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'sarif'
          output: 'trivy-openresty-results.sarif'

      - name: Upload Trivy results to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-openresty-results.sarif'

  # Job 6: Update Docker Hub README
  update-dockerhub-readme:
    name: Update Docker Hub README
    runs-on: ubuntu-latest
    needs: [build-push-controller, build-push-openresty]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Controller README
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWD }}
          repository: ${{ env.CONTROLLER_IMAGE }}
          readme-filepath: ./ingress-controller/README.md
          short-description: "Kubernetes Ingress Controller with zero-downtime updates built on OpenResty"

      - name: Update OpenResty README
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWD }}
          repository: ${{ env.OPENRESTY_IMAGE }}
          readme-filepath: ./ingress-controller/README.md
          short-description: "OpenResty with dynamic Lua upstream management for WSLProxy Ingress"

  # Job 7: Helm chart validation and packaging
  helm-package:
    name: Helm Chart Validation & Packaging
    runs-on: ubuntu-latest
    needs: [build-push-controller, build-push-openresty]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      - name: Lint Helm chart
        run: |
          helm lint ingress-controller/deploy/helm/

      - name: Template Helm chart
        run: |
          helm template wslproxy ingress-controller/deploy/helm/ \
            --namespace wslproxy-system \
            --set controller.image.tag=dev \
            --set openresty.image.tag=dev

      - name: Package Helm chart
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          helm package ingress-controller/deploy/helm/ -d dist/

      - name: Upload Helm chart
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz

  # Job 8: Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-push-controller, build-push-openresty, helm-package, build-binary]
    if: startsWith(github.ref, 'refs/tags/ingress-v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/ingress-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release Notes
        run: |
          cat > release-notes.md <<EOF
          # WSLProxy Ingress Controller ${{ steps.version.outputs.version }}

          ## Docker Images

          - **Controller**: \`${{ env.CONTROLLER_IMAGE }}:${{ steps.version.outputs.version }}\`
          - **OpenResty**: \`${{ env.OPENRESTY_IMAGE }}:${{ steps.version.outputs.version }}\`

          ## Installation

          \`\`\`bash
          # Using Helm
          helm install wslproxy oci://registry-1.docker.io/${{ env.CONTROLLER_IMAGE }}/charts/wslproxy \\
            --version ${{ steps.version.outputs.version }} \\
            --namespace wslproxy-system \\
            --create-namespace

          # Or download the chart
          wget https://github.com/${{ github.repository }}/releases/download/ingress-${{ steps.version.outputs.version }}/wslproxy-ingress-controller-*.tgz
          helm install wslproxy ./wslproxy-ingress-controller-*.tgz \\
            --namespace wslproxy-system \\
            --create-namespace
          \`\`\`

          ## Quick Start

          \`\`\`bash
          # Create a backend
          kubectl apply -f - <<EOF
          apiVersion: wslproxy.io/v1alpha1
          kind: WSLProxyBackend
          metadata:
            name: my-backend
          spec:
            upstreams:
              - host: my-service.default.svc.cluster.local
                port: 8080
            loadBalancing: round-robin
          EOF
          \`\`\`

          ## What's Changed

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/ingress-controller/CHANGELOG.md) for details.

          ## Platform Support

          - Linux AMD64
          - Linux ARM64

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/ingress-v0.0.0...ingress-${{ steps.version.outputs.version }}
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: WSLProxy Ingress Controller ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            helm-chart/*.tgz
            binaries/controller-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 9: Test installation (optional, runs on tags)
  test-installation:
    name: Test Installation in kind
    runs-on: ubuntu-latest
    needs: [build-push-controller, build-push-openresty]
    if: startsWith(github.ref, 'refs/tags/ingress-v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kind
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: wslproxy-test
          wait: 5m

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/ingress-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install CRDs
        run: |
          kubectl apply -f ingress-controller/deploy/crds/

      - name: Install with Helm
        run: |
          helm install wslproxy ingress-controller/deploy/helm/ \
            --namespace wslproxy-system \
            --create-namespace \
            --set controller.image.tag=${{ steps.version.outputs.version }} \
            --set openresty.image.tag=${{ steps.version.outputs.version }} \
            --wait \
            --timeout 5m

      - name: Wait for pods
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=wslproxy \
            -n wslproxy-system \
            --timeout=300s

      - name: Check deployment
        run: |
          kubectl get pods -n wslproxy-system
          kubectl get svc -n wslproxy-system
          kubectl get wslproxybackend -A || echo "No backends yet (expected)"

      - name: Test basic functionality
        run: |
          # Deploy test backend
          kubectl apply -f ingress-controller/docs/examples/basic-backend.yaml || true

          # Check if backend was created
          kubectl get wslproxybackend -A

      - name: Collect logs on failure
        if: failure()
        run: |
          kubectl logs -n wslproxy-system -l app.kubernetes.io/component=controller --tail=100
          kubectl logs -n wslproxy-system -l app.kubernetes.io/component=proxy --tail=100
          kubectl get events -n wslproxy-system --sort-by='.lastTimestamp'

  # Job 10: Notify on completion
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build-push-controller, build-push-openresty, helm-package]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Controller Image**: ${{ env.CONTROLLER_IMAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **OpenResty Image**: ${{ env.OPENRESTY_IMAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch/Tag**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Test: ${{ needs.build-push-controller.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Controller Build: ${{ needs.build-push-controller.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- OpenResty Build: ${{ needs.build-push-openresty.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Helm Package: ${{ needs.helm-package.result }}" >> $GITHUB_STEP_SUMMARY
