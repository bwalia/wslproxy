name: Ansible compile from source and install Openresty
# Auto-deploys to 185.237.99.238 on push to main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      TARGET_ENV:
        type: choice
        description: "Please choose the Target environment"
        default: "prod"
        required: true
        options:
          - prod
          - int
          - test
          - acc

      TARGET_HOST:
        type: choice
        description: "Please choose the Target host"
        default: "185.237.99.238"
        required: true
        options:
          - 185.237.99.238
          - whisky03
          # - whisky10
          # - whisky08

# Auto-map TARGET_ENV from TARGET_HOST if not set, and ensure consistency
env:
  TARGET_HOST: ${{ github.event.inputs.TARGET_HOST || '185.237.99.238' }}
  # Map host to env (add more as needed)
  TARGET_ENV: ${{ github.event.inputs.TARGET_ENV || (github.event.inputs.TARGET_HOST == '185.237.99.238' && 'prod' || github.event.inputs.TARGET_HOST == 'whisky03' && 'int' || 'int') }}
  API_DOMAINNAME_ENDPOINT: ${{ github.event.inputs.TARGET_ENV || (github.event.inputs.TARGET_HOST == '185.237.99.238' && 'prod' || github.event.inputs.TARGET_HOST == 'whisky03' && 'int' || 'int') }}.wslproxy.com

jobs:
  build:
    runs-on: [self-hosted]

    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v3
      - name: Install Ansible on Ubuntu Latest
        run: |
          sudo apt-get install -y ansible
          export ANSIBLE_HOST_KEY_CHECKING=False

      - name: Decode settings_brahmstra.json file
        run: |
          echo "${{ secrets.SETTINGS_BRAHMSTRA_INT }}" | base64 -d > /tmp/settings_brahmstra_whisky03.json

      - name: Decode env file
        run: |
          echo "${{ secrets.ENV_BRAHMSTRA_INT }}" | base64 -d > /tmp/.env_brahmstra_whisky03
          cat /tmp/.env_brahmstra_whisky03

      - name: Decrypt id_rsa pub key via Ansible Vault file
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          ansible-vault decrypt id_rsa --vault-password-file=<(echo $VAULT_PASSWORD)

      - name: Add SSH Host Key for hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H `cat devops/ansible/hosts | grep ansible_user | awk '{print $1}'`  >> ~/.ssh/known_hosts

      - name: Run Ansible Playbook
        run: |
          echo "Running OpenResty/Nginx playbook for ${{ env.TARGET_HOST }} (env: ${{ env.TARGET_ENV }})"
          sudo ansible-playbook devops/ansible/manage_nginx_openresty_ops.yml -i devops/ansible/hosts -l ${{ env.TARGET_HOST }} --extra-vars "nginx_user_password=THISCOMESFROMSECRETS"
        env:
          ANSIBLE_PRIVATE_KEY_FILE: id_rsa
          ANSIBLE_VAULT_PASSWORD_FILE: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
#          sudo ansible-playbook devops/ansible/manage_nginx_openresty_ops.yml -i devops/ansible/hosts -l TARGET_HOST --vault-password-file <(echo secrets.ANSIBLE_VAULT_PASSWORD)

      - name: Deploy server and rule configs
        run: |
          echo "Deploying configs for environment: ${{ env.TARGET_ENV }} to host: ${{ env.TARGET_HOST }}"
          # Validate host is in correct group for env
          python3 -c "import sys; h='${{ env.TARGET_HOST }}'; e='${{ env.TARGET_ENV }}'; hosts = open('devops/ansible/hosts').read(); group = f'[openresty_{e}]'; found = group in hosts and h in hosts.split(group)[1]; print(f'Host {h} found in group {group}') if found else (print(f'::error::Host {h} not found in group {group}'), sys.exit(1))"
          ansible-playbook devops/ansible/deploy-configs.yml -i devops/ansible/hosts -e "target_env=${{ env.TARGET_ENV }}" -l ${{ env.TARGET_HOST }} -v
        env:
          ANSIBLE_PRIVATE_KEY_FILE: id_rsa

      - name: Workflow Summary
        run: |
          echo "=================================="
          echo "Workflow completed for host: ${{ env.TARGET_HOST }} (env: ${{ env.TARGET_ENV }})"
          echo "=================================="
        env:
          ANSIBLE_PRIVATE_KEY_FILE: id_rsa
