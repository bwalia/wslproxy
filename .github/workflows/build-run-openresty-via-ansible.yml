name: Ansible compile from source and install Openresty
# Auto-deploys to 185.237.99.238 on push to main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      TARGET_ENV:
        type: choice
        description: "Please choose the Target environment"
        default: "prod"
        required: true
        options:
          - prod
          - int
          - test
          - acc

      TARGET_HOST:
        type: choice
        description: "Please choose the Target host"
        default: "185.237.99.238"
        required: true
        options:
          - 185.237.99.238
          - whisky03
          # - whisky10
          # - whisky08

# Auto-map TARGET_ENV from TARGET_HOST if not set, and ensure consistency
env:
  TARGET_HOST: ${{ github.event.inputs.TARGET_HOST || '185.237.99.238' }}
  # Map host to env (add more as needed)
  TARGET_ENV: ${{ github.event.inputs.TARGET_ENV || (github.event.inputs.TARGET_HOST == '185.237.99.238' && 'prod' || github.event.inputs.TARGET_HOST == 'whisky03' && 'int' || 'prod') }}
  API_DOMAINNAME_ENDPOINT: ${{ github.event.inputs.TARGET_ENV || (github.event.inputs.TARGET_HOST == '185.237.99.238' && 'prod' || github.event.inputs.TARGET_HOST == 'whisky03' && 'int' || 'prod') }}.wslproxy.com

jobs:
  build:
    runs-on: [self-hosted]

    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v3
      - name: Install Ansible on Ubuntu Latest
        run: |
          sudo apt-get install -y ansible
          export ANSIBLE_HOST_KEY_CHECKING=False

      - name: Decode settings_brahmstra.json file
        run: |
          echo "${{ secrets.SETTINGS_BRAHMSTRA_INT }}" | base64 -d > /tmp/settings_brahmstra_whisky03.json

      - name: Decode env file
        run: |
          echo "${{ secrets.ENV_BRAHMSTRA_INT }}" | base64 -d > /tmp/.env_brahmstra_whisky03
          cat /tmp/.env_brahmstra_whisky03

      - name: Decrypt id_rsa private key via Ansible Vault
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          echo "Decrypting SSH private key..."
          if [[ -z "$VAULT_PASSWORD" ]]; then
            echo "::error::ANSIBLE_VAULT_PASSWORD secret is not set!"
            exit 1
          fi
          
          if ! ansible-vault decrypt id_rsa --vault-password-file=<(echo "$VAULT_PASSWORD"); then
            echo "::error::Failed to decrypt id_rsa - check ANSIBLE_VAULT_PASSWORD secret"
            exit 1
          fi
          
          # Validate the decrypted key
          if ! head -1 id_rsa | grep -q "BEGIN"; then
            echo "::error::Decrypted id_rsa does not appear to be a valid SSH key"
            echo "First line of file: $(head -1 id_rsa)"
            exit 1
          fi
          
          chmod 600 id_rsa
          echo "✅ SSH key decrypted and validated successfully"

      - name: Setup SSH and test connectivity
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Add host keys to known_hosts
          echo "Adding SSH host keys..."
          ssh-keyscan -H ${{ env.TARGET_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Test SSH connectivity
          echo "Testing SSH connection to ${{ env.TARGET_HOST }}..."
          if ssh -i id_rsa -o BatchMode=yes -o ConnectTimeout=10 root@${{ env.TARGET_HOST }} "echo 'SSH connection successful'" 2>&1; then
            echo "✅ SSH connection test passed"
          else
            echo "::error::SSH connection test failed to root@${{ env.TARGET_HOST }}"
            echo "Possible causes:"
            echo "  1. The public key is not in /root/.ssh/authorized_keys on the target server"
            echo "  2. The ANSIBLE_VAULT_PASSWORD is incorrect"
            echo "  3. The server is not reachable or SSH is not running"
            exit 1
          fi

      - name: Run Ansible Playbook
        run: |
          echo "Running OpenResty/Nginx playbook for ${{ env.TARGET_HOST }} (env: ${{ env.TARGET_ENV }})"
          sudo ansible-playbook devops/ansible/manage_nginx_openresty_ops.yml -i devops/ansible/hosts -l ${{ env.TARGET_HOST }} --extra-vars "nginx_user_password=THISCOMESFROMSECRETS"
        env:
          ANSIBLE_PRIVATE_KEY_FILE: id_rsa
          ANSIBLE_VAULT_PASSWORD_FILE: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Workflow Summary
        run: |
          echo "=================================="
          echo "OpenResty installation completed for host: ${{ env.TARGET_HOST }} (env: ${{ env.TARGET_ENV }})"
          echo "=================================="
          echo ""
          echo "To deploy configs, run the 'Deploy Server Configs and Rules' workflow separately."
        env:
          ANSIBLE_PRIVATE_KEY_FILE: id_rsa
