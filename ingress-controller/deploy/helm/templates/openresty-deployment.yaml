apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wslproxy.fullname" . }}-openresty
  labels:
    {{- include "wslproxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.openresty.replicas }}
  selector:
    matchLabels:
      {{- include "wslproxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/openresty-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "wslproxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        # OpenResty needs to start as root to bind to ports 80/443 and chown temp dirs.
        # The master process drops to nobody (65534) after initialization.
        seccompProfile:
          type: RuntimeDefault
      {{- if not .Values.certManager.enabled }}
      initContainers:
      - name: generate-default-cert
        image: "{{ .Values.openresty.image.repository }}:{{ .Values.openresty.image.tag }}"
        command:
        - /bin/sh
        - -c
        - |
          if [ ! -f /etc/nginx/ssl/default.crt ]; then
            openssl req -x509 -newkey rsa:2048 -keyout /etc/nginx/ssl/default.key \
              -out /etc/nginx/ssl/default.crt -days 3650 -nodes \
              -subj "/CN=wslproxy-ingress-default/O=WSLProxy"
            echo "Generated default self-signed certificate"
          fi
        volumeMounts:
        - name: default-tls
          mountPath: /etc/nginx/ssl
        securityContext:
          runAsUser: 0
      {{- end }}
      containers:
      - name: openresty
        image: "{{ .Values.openresty.image.repository }}:{{ .Values.openresty.image.tag }}"
        imagePullPolicy: {{ .Values.openresty.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: https
          containerPort: 443
          protocol: TCP
        - name: api
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml .Values.openresty.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.openresty.securityContext | nindent 10 }}
        volumeMounts:
        {{- if not .Values.openresty.useBuiltinConfig }}
        - name: nginx-config
          mountPath: /usr/local/openresty/nginx/conf/nginx.conf
          subPath: nginx.conf
          readOnly: true
        # Mount Lua scripts into correct subdirectories using subPath
        - name: lua-scripts
          mountPath: /usr/local/openresty/nginx/lua/upstream/dynamic_upstream.lua
          subPath: dynamic_upstream.lua
          readOnly: true
        - name: lua-scripts
          mountPath: /usr/local/openresty/nginx/lua/upstream/route_lookup.lua
          subPath: route_lookup.lua
          readOnly: true
        - name: lua-scripts
          mountPath: /usr/local/openresty/nginx/lua/api/update_backend.lua
          subPath: update_backend.lua
          readOnly: true
        - name: lua-scripts
          mountPath: /usr/local/openresty/nginx/lua/api/delete_backend.lua
          subPath: delete_backend.lua
          readOnly: true
        - name: lua-scripts
          mountPath: /usr/local/openresty/nginx/lua/api/get_backend.lua
          subPath: get_backend.lua
          readOnly: true
        - name: lua-scripts
          mountPath: /usr/local/openresty/nginx/lua/api/list_backends.lua
          subPath: list_backends.lua
          readOnly: true
        - name: lua-scripts
          mountPath: /usr/local/openresty/nginx/lua/api/update_route.lua
          subPath: update_route.lua
          readOnly: true
        - name: lua-scripts
          mountPath: /usr/local/openresty/nginx/lua/api/delete_route.lua
          subPath: delete_route.lua
          readOnly: true
        - name: lua-scripts
          mountPath: /usr/local/openresty/nginx/lua/api/list_routes.lua
          subPath: list_routes.lua
          readOnly: true
        - name: lua-scripts
          mountPath: /usr/local/openresty/nginx/lua/metrics/prometheus.lua
          subPath: prometheus.lua
          readOnly: true
        {{- end }}
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run/nginx
        - name: nginx-temp
          mountPath: /usr/local/openresty/nginx/client_body_temp
        - name: nginx-proxy-temp
          mountPath: /usr/local/openresty/nginx/proxy_temp
        - name: nginx-fastcgi-temp
          mountPath: /usr/local/openresty/nginx/fastcgi_temp
        - name: nginx-uwsgi-temp
          mountPath: /usr/local/openresty/nginx/uwsgi_temp
        - name: nginx-scgi-temp
          mountPath: /usr/local/openresty/nginx/scgi_temp
        {{- if not .Values.certManager.enabled }}
        - name: default-tls
          mountPath: /etc/nginx/ssl
          readOnly: true
        {{- end }}
      volumes:
      {{- if not .Values.openresty.useBuiltinConfig }}
      - name: nginx-config
        configMap:
          name: {{ include "wslproxy.fullname" . }}-openresty-config
      - name: lua-scripts
        configMap:
          name: {{ include "wslproxy.fullname" . }}-lua-scripts
      {{- end }}
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}
      - name: nginx-temp
        emptyDir: {}
      - name: nginx-proxy-temp
        emptyDir: {}
      - name: nginx-fastcgi-temp
        emptyDir: {}
      - name: nginx-uwsgi-temp
        emptyDir: {}
      - name: nginx-scgi-temp
        emptyDir: {}
      {{- if not .Values.certManager.enabled }}
      - name: default-tls
        emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
