{{- if not .Values.certManager.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wslproxy.fullname" . }}-default-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslproxy.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  # Self-signed certificate for local development
  tls.crt: 
  tls.key: 
{{- end }}
