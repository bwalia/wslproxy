# WSLProxy Ingress Controller - nginx.conf
# OpenResty configuration with Lua dynamic upstream management

user nobody nobody;
worker_processes auto;
error_log /dev/stderr info;
pid /var/run/nginx/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;
    underscores_in_headers on;

    # Kubernetes DNS Resolver
    resolver 10.96.0.10 valid=30s;

    # Logging
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log /dev/stdout json;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10g;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    # Shared dictionaries for Lua
    lua_shared_dict upstreams 10m;
    lua_shared_dict upstream_health 10m;
    lua_shared_dict routes 5m;
    lua_shared_dict rate_limit 10m;
    lua_shared_dict cache 50m;
    lua_shared_dict prometheus_metrics 5m;

    # Lua package path
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;/usr/local/openresty/lualib/?.lua;;";

    # Initialize Lua modules
    init_by_lua_block {
        -- Load dynamic upstream manager
        dynamic_upstream = require("upstream.dynamic_upstream")

        -- Initialize metrics
        prometheus = require("metrics.prometheus")
        metric_requests = prometheus:counter(
            "wslproxy_requests_total",
            "Total number of HTTP requests",
            {"method", "status", "backend"}
        )
        metric_latency = prometheus:histogram(
            "wslproxy_request_duration_seconds",
            "HTTP request latency",
            {"backend"}
        )

        -- Route lookup helper (used in access_by_lua)
        route_lookup = require("upstream.route_lookup")

        ngx.log(ngx.INFO, "WSLProxy Ingress Controller initialized")
    }

    # Start health check timer
    init_worker_by_lua_block {
        if ngx.worker.id() == 0 then
            dynamic_upstream.start_health_checks()
            ngx.log(ngx.INFO, "Health check timer started on worker 0")
        end
    }

    # Upstream placeholder (will be dynamically managed)
    upstream dynamic_backend {
        server 0.0.0.1:1 down;  # Placeholder, managed by Lua
        balancer_by_lua_block {
            dynamic_upstream.balance()
        }
    }

    # Internal API server (for controller communication)
    server {
        listen 8080;
        server_name _;

        # Health check endpoint
        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Readiness check
        location /readyz {
            access_log off;
            content_by_lua_block {
                local upstreams_dict = ngx.shared.upstreams
                local keys = upstreams_dict:get_keys(1)
                if #keys > 0 then
                    ngx.say("ready")
                    ngx.exit(200)
                else
                    ngx.say("not ready - no backends configured")
                    ngx.exit(503)
                end
            }
        }

        # Prometheus metrics endpoint
        location /metrics {
            access_log off;
            content_by_lua_block {
                prometheus:collect()
            }
        }

        # Internal API for backend management
        location ~ ^/api/internal/backends/([a-zA-Z0-9-_]+)$ {
            set $backend_name $1;

            # POST - Update backend
            if ($request_method = POST) {
                content_by_lua_file /usr/local/openresty/nginx/lua/api/update_backend.lua;
            }

            # DELETE - Remove backend
            if ($request_method = DELETE) {
                content_by_lua_file /usr/local/openresty/nginx/lua/api/delete_backend.lua;
            }

            # GET - Get backend status
            if ($request_method = GET) {
                content_by_lua_file /usr/local/openresty/nginx/lua/api/get_backend.lua;
            }
        }

        # List all backends
        location = /api/internal/backends {
            if ($request_method = GET) {
                content_by_lua_file /usr/local/openresty/nginx/lua/api/list_backends.lua;
            }
        }

        # Internal API for route management
        location ~ ^/api/internal/routes/(.+)$ {
            set $route_host $1;

            if ($request_method = POST) {
                content_by_lua_file /usr/local/openresty/nginx/lua/api/update_route.lua;
            }

            if ($request_method = DELETE) {
                content_by_lua_file /usr/local/openresty/nginx/lua/api/delete_route.lua;
            }
        }

        # List all routes
        location = /api/internal/routes {
            if ($request_method = GET) {
                content_by_lua_file /usr/local/openresty/nginx/lua/api/list_routes.lua;
            }
        }
    }

    # Main proxy server (HTTP)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Variables for dynamic routing
        set $backend_name '';

        location / {
            # Lua route lookup: resolve Host + URI -> backend_name
            access_by_lua_block {
                local backend = route_lookup.resolve(ngx.var.host, ngx.var.uri)
                if not backend then
                    ngx.log(ngx.WARN, "No route for host=", ngx.var.host, " uri=", ngx.var.uri)
                    return ngx.exit(404)
                end
                ngx.var.backend_name = backend
            }

            proxy_pass http://dynamic_backend;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Proxy timeouts (5 minutes to support long-running API calls)
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Record metrics
            log_by_lua_block {
                if metric_requests then
                    metric_requests:inc(1, {ngx.var.request_method, tostring(ngx.var.status), ngx.var.backend_name or "unknown"})
                end
                if metric_latency then
                    metric_latency:observe(tonumber(ngx.var.request_time) or 0, {ngx.var.backend_name or "unknown"})
                end
            }
        }

        # Default error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/local/openresty/nginx/html;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        # Default self-signed certificate (generated by init container)
        ssl_certificate /etc/nginx/ssl/default.crt;
        ssl_certificate_key /etc/nginx/ssl/default.key;

        # TLS configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 10g;
        proxy_request_buffering off;

        # Variables for dynamic routing
        set $backend_name '';

        location / {
            access_by_lua_block {
                local backend = route_lookup.resolve(ngx.var.host, ngx.var.uri)
                if not backend then
                    ngx.log(ngx.WARN, "No route for host=", ngx.var.host, " uri=", ngx.var.uri)
                    return ngx.exit(404)
                end
                ngx.var.backend_name = backend
            }

            proxy_pass http://dynamic_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Proxy timeouts (5 minutes to support long-running API calls)
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            log_by_lua_block {
                if metric_requests then
                    metric_requests:inc(1, {ngx.var.request_method, tostring(ngx.var.status), ngx.var.backend_name or "unknown"})
                end
                if metric_latency then
                    metric_latency:observe(tonumber(ngx.var.request_time) or 0, {ngx.var.backend_name or "unknown"})
                end
            }
        }
    }

    # Include dynamic server blocks (managed by controller)
    include /etc/nginx/conf.d/*.conf;
}
