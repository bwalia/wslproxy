# WSLProxy Ingress Controller - nginx.conf
# OpenResty configuration with Lua dynamic upstream management

user nobody nobody;
worker_processes auto;
error_log /dev/stderr info;
pid /var/run/nginx/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Logging
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log /dev/stdout json;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    # WebSocket support: map Upgrade header to Connection header value
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Shared dictionaries for Lua
    lua_shared_dict upstreams 10m;
    lua_shared_dict upstream_health 10m;
    lua_shared_dict rate_limit 10m;
    lua_shared_dict cache 50m;
    lua_shared_dict prometheus_metrics 5m;

    # Lua package path
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;/usr/local/openresty/lualib/?.lua;;";

    # Initialize Lua modules
    init_by_lua_block {
        -- Load dynamic upstream manager
        dynamic_upstream = require("upstream.dynamic_upstream")

        -- Initialize metrics
        prometheus = require("metrics.prometheus")
        metric_requests = prometheus:counter(
            "wslproxy_requests_total",
            "Total number of HTTP requests",
            {"method", "status", "backend"}
        )
        metric_latency = prometheus:histogram(
            "wslproxy_request_duration_seconds",
            "HTTP request latency",
            {"backend"}
        )

        ngx.log(ngx.INFO, "WSLProxy Ingress Controller initialized")
    }

    # Start health check timer
    init_worker_by_lua_block {
        if ngx.worker.id() == 0 then
            dynamic_upstream.start_health_checks()
            ngx.log(ngx.INFO, "Health check timer started on worker 0")
        end
    }

    # Upstream placeholder (will be dynamically managed)
    upstream dynamic_backend {
        server 0.0.0.1:1 down;  # Placeholder, managed by Lua
        balancer_by_lua_block {
            dynamic_upstream.balance()
        }
    }

    # Internal API server (for controller communication)
    server {
        listen 8080;
        server_name _;

        # Health check endpoint
        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Readiness check
        location /readyz {
            access_log off;
            content_by_lua_block {
                local upstreams_dict = ngx.shared.upstreams
                local keys = upstreams_dict:get_keys(1)
                if #keys > 0 then
                    ngx.say("ready")
                    ngx.exit(200)
                else
                    ngx.say("not ready - no backends configured")
                    ngx.exit(503)
                end
            }
        }

        # Prometheus metrics endpoint
        location /metrics {
            access_log off;
            content_by_lua_block {
                prometheus:collect()
            }
        }

        # Internal API for backend management
        location ~ ^/api/internal/backends/([a-zA-Z0-9-_]+)$ {
            set $backend_name $1;

            # POST - Update backend
            if ($request_method = POST) {
                content_by_lua_file /usr/local/openresty/nginx/lua/api/update_backend.lua;
            }

            # DELETE - Remove backend
            if ($request_method = DELETE) {
                content_by_lua_file /usr/local/openresty/nginx/lua/api/delete_backend.lua;
            }

            # GET - Get backend status
            if ($request_method = GET) {
                content_by_lua_file /usr/local/openresty/nginx/lua/api/get_backend.lua;
            }
        }

        # List all backends
        location = /api/internal/backends {
            if ($request_method = GET) {
                content_by_lua_file /usr/local/openresty/nginx/lua/api/list_backends.lua;
            }
        }
    }

    # Main proxy server
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Set backend name from request (will be set by routing logic)
        set $backend_name '';

        location / {
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # This will be populated by the route controller
            # For now, return 503
            return 503 "No route configured\n";
        }

        # Default error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/local/openresty/nginx/html;
        }
    }

    # HTTPS server (requires TLS configuration from controller)
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        # Default self-signed certificate (will be replaced by cert-manager)
        ssl_certificate /etc/nginx/ssl/default.crt;
        ssl_certificate_key /etc/nginx/ssl/default.key;

        # TLS configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            return 503 "No route configured\n";
        }
    }

    # Include dynamic server blocks (managed by controller)
    include /etc/nginx/conf.d/*.conf;
}
