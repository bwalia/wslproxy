# Old React-Admin (Vite) Dashboard
# Runs alongside the new Next.js stack on different ports
#
# Start: JWT_SECRET_KEY=test123 docker compose -f docker-compose-old.yml up -d --build
# Stop:  JWT_SECRET_KEY=test123 docker compose -f docker-compose-old.yml down
#
# Old GUI: http://localhost:8380
# New GUI: http://localhost:8280 (docker-compose-local.yml)

services:
  wslproxy-old:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: dev
        DNS_RESOLVER: 127.0.0.11
    container_name: wslproxy-old
    restart: unless-stopped

    ports:
      - "8190:80"
      - "8493:443"
      - "8380:8080"

    volumes:
      - ./api:/usr/local/openresty/nginx/html/api
      - ./html:/usr/local/openresty/nginx/html
      - ./openresty-admin/src:/usr/local/openresty/nginx/html/openresty-admin/src
      - ./openresty-admin/public:/usr/local/openresty/nginx/html/openresty-admin/public
      - ./openresty-admin/package.json:/usr/local/openresty/nginx/html/openresty-admin/package.json
      - ./openresty-admin/vite.config.js:/usr/local/openresty/nginx/html/openresty-admin/vite.config.js
      - ./openresty-admin/.env:/usr/local/openresty/nginx/html/openresty-admin/.env
      - ./openresty-admin/yarn.lock:/usr/local/openresty/nginx/html/openresty-admin/yarn.lock
      - ./openresty-admin/index.html:/usr/local/openresty/nginx/html/openresty-admin/index.html
      - admin-dist-old:/usr/local/openresty/nginx/html/openresty-admin/dist
      - ./data:/opt/nginx/data
      # Override nginx config to serve old Vite dashboard (not Next.js proxy)
      - ./nginx-dev-old.conf.tmpl:/usr/local/openresty/nginx/conf/nginx.conf
      - wslproxy-certs-old:/etc/resty-auto-ssl
      - ./html/swagger:/usr/local/openresty/nginx/html/swagger

    environment:
      NGINX_CONFIG_DIR: /opt/nginx/
      REDIS_HOST: redis-old
      REDIS_PORT: 6379
      DNS_RESOLVER: 127.0.0.11
      LUA_LOG_LEVEL: debug
      SSL_STAGING: "true"

    depends_on:
      redis-old:
        condition: service_healthy
      demo-node-app-old:
        condition: service_healthy

    networks:
      wslproxy-old-network:
        ipv4_address: 172.199.0.2

    user: root

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis-old:
    image: redis:7-alpine
    container_name: wslproxy-redis-old
    restart: unless-stopped

    ports:
      - "6480:6379"

    volumes:
      - redis-data-old:/data

    command: redis-server --appendonly yes --loglevel debug

    networks:
      wslproxy-old-network:
        ipv4_address: 172.199.0.3

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  demo-node-app-old:
    build:
      context: .
      dockerfile: demos-origins/node-app/Dockerfile
    container_name: demo-node-app-old
    restart: unless-stopped

    ports:
      - "3010:3009"

    volumes:
      - ./demos-origins/node-app/server.js:/app/server.js
      - ./demos-origins/node-app/login.html:/app/login.html
      - ./demos-origins/node-app/success.html:/app/success.html
      - ./demos-origins/node-app/jwt.js:/app/jwt.js
      - ./demos-origins/node-app/verifyToken.js:/app/verifyToken.js

    environment:
      NODE_ENV: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}

    networks:
      wslproxy-old-network:
        ipv4_address: 172.199.0.10

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3009/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  wslproxy-old-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.199.0.0/24
          gateway: 172.199.0.1

volumes:
  wslproxy-certs-old:
  redis-data-old:
  admin-dist-old:
