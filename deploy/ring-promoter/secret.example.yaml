# TEMPLATE ONLY — never apply this file with real values, never commit them.
# CI does not create this Secret; deploy-ring-promoter.yml fails if it is
# missing. Create it once with scripts/ring-promoter-bootstrap.sh, which mints
# the token, creates the database and applies the real Secret.
apiVersion: v1
kind: Secret
metadata:
  name: ring-promoter
  namespace: wslproxy-ring-promoter
type: Opaque
stringData:
  # Bearer token required on every /api request. Also the RP_TOKEN GitHub
  # secret that deploy-control-plane-k3s1.yml seeds with.
  RP_API_TOKEN: "change-me-to-a-long-random-token"
  # Own database on the shared ring-promoter-db (ring-system), like the
  # workstation (ringpromoter_ws) and fictionally (ringpromoter_training)
  # instances.
  RP_DB_DSN: "postgres://ringpromoter_wsl:change-me@ring-promoter-db.ring-system.svc.cluster.local:5432/ringpromoter_wsl?sslmode=require"
  # Optional: extra password for deploying to the last ring (prod). Omit the
  # key to disable. If set, also set the RP_PROD_PASSWORD GitHub secret.
  # RP_PROD_PASSWORD: "change-me-production-password"
