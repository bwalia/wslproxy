  namespace: wslproxy-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik-edge
  rules:
    - host: cp.pop0.uk
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /metrics
            pathType: Prefix
            backend:
