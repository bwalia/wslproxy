# Public CP dashboard on cloud003 via traefik-edge (hostNetwork :80/:443).
# Cloudflare proxies cp.pop0.uk → 77.68.126.63. Traefik 3 only attaches
# routers to websecure when TLS is enabled — hence the split Ingresses.
#
# UI → Next.js dashboard Service (:7619)
# API / health / swagger / mcp / legacy SPA → OpenResty (:8080)
#
# Apply: kubectl apply -f deploy/k3s1/wslproxy-cp-traefik-ingress.yaml
#
# Note: traefik-edge has --providers.kubernetesingress only (no kubernetescrd),
# so Middleware CRDs / @kubernetescrd refs will not work here.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wslproxy-cp-traefik
  namespace: wslproxy-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik-edge
  tls:
    - hosts:
        - cp.pop0.uk
      secretName: wslproxy-ingress-default-tls
  rules:
    - host: cp.pop0.uk
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /openresty-admin
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /runtime-config.js
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-openresty
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wslproxy-ingress-dashboard
                port:
                  number: 7619
---
