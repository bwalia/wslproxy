# Zalando Postgres for the WSLProxy system instance on k3s1.
#
# Namespace wslproxy-system hosts the ingress-controller Helm release
# (wslproxy-ingress). This cluster is the admin/config store when
# settings.storage_type = pgsql (disk JSON is still dual-written).
#
# Apply:  kubectl apply -f deploy/postgres/wslproxy-db.yaml
# Watch:  kubectl get postgresql wslproxy-db -n wslproxy-system -w
#
# Service:  wslproxy-db.wslproxy-system.svc.cluster.local:5432
# Database: wslproxy  (owner: wslproxy)
# Secret:   wslproxy.wslproxy-db.credentials.postgresql.acid.zalan.do
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: wslproxy-db
  namespace: wslproxy-system
  labels:
    app.kubernetes.io/part-of: wslproxy
    app.kubernetes.io/component: storage
spec:
  teamId: ops
  numberOfInstances: 1
  postgresql:
    version: "15"
  databases:
    wslproxy: wslproxy
  users:
    wslproxy: []
  # Co-locate with OpenResty control plane on cloud003 (edge CNI cannot reach LAN workers).
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - cloud003
  tolerations:
    - key: node-role.kubernetes.io/edge
      operator: Exists
      effect: NoSchedule
  # Spilo defaults require TLS; OpenResty pgmoon connects without SSL.
  #
  # Remote logins use `md5` only, never a `scram-sha-256` line. The `md5`
  # method still runs SCRAM when the stored hash is SCRAM, so it accepts
  # whichever hash the role has. A `scram-sha-256` line ahead of it rejects an
  # md5 hash outright, and the operator re-stores the wslproxy password as md5
  # when it re-syncs users (password_encryption is md5). That took cp.pop0.uk
  # down for ~40h on 2026-10-27: pgmoon "authentication exchange unsuccessful".
  #
  # This list reaches Postgres through the pod's SPILO_CONFIGURATION, which
  # wins over Patroni's dynamic config, so PATCHing :8008/config does NOT
  # change pg_hba. Re-apply this CR (operator rolls the pod) to change it.
  patroni:
    pg_hba:
      - local all all trust
      - host all all 127.0.0.1/32 trust
      - host all all ::1/128 trust
      - host all all 0.0.0.0/0 md5
  volume:
    size: 5Gi
    # Edge nodes (cloud003) lack Longhorn CSI; local-path keeps PG co-located with OpenResty.
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
