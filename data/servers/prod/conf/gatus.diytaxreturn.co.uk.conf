server {
      listen 80;  # Listen on port (HTTP)
      server_name gatus.diytaxreturn.co.uk;  # Your domain name
      root /var/www/html;  # Document root directory
      index index.html;  # Default index files
      access_log logs/gatus.diytaxreturn.co.uk.access.log;  # Access log file location
      error_log logs/gatus.diytaxreturn.co.uk.error.log;  # Error log file location



  }

  