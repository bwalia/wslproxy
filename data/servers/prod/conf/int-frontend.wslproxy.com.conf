
# HTTP to HTTPS redirect
server {
    listen 80;
    server_name int-frontend.wslproxy.com;

    # ACME Challenge for Let's Encrypt (lua-resty-auto-ssl)
    location /.well-known/acme-challenge/ {
        content_by_lua_block {
            auto_ssl:challenge_server()
        }
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
      listen 80;  # Listen on port (HTTP)
      
      # SSL Configuration (managed by auto_ssl / Let's Encrypt)
      listen 443 ssl http2;

      # Dynamic SSL certificate via auto_ssl
      ssl_certificate_by_lua_block {
          auto_ssl:ssl_certificate()
      }

      # Fallback certificate (required for nginx validation)
      ssl_certificate /etc/ssl/resty-auto-ssl-fallback.crt;
      ssl_certificate_key /etc/ssl/resty-auto-ssl-fallback.key;

      ssl_session_timeout 1d;
      ssl_session_cache shared:SSL:50m;
      ssl_session_tickets off;

      # Modern SSL configuration
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
      ssl_prefer_server_ciphers off;

      # HSTS - Force HTTPS
      add_header Strict-Transport-Security max-age=31536000; includeSubDomains always;
      server_name int-frontend.wslproxy.com;  # Your domain name
      root /var/www/html;  # Document root directory
      index index.html;  # Default index files
      access_log logs/access.log;  # Access log file location
      error_log logs/error.log;  # Error log file location
      
      # ACME Challenge for Let's Encrypt (lua-resty-auto-ssl)
      location /.well-known/acme-challenge/ {
          content_by_lua_block {
              auto_ssl:challenge_server()
          }
      }
      
      
  }
  
  