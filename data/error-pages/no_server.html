<!DOCTYPE html>
<html>
<head>
  <title>No Server Config | WSL Proxy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      background: rgba(255,255,255,0.05);
      border-radius: 24px;
      padding: 3rem;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
    }
    .icon-wrapper {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 10px 40px rgba(99, 102, 241, 0.3);
    }
    .icon-wrapper i { font-size: 2.5rem; color: #fff; }
    h1 { font-size: 1.75rem; color: #fff; margin-bottom: 1rem; font-weight: 700; }
    p { font-size: 1rem; color: rgba(255,255,255,0.7); margin-bottom: 2rem; line-height: 1.6; }
    .error-code {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.75rem;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5); }
    .footer { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); }
    .footer a { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .footer a:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper"><i class="fa fa-server"></i></div>
    <span class="error-code">NO_SERVER_CONFIG</span>
    <h1>No Server Config Found!</h1>
    <p>No Nginx server configuration has been found for this domain. Please contact your WebOps team to configure the server.</p>
    <a href="mailto:admin@example.com" class="btn"><i class="fa fa-envelope"></i> Contact Administrator</a>
    <div class="footer"><a href="/"><i class="fa fa-cube"></i> Powered by WSL Proxy</a></div>
  </div>
</body>
</html>
