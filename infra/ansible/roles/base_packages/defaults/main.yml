---
# Unified OS-family package mapping
# Keys match Ansible's ansible_os_family fact: "Debian", "Suse", "RedHat"

_os_packages:
  Debian:
    common:
      - python3-pip
      - virtualenv
      - python3-setuptools
      - zlib1g
      - zlib1g-dev
      - libssl-dev
      - rsync
      - cron
      - git
      - curl
      - wget
      - unzip
      - zip
      - jq
      - net-tools
      - iputils-ping
      - dnsutils
      - htop
      - tree
      - dmsetup
      - nfs-common
      - open-iscsi
      - ansible
      - default-jre
      - vim
      - make
      - gcc
      - g++
      - python3
      - openssh-server
      - ca-certificates
      - luarocks
      # Rotates openresty/nginx logs so error.log doesn't grow to
      # 1.9 GB and swallow the disk (observed on prod 2026-07-14).
      # /etc/logrotate.d/openresty is templated by the wslproxy
      # role; this just ensures the binary + /etc/cron.daily/logrotate
      # hook are present.
      - logrotate
    distro_specific:
      Ubuntu:
        - software-properties-common
        - libpcre3
        - libpcre3-dev
        - openjdk-21-jdk
        - netcat-traditional
        # npm from the distro repo installs cleanly on Ubuntu, but on
        # Debian 13 (trixie) the packaged npm (9.2.0~ds1-3) is uninstallable
        # (unmet nodejs dependency chain). Node/npm come from NodeSource
        # (deploy_nextjs_admin_ui.yml) / nvm (install-build-npm-yarn.sh.j2)
        # on all distros anyway, so keep the distro npm Ubuntu-only.
        - npm
      Debian:
        - python3-apt
        - libpcre2-dev
        # default-jdk resolves to the distro's supported JDK (17 on bookworm,
        # 21 on trixie); openjdk-21-jdk isn't packaged on Debian 12.
        - default-jdk
        - netcat-openbsd

  Suse:
    common:
      - python3-pip
      - python3-setuptools
      - libz1
      - zlib-devel
      - libopenssl-devel
      - rsync
      - cron
      - git
      - curl
      - wget
      - unzip
      - zip
      - jq
      - net-tools
      - iputils
      - bind-utils
      - htop
      - tree
      - device-mapper
      - nfs-client
      - open-iscsi
      - ansible
      - vim
      - make
      - gcc
      - gcc-c++
      - python3
      - npm20
      - openssh
      - ca-certificates
      - pcre-devel
      - logrotate
    distro_specific: {}

  RedHat:
    common:
      - epel-release
      - python3-pip
      - python3-setuptools
      - zlib
      - zlib-devel
      - openssl-devel
      - rsync
      - cronie
      - git
      - curl
      - wget
      - unzip
      - zip
      - jq
      - net-tools
      - iputils
      - bind-utils
      - htop
      - tree
      - device-mapper
      - nfs-utils
      - iscsi-initiator-utils
      - vim
      - make
      - gcc
      - gcc-c++
      - python3
      - npm
      - openssh-server
      - ca-certificates
      - pcre-devel
      - luarocks
      - logrotate
    distro_specific: {}
