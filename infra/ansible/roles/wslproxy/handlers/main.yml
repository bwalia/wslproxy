- name: Restart openresty
  service:
   name: openresty
   state: restarted
  # Must carry every tag used by a task that notifies it (finalize.yml /
  # nginx_config.yml notify on nginx/servers/code/dashboard changes), or a
  # tagged run (e.g. --tags servers) filters the handler out and the reload
  # silently never happens.
  tags: [ luarocks, openresty, nginx, servers, code, dashboard, dashboard-next ]

- name: Reload systemd
  systemd:
    daemon_reload: yes
  tags: [ luarocks, openresty ]

- name: restart nextjs dashboard
  systemd:
    name: wslproxy-nextjs-dashboard
    state: restarted
    daemon_reload: yes
  tags: [ dashboard-next ]
