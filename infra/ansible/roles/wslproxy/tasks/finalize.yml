---
# Final deployment steps: nginx.conf, permissions, SSL, tenants, service start, verification

- name: Template nginx.conf
  template:
    src: nginx.conf.j2
    dest: /usr/local/openresty/nginx/conf/nginx.conf
  notify: Restart openresty
  tags: [nginx, code, dashboard, servers]

- name: Copy fix-permissions script
  template:
    src: fix-permissions.sh.j2
    dest: /usr/sbin/fix-permissions.sh
    mode: 0775
  tags: [nginx, code, dashboard, servers]

- name: Fix nginx related directory permissions
  shell: /usr/sbin/fix-permissions.sh
  tags: [nginx, code, dashboard, servers]

- name: Deploy Let's Encrypt contact email configuration
  template:
    src: letsencrypt-contact.sh.j2
    dest: /opt/nginx/data/ssl-certs/letsencrypt/conf.d/contact.sh
    owner: "www-data"
    group: root
    mode: "0644"
  tags: [nginx, servers]

- name: Sync tenant configurations
  ansible.posix.synchronize:
    src: ../../nginx-tenants.d/
    dest: /opt/nginx/conf.d/
  notify: Restart openresty
  register: sync_tenants
  tags: [nginx, servers]

- name: Deploy default.conf when frontend or backend is configured
  template:
    src: default.conf.j2
    dest: /opt/nginx/conf.d/default.conf
    mode: 0664
    owner: www-data
    group: root
  when: (nginx_default_server_frontend | default('') | length > 0) or (nginx_default_server_backend | default('') | length > 0)
  tags: [nginx, servers]

- name: Remove default.conf when no frontend/backend configured
  file:
    path: /opt/nginx/conf.d/default.conf
    state: absent
  when: (nginx_default_server_frontend | default('') | length == 0) and (nginx_default_server_backend | default('') | length == 0)
  tags: [nginx, servers]

- name: Ensure SSL domain directory exists
  file:
    path: /opt/nginx/data/ssl
    state: directory
    mode: '0775'
    owner: www-data
    group: root
  tags: [nginx, servers]

- name: Generate SSL domain files for default server frontend/backend domains
  shell: |
    CREATED=0
    for domain in {{ nginx_default_server_frontend | default('') }} {{ nginx_default_server_backend | default('') }}; do
      [ -z "$domain" ] && continue
      ssl_file="/opt/nginx/data/ssl/${domain}.json"
      if [ ! -f "$ssl_file" ]; then
        echo "{\"ssl_enabled\": true, \"server_name\": \"${domain}\"}" > "$ssl_file"
        chown www-data:root "$ssl_file"
        chmod 664 "$ssl_file"
        echo "Created: $ssl_file"
        CREATED=$((CREATED+1))
      fi
    done
    echo "Default server SSL domain files created: $CREATED"
  register: default_ssl_gen
  changed_when: "'Created:' in default_ssl_gen.stdout"
  when: (nginx_default_server_frontend | default('') | length > 0) or (nginx_default_server_backend | default('') | length > 0)
  tags: [nginx, servers]

- name: Show default server SSL domain generation
  debug:
    msg: "{{ default_ssl_gen.stdout_lines }}"
  when: default_ssl_gen is defined and default_ssl_gen.stdout_lines | length > 0
  tags: [nginx, servers]

- name: Generate SSL domain files from server configs
  shell: |
    CREATED=0
    for env_dir in /opt/nginx/data/servers/*/; do
      [ -d "$env_dir" ] || continue
      for config_file in "$env_dir"*.json; do
        [ -f "$config_file" ] || continue
        ssl_enabled=$(jq -r '.ssl_enabled // false' "$config_file" 2>/dev/null)
        server_name=$(jq -r '.server_name // empty' "$config_file" 2>/dev/null)
        if [ "$ssl_enabled" = "true" ] && [ -n "$server_name" ]; then
          ssl_file="/opt/nginx/data/ssl/${server_name}.json"
          if [ ! -f "$ssl_file" ]; then
            echo "{\"ssl_enabled\": true, \"server_name\": \"${server_name}\"}" > "$ssl_file"
            chown www-data:root "$ssl_file"
            chmod 664 "$ssl_file"
            echo "Created: $ssl_file"
            CREATED=$((CREATED+1))
          fi
        fi
      done
    done
    echo "SSL domain files created: $CREATED"
  register: ssl_gen_result
  changed_when: "'Created:' in ssl_gen_result.stdout"
  tags: [nginx, servers]

- name: Display SSL domain generation result
  debug:
    msg: "{{ ssl_gen_result.stdout_lines }}"
  when: ssl_gen_result.stdout_lines | length > 0
  tags: [nginx, servers]

- name: Template servers-mixed-nginx.conf
  template:
    src: servers-mixed-nginx.conf.j2
    dest: /opt/nginx/conf.d/servers-mixed-nginx.conf
    mode: 0777
  tags: [nginx, servers]

- debug:
    var: sync_tenants.stdout_lines
  when: sync_tenants is defined
  tags: [nginx, servers]

- name: Pre-flight nginx config test
  command: /usr/local/openresty/nginx/sbin/nginx -t
  register: nginx_preflight
  changed_when: false
  ignore_errors: true
  tags: [nginx, code, dashboard, servers]

- name: Show pre-flight config test result
  debug:
    msg: "{{ nginx_preflight.stderr_lines | default(nginx_preflight.stdout_lines) }}"
  when: nginx_preflight is defined
  tags: [nginx, code, dashboard, servers]

# ── ATOMIC GUARD: rollback conf.d on pre-flight failure ───────────────────
#
# Paired with the snapshot taken at the top of nginx_config.yml.  If
# the pre-flight openresty -t fails, swap conf.d/ back to the
# pre-deploy snapshot and abort BEFORE the restart task — otherwise
# systemd's openresty restart fails, workers die, and the host is
# down until manual recovery.  The failed conf.d/ is preserved (just
# renamed) so operators can compare against the snapshot and figure
# out what the templates rendered wrong.
#
# Only acts when the snapshot exists (i.e. nginx_config.yml ran in
# this play — partial deploys with --tags servers may skip it, in
# which case there's nothing to roll back to and we fall through to
# the existing error-display behaviour).
- name: "Atomic guard: roll back conf.d/ if pre-flight failed"
  ansible.builtin.shell: |
    set -euo pipefail
    SNAPSHOT=/opt/nginx/conf.d.predeploy
    if [ ! -d "$SNAPSHOT" ]; then
      echo "no-snapshot"
      exit 0
    fi
    FAILED=/opt/nginx/conf.d.failed-{{ ansible_date_time.iso8601_basic_short }}
    rm -rf "$FAILED"
    mv /opt/nginx/conf.d "$FAILED"
    mv "$SNAPSHOT" /opt/nginx/conf.d
    echo "rolled-back-to:$SNAPSHOT  failed-preserved-at:$FAILED"
  register: _confd_rollback
  changed_when: "'rolled-back-to' in _confd_rollback.stdout"
  when: nginx_preflight is defined and nginx_preflight.rc != 0
  tags: [nginx, code, dashboard, servers]

- name: "Atomic guard: abort deploy after rollback"
  ansible.builtin.fail:
    msg: |
      ABORTING DEPLOY — openresty -t failed after nginx role modifications.

      stderr from openresty -t:
      {{ nginx_preflight.stderr | default('(no stderr)') }}

      conf.d/ rollback status: {{ _confd_rollback.stdout | default('(no snapshot to roll back to)') }}

      A subsequent systemd restart with this broken config would have
      taken the host down.  Either the rolled-back conf.d/ is back to
      its pre-deploy state, OR (if no snapshot was taken — partial
      deploy with insufficient tags) the broken state is preserved
      for inspection.  Either way: investigate and re-run.
  when: nginx_preflight is defined and nginx_preflight.rc != 0
  tags: [nginx, code, dashboard, servers]

- name: "Atomic guard: clean up successful snapshot"
  ansible.builtin.file:
    path: /opt/nginx/conf.d.predeploy
    state: absent
  when: nginx_preflight is defined and nginx_preflight.rc == 0
  tags: [nginx, code, dashboard, servers]

- name: Stop existing OpenResty service before restart
  systemd:
    name: openresty
    state: stopped
  ignore_errors: true
  tags: [nginx, code, dashboard, servers]

- name: Kill any stale nginx processes
  shell: killall nginx 2>/dev/null || true
  changed_when: false
  tags: [nginx, code, dashboard, servers]

- name: Wait for ports to be released
  pause:
    seconds: 2
  tags: [nginx, code, dashboard, servers]

- name: Enable and start OpenResty service
  systemd:
    name: openresty
    state: restarted
    enabled: yes
    daemon_reload: yes
  register: openresty_start
  ignore_errors: true
  tags: [nginx, code, dashboard, servers]

- name: Capture OpenResty service status on failure
  shell: |
    echo "=== systemctl status ==="
    systemctl status openresty.service --no-pager -l 2>&1 || true
    echo "=== journalctl last 30 lines ==="
    journalctl -u openresty.service --no-pager -n 30 2>&1 || true
  register: service_debug
  when: openresty_start is failed
  tags: [nginx, code, dashboard, servers]

- name: Show OpenResty service failure details
  debug:
    msg: "{{ service_debug.stdout_lines }}"
  when: openresty_start is failed and service_debug is defined
  tags: [nginx, code, dashboard, servers]

- name: Fail if OpenResty service did not start
  fail:
    msg: "OpenResty service failed to start. See diagnostic output above."
  when: openresty_start is failed
  tags: [nginx, code, dashboard, servers]

- name: Verify Nginx config
  command: openresty -t
  changed_when: false
  tags: [nginx, code, dashboard, servers]

- name: Verify OpenResty file descriptor limits
  shell: |
    NGINX_PID=$(pgrep -o nginx || pgrep -o openresty || echo "")
    if [ -n "$NGINX_PID" ]; then
      cat /proc/$NGINX_PID/limits | grep "open files"
    else
      echo "Nginx not running - limits will be applied on next start"
    fi
  register: fd_limits_check
  changed_when: false
  tags: [nginx]

- name: Display current file descriptor limits
  debug:
    msg: "{{ fd_limits_check.stdout_lines }}"
  when: fd_limits_check is defined
  tags: [nginx]
