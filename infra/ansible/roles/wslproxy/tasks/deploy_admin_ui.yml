---
# Deploy OpenResty admin UI and build with npm/yarn
# Only runs when nginx_web_ui_enabled == "yes"

- name: Sync openresty-admin files
  ansible.posix.synchronize:
    src: ../../openresty-admin/
    dest: /usr/local/openresty/nginx/html/openresty-admin
  register: sync_admin
  tags: [dashboard]

- debug:
    var: sync_admin.stdout_lines
  tags: [dashboard]

- name: Copy npm/yarn build script
  template:
    src: install-build-npm-yarn.sh.j2
    dest: /tmp/install-build-npm-yarn.sh
    mode: 0777
  tags: [dashboard]

- name: Execute the npm/yarn build script
  shell: /tmp/install-build-npm-yarn.sh
  tags: [dashboard]

- name: Write admin runtime-config.js from settings/env
  command: /usr/local/bin/write-admin-runtime-config.sh
  tags: [dashboard]
