---
# Deploy Next.js admin dashboard (standalone server)
# Only runs when nginx_web_ui_enabled == "yes"
#
# Architecture:
#   Node.js (port {{ nginx_nextjs_node_port }}) ← Nginx reverse proxy (port {{ nginx_nextjs_dashboard_port }})
#   Both port 8080 (old) and {{ nginx_nextjs_dashboard_port }} (new) share the same Lua API backend.
#
# Tags:
#   dashboard-next  → Deploy pre-built standalone output + systemd service
#   dashboard       → Deploys both old React admin AND new Next.js dashboard

# ── Step 1: Ensure Node.js is available on the target ────────────────────

- name: Check if Node.js is installed
  shell: node --version 2>/dev/null || echo "NOT_INSTALLED"
  register: node_check
  changed_when: false
  failed_when: false
  tags: [dashboard-next]

- name: Install Node.js via system package manager if missing
  when: "'NOT_INSTALLED' in node_check.stdout"
  block:
    - name: Install Node.js (Debian/Ubuntu)
      apt:
        name: [nodejs, npm]
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install Node.js (SUSE)
      zypper:
        name: [nodejs20, npm20]
        state: present
      when: ansible_os_family == "Suse"

    - name: Install Node.js (RedHat/Rocky)
      yum:
        name: [nodejs, npm]
        state: present
      when: ansible_os_family == "RedHat"

    - name: Verify Node.js is now available
      shell: node --version
      register: node_version_after
      changed_when: false

    - debug:
        msg: "Node.js installed: {{ node_version_after.stdout }}"
  tags: [dashboard-next]

- name: Report Node.js version
  debug:
    msg: "Node.js version: {{ node_check.stdout }}"
  when: "'NOT_INSTALLED' not in node_check.stdout"
  tags: [dashboard-next]

# ── Step 2: Build Next.js on the control machine (if not pre-built) ──────

# Always rebuild on deploy.  The previous `when: not stat.exists`
# guard meant that whichever `.next/standalone/server.js` happened to
# be lying around on the runner — possibly built with no
# NEXT_PUBLIC_* vars set, possibly weeks stale — was the artifact that
# shipped to int / test / acc / prod.  Operators couldn't tell which
# build was actually in front of them.  Rebuilding from scratch is
# ~30 seconds and removes the silent-stale-bundle class of bugs.
- name: Wipe previous Next.js build output
  delegate_to: localhost
  # Local build steps run on the control machine and never need root;
  # inheriting the play's become would try to sudo locally (fails on a
  # workstation deploy where sudo needs a password — see POP1_DEPLOY.md).
  become: false
  file:
    path: "{{ playbook_dir }}/../../openresty-admin-next/.next"
    state: absent
  tags: [dashboard-next]

- name: Build Next.js dashboard locally
  delegate_to: localhost
  become: false
  block:
    - name: Install Next.js dependencies
      shell: npm install --legacy-peer-deps
      args:
        chdir: "{{ playbook_dir }}/../../openresty-admin-next"

    # NEXT_PUBLIC_* env vars are INLINED into the client bundle at
    # build time and CANNOT be overridden by systemd Environment=
    # lines at runtime.  So the build step is the only place these
    # have any effect — pass them all here.  See also the systemd
    # template (wslproxy-nextjs-dashboard.service.j2): it keeps the
    # same vars set for server-side rendering, but the client-bundle
    # values come from THIS step.
    - name: Build Next.js standalone output
      shell: npm run build
      args:
        chdir: "{{ playbook_dir }}/../../openresty-admin-next"
      environment:
        NODE_ENV: production
        WSLPROXY_API_URL: "http://127.0.0.1:{{ nginx_default_server_backend_port }}"
        NEXT_PUBLIC_APP_VERSION: "{{ wslproxy_version | default('1.0.0') }}"
        NEXT_PUBLIC_APP_BUILD_NUMBER: "{{ wslproxy_build_number | default('local') }}"
        NEXT_PUBLIC_DEPLOYMENT_TIME: "{{ wslproxy_deployment_time | default(ansible_date_time.iso8601) }}"
        NEXT_PUBLIC_ENV_NAME: "{{ target_env | default('local') }}"
        NEXT_PUBLIC_GIT_SHA: "{{ wslproxy_git_sha | default('') }}"
        NEXT_PUBLIC_GIT_REPO: "{{ wslproxy_git_repo | default('bwalia/wslproxy') }}"
        NEXT_PUBLIC_TARGET_PLATFORM: BARE_METAL

    - name: Verify standalone build was created
      stat:
        path: "{{ playbook_dir }}/../../openresty-admin-next/.next/standalone/server.js"
      register: nextjs_build_verify
      failed_when: not nextjs_build_verify.stat.exists
  tags: [dashboard-next]

# ── Step 3: Deploy Next.js standalone build to target ────────────────────

- name: Create Next.js admin directory
  file:
    path: /usr/local/openresty/nginx/html/openresty-admin-next
    state: directory
    owner: "{{ openresty_user | default('www-data') }}"
    group: "{{ openresty_group | default('www-data') }}"
    mode: '0755'
  tags: [dashboard-next]

- name: Sync Next.js standalone server
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../openresty-admin-next/.next/standalone/"
    dest: /usr/local/openresty/nginx/html/openresty-admin-next
    delete: yes
    rsync_opts:
      - "--exclude=node_modules/.cache"
  register: sync_nextjs_standalone
  notify: restart nextjs dashboard
  tags: [dashboard-next]

- name: Sync Next.js static assets
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../openresty-admin-next/.next/static/"
    dest: /usr/local/openresty/nginx/html/openresty-admin-next/.next/static
  register: sync_nextjs_static
  tags: [dashboard-next]

- name: Sync Next.js public assets
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../openresty-admin-next/public/"
    dest: /usr/local/openresty/nginx/html/openresty-admin-next/public
  register: sync_nextjs_public
  ignore_errors: true
  tags: [dashboard-next]

- name: Set ownership on Next.js directory
  file:
    path: /usr/local/openresty/nginx/html/openresty-admin-next
    owner: "{{ openresty_user | default('www-data') }}"
    group: "{{ openresty_group | default('www-data') }}"
    recurse: yes
  tags: [dashboard-next]

- debug:
    msg: >-
      Next.js deployed — standalone: {{ sync_nextjs_standalone.changed | default(false) }},
      static: {{ sync_nextjs_static.changed | default(false) }},
      public: {{ sync_nextjs_public.changed | default(false) }}
  tags: [dashboard-next]

# ── Step 4: Systemd service ──────────────────────────────────────────────

- name: Deploy Next.js dashboard systemd service
  template:
    src: wslproxy-nextjs-dashboard.service.j2
    dest: /etc/systemd/system/wslproxy-nextjs-dashboard.service
    mode: '0644'
  notify: restart nextjs dashboard
  tags: [dashboard-next]

- name: Enable and start Next.js dashboard service
  systemd:
    name: wslproxy-nextjs-dashboard
    enabled: yes
    state: started
    daemon_reload: yes
  tags: [dashboard-next]
