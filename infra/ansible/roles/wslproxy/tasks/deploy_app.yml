---
# Deploy application code: HTML pages and Lua API files

- name: Install write-admin-runtime-config helper
  copy:
    src: "{{ playbook_dir }}/../../scripts/write-admin-runtime-config.sh"
    dest: /usr/local/bin/write-admin-runtime-config.sh
    mode: "0755"
  tags: [code, dashboard, nginx]

- name: Sync HTML files
  ansible.posix.synchronize:
    src: ../../html/
    dest: /usr/local/openresty/nginx/html
  register: sync_html
  tags: [code, dashboard]

- debug:
    var: sync_html.stdout_lines
  tags: [code, dashboard]

- name: Sync API files
  ansible.posix.synchronize:
    src: ../../api/
    dest: /usr/local/openresty/nginx/html/api
  notify: Restart openresty
  register: sync_api
  tags: [code, dashboard]

- debug:
    var: sync_api.stdout_lines
  tags: [code, dashboard]
