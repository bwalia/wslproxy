---
# Deploy server/rule data configs, settings, and environment files.
#
# Two source modes, gated on the host var `vault_secrets_enabled`:
#
#   1) Vault mode (vault_secrets_enabled: true)
#      Fetches both secrets from HashiCorp Vault using the env vars
#      VAULT_ADDR and VAULT_TOKEN. The host var `target_env` selects the
#      environment slug (int|test|acc|prod|...) and is used in the path:
#        secret/data/wslproxy/<target_env>/settings.json
#        secret/data/wslproxy/<target_env>/env
#      Works for both GH workflow runs and direct local ansible runs as
#      long as VAULT_ADDR/VAULT_TOKEN are exported in the environment.
#
#   2) Legacy file mode (vault_secrets_enabled: false / unset, default)
#      Reads from a path on the ansible controller, configured per host
#      via local_settings_file_path / local_env_file_path. Used by the
#      runner_file and github_secret workflow modes which write the
#      secret to /tmp/<...> on the runner before running the playbook.
#
# Vault env-file storage convention (KV v2 secret data):
#   - either {"value": "<entire .env file contents as a string>"}
#   - or a flat key/value map → rendered as KEY=VAL lines
# Both formats are handled by the rendered template below.

- name: Ensure nginx data directory exists
  ansible.builtin.file:
    path: /opt/nginx/data/
    state: directory
    owner: "www-data"
    group: root
    mode: 0775
  tags: [servers, code]

- name: Determine secrets source mode
  ansible.builtin.set_fact:
    _use_vault_secrets: "{{ vault_secrets_enabled | default(false) | bool }}"
    # SOPS mode is opt-in via `sops_secrets_enabled: true` (set by
    # the workflow when `secrets_mode: sops`).  When neither vault
    # nor sops is enabled, the role falls back to the legacy
    # file-copy path (settings.json + .env already on the runner,
    # decoded from GitHub Secrets one step earlier).
    _use_sops_secrets: "{{ sops_secrets_enabled | default(false) | bool }}"
  tags: [servers, code]

- name: "Assert exactly one secrets mode is active"
  ansible.builtin.assert:
    that:
      - not (_use_vault_secrets and _use_sops_secrets)
    fail_msg: >-
      Both vault_secrets_enabled and sops_secrets_enabled are true.
      Pick exactly one: vault for HashiCorp Vault fetches, sops for
      SOPS+age-encrypted files committed to Git, or neither (legacy
      file-copy mode).
  tags: [servers, code]

# ── Vault mode ─────────────────────────────────────────────────────────────

- name: "Vault: assert env vars and target_env are set"
  ansible.builtin.assert:
    that:
      - lookup('env', 'VAULT_TOKEN') | length > 0
      - lookup('env', 'VAULT_ADDR')  | length > 0
      - target_env is defined and target_env | length > 0
    fail_msg: >-
      vault_secrets_enabled=true requires VAULT_TOKEN and VAULT_ADDR to be
      exported in the environment, and target_env to be set on the host.
      Run: export VAULT_ADDR=https://your-vault VAULT_TOKEN=hvs.xxx
  when: _use_vault_secrets
  tags: [servers, code]

- name: "Vault: fetch settings.json"
  ansible.builtin.uri:
    url: "{{ lookup('env', 'VAULT_ADDR') }}/v1/secret/data/wslproxy/{{ target_env }}/settings.json"
    method: GET
    headers:
      X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    return_content: yes
    status_code: 200
  delegate_to: localhost
  # HTTP GET on the runner — must NOT inherit the play's `become: yes`, or
  # ansible tries to sudo on the (self-hosted) runner to fetch the secret and
  # dies with "Premature end of stream waiting for become success". Only the
  # *write* tasks below need root, and those run on the target host.
  become: false
  no_log: true
  register: _vault_settings
  when: _use_vault_secrets
  tags: [servers, code]

- name: "Vault: refuse deploy if settings.env_profile != target_env"
  # See the comment block above the SOPS guard task for the full rationale.
  ansible.builtin.assert:
    that:
      - (_vault_settings.json.data.data.env_profile | default('')) == target_env
    fail_msg: >-
      ABORTING DEPLOY — env_profile mismatch.  Vault path
      secret/data/wslproxy/{{ target_env }}/settings.json contains
      env_profile='{{ _vault_settings.json.data.data.env_profile | default('<missing>') }}'
      but the workflow's target_env='{{ target_env }}'.  Writing this file
      to the target would overwrite the host's profile with the wrong
      environment's data (rules under data/{rules,servers}/<profile>/
      are looked up by env_profile at request time).  This is the check
      that would have prevented the 2026-06-29 prod outage; fix the
      Vault payload or the workflow before retrying.
  when: _use_vault_secrets
  tags: [servers, code]

- name: "Vault: write settings.json to target"
  ansible.builtin.copy:
    content: "{{ _vault_settings.json.data.data | to_nice_json }}"
    dest: /opt/nginx/data/settings.json
    mode: 0777
    owner: "www-data"
    group: root
  no_log: true
  when: _use_vault_secrets
  tags: [servers, code]

- name: "Vault: fetch env file"
  ansible.builtin.uri:
    url: "{{ lookup('env', 'VAULT_ADDR') }}/v1/secret/data/wslproxy/{{ target_env }}/env"
    method: GET
    headers:
      X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    return_content: yes
    status_code: 200
  delegate_to: localhost
  # See the settings.json fetch above — no become on the runner-side GET.
  become: false
  no_log: true
  register: _vault_env
  when: _use_vault_secrets
  tags: [servers, code]

- name: "Vault: write env file to target"
  ansible.builtin.copy:
    content: |
      {% if _vault_env.json.data.data.value is defined %}
      {{ _vault_env.json.data.data.value }}
      {% else %}
      {% for k, v in _vault_env.json.data.data.items() %}
      {{ k }}={{ v }}
      {% endfor %}
      {% endif %}
    dest: /tmp/.env
    mode: 0777
  no_log: true
  when: _use_vault_secrets
  tags: [servers, code]

# ── SOPS + age mode ────────────────────────────────────────────────────────
#
# Decrypts files committed to the repo at infra/secrets/<env>/.  No
# network calls — the runner already has the age private key in
# $SOPS_AGE_KEY (exported from the GitHub Secret SOPS_AGE_KEY).
# Eliminates the entire class of "Vault token expired" / "Vault
# returned non-JSON" failures since the secret material travels
# encrypted-at-rest with the code.
#
# Why we use `community.sops.sops` lookup (not load_vars):
#  - settings.json must be written verbatim to the target (the file
#    *is* the secret), not re-rendered through Jinja
#  - load_vars would parse the JSON into Ansible vars which would
#    then need re-encoding, losing key ordering / number precision
#
# Both lookups run on localhost (the runner) — that's where the
# encrypted files live (in the checked-out repo) and where the
# decryption key is available.

- name: "SOPS: assert SOPS_AGE_KEY is set"
  ansible.builtin.assert:
    that:
      - lookup('env', 'SOPS_AGE_KEY') | length > 0
      - target_env is defined and target_env | length > 0
    fail_msg: >-
      sops_secrets_enabled=true requires SOPS_AGE_KEY env var to be
      set on the runner (export SOPS_AGE_KEY=AGE_SECRET_KEY-1…),
      and target_env to be set on the host.  See
      infra/secrets/README.md for setup.
  when: _use_sops_secrets
  tags: [servers, code]

- name: "SOPS: refuse deploy if settings.env_profile != target_env"
  # ENV PROFILE GUARD — prevent the 2026-06-29 outage shape from
  # recurring.  On that day a workflow ran with target_env=int but
  # rsynced int's settings.json onto the prod host, flipping
  # env_profile to 'int' and pointing the gateway at the wrong
  # rules/servers tree.  The guard reads the file we're about to
  # write, parses out env_profile, and refuses to continue if it
  # doesn't match target_env.  Single source of truth — runs in all
  # three secret-paths (vault / sops / file) before the write.
  ansible.builtin.assert:
    that:
      - ((lookup('community.sops.sops', sops_settings_path) | from_json).env_profile | default('')) == target_env
    fail_msg: >-
      ABORTING DEPLOY — env_profile mismatch.  infra/secrets/{{ target_env }}/settings.sops.json
      decrypts to env_profile='{{ (lookup("community.sops.sops", sops_settings_path) | from_json).env_profile | default("<missing>") }}'
      but the workflow's target_env='{{ target_env }}'.  Writing this file
      to the target would overwrite the host's profile with the wrong
      environment's data (rules under data/{rules,servers}/<profile>/
      are looked up by env_profile at request time).  This is the check
      that would have prevented the 2026-06-29 prod outage; fix the
      encrypted file (sops infra/secrets/{{ target_env }}/settings.sops.json)
      or the workflow target_env before retrying.
  vars:
    sops_settings_path: >-
      {{ playbook_dir }}/../../infra/secrets/{{ target_env }}/settings.sops.json
  no_log: true
  when: _use_sops_secrets
  tags: [servers, code]

- name: "SOPS: decrypt + write settings.json to target"
  ansible.builtin.copy:
    # Use the `community.sops.sops` lookup to decrypt at task time.
    # Path is resolved relative to the playbook_dir on the runner;
    # the encrypted file lives in the repo under infra/secrets/.
    content: "{{ lookup('community.sops.sops', sops_settings_path) }}"
    dest: /opt/nginx/data/settings.json
    mode: 0777
    owner: "www-data"
    group: root
  vars:
    sops_settings_path: >-
      {{ playbook_dir }}/../../infra/secrets/{{ target_env }}/settings.sops.json
  no_log: true
  when: _use_sops_secrets
  tags: [servers, code]

- name: "SOPS: decrypt + write env file to target"
  ansible.builtin.copy:
    content: "{{ lookup('community.sops.sops', sops_env_path) }}"
    dest: "/tmp/.env"
    mode: 0777
  vars:
    sops_env_path: >-
      {{ playbook_dir }}/../../infra/secrets/{{ target_env }}/env.sops.env
  no_log: true
  when: _use_sops_secrets
  tags: [servers, code]

# ── Legacy file mode (existing behaviour, unchanged) ───────────────────────
# Only runs when NEITHER vault nor sops is enabled.  Reads the
# settings.json and .env that an earlier workflow step decoded from
# GitHub Secrets into the runner's filesystem.

- name: "File: refuse deploy if settings.env_profile != target_env"
  # See the comment block above the SOPS guard task for the full rationale.
  ansible.builtin.assert:
    that:
      - ((lookup('file', local_settings_file_path) | from_json).env_profile | default('')) == target_env
    fail_msg: >-
      ABORTING DEPLOY — env_profile mismatch.  The staged settings file
      at {{ local_settings_file_path }} contains
      env_profile='{{ (lookup("file", local_settings_file_path) | from_json).env_profile | default("<missing>") }}'
      but the workflow's target_env='{{ target_env }}'.  Writing this file
      to the target would overwrite the host's profile with the wrong
      environment's data (rules under data/{rules,servers}/<profile>/
      are looked up by env_profile at request time).  This is the check
      that would have prevented the 2026-06-29 prod outage; fix the
      staged file or the workflow target_env before retrying.
  when: not _use_vault_secrets and not _use_sops_secrets
  tags: [servers, code]

- name: "File: copy settings.json from controller"
  ansible.builtin.copy:
    src: "{{ local_settings_file_path }}"
    dest: /opt/nginx/data/settings.json
    mode: 0777
    owner: "www-data"
    group: root
    remote_src: no
  when: not _use_vault_secrets and not _use_sops_secrets
  tags: [servers, code]

- name: "File: copy env file from controller"
  ansible.builtin.copy:
    src: "{{ local_env_file_path }}"
    dest: "/tmp/.env"
    mode: 0777
    remote_src: no
  when: not _use_vault_secrets and not _use_sops_secrets
  tags: [servers, code]
