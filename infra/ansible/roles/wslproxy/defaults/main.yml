nginx_port: 80

# When set (e.g. "192.0.2.10"), public HTTP/HTTPS listeners bind that IP
# only — so Traefik (or anything else) can keep 127.0.0.1:80/443 on the same
# host without EADDRINUSE. Empty = bind all interfaces (0.0.0.0 / *).
nginx_public_bind_ip: ""

# Default server frontend/backend hostnames for nginx
# Override these in host_vars or group_vars for each environment
# Frontend: public landing page (static HTML)
# Backend: admin UI proxy to localhost:8080
# Backend (Next.js): canonical domain proxied to the Next.js node (3099)
nginx_default_server_frontend: ""
nginx_default_server_backend: ""
nginx_default_server_backend_port: 8080
nginx_default_server_backend_nextjs: ""
nginx_nextjs_dashboard_port: 8099
nginx_nextjs_node_port: 3099

# Dashboard version and build information
# These values are used by the React dashboard footer.
#
# Source of truth, in priority order:
#   1. `--extra-vars wslproxy_version=…` from the caller.  The CI
#      workflow (deploy-environment.yml) resolves the version from
#      `git describe --tags --abbrev=0` and passes it via extra-vars,
#      so any CI-driven deploy uses the git tag NOT the file value.
#   2. `git describe --tags --abbrev=0` inside this repo.  Used when
#      ansible-playbook is invoked locally by a developer without an
#      explicit override.  `|| echo` ensures a non-zero exit (no tags
#      reachable, e.g. a shallow clone) yields empty rather than
#      failing the whole play.
#   3. `system/app.json:version.version` — legacy fallback for repos
#      that pre-date tagging.
#   4. `1.0.0` — hard fallback so the play can't error on a missing
#      value.
#
# Historical bug this fixes: on 2026-07-02 int deployed a 1.0.13
# tagged build but showed 1.0.10 in the dashboard footer because
# app.json wasn't bumped alongside the tag.  Git tags are now
# authoritative.
wslproxy_version: >-
  {{ (lookup('pipe',
             'git -C ' + playbook_dir + '/../../ describe --tags --abbrev=0 2>/dev/null || echo')
       | trim)
     or (lookup('file', playbook_dir + '/../../system/app.json')
         | from_json).version.version
     | default('1.0.0') }}
wslproxy_build_number: "{{ (lookup('file', playbook_dir + '/../../system/app.json') | from_json).version.build | default('unknown') }}"
wslproxy_deployment_time: "{{ ansible_date_time.iso8601 }}"

# ── IP2Location LITE database ────────────────────────────────────────────
# Canonical on-disk location for the country-lookup DB.  Read by
# api/log_handler.lua (per-request country recording) and
# api/geo_lookup.lua (rule-time country matching).
#
# History: prod silently lost geographic traffic for weeks because
# the file was installed under /usr/local/openresty/nginx/ but
# settings.json (in Vault) still pointed at the legacy /tmp/ path.
# Centralising the var here means cdn-dependencies.sh.j2, the
# /__ip_location debug endpoint in nginx.conf.j2, the refresh
# systemd timer, and the api/init.lua fallback all agree on the
# same file.  `/tmp` is also a bad idea — some systems clear it on
# reboot, which would silently break geo lookups after every restart.
ip2location_db_path: /usr/local/openresty/nginx/IP2LOCATION-LITE-DB11.IPV6.BIN

# Source URL for the LITE DB file.  Currently a public S3 mirror — to
# refresh content you replace the object in that bucket, or override
# this variable per-environment to point at upstream IP2Location LITE
# (which requires registration + a download token).
ip2location_download_url: "https://edgeone-public.s3.eu-west-2.amazonaws.com/src/openresty/IP2LOCATION-LITE-DB11.IPV6.BIN/IP2LOCATION-LITE-DB11.IPV6.BIN"

# OnCalendar expression for the monthly auto-refresh systemd timer.
# `*-*-01 03:30:00` = 03:30 UTC on the 1st of every month.  The LITE
# DB is updated by IP2Location around the start of each month.
ip2location_refresh_schedule: "*-*-01 03:30:00"

# ── POPs (Points of Presence) seed ───────────────────────────────────────
#
# Default seeds for the two production POPs (pop0 + lon1).  These are
# only written if the file doesn't already exist on the target host
# (`force: no` in tasks/seed_pops.yml), so any edit an operator made
# via the dashboard survives a re-run of the role.
#
# To customise per-environment:
#   - Override `wslproxy_pops` in inventory / group_vars to ADD POPs
#     specific to that environment (e.g. a per-region edge fleet).
#   - To DELETE a POP that the seed would otherwise create, use the
#     dashboard or `DELETE /api/pops/<id>`.  Re-deploying the role
#     won't recreate it because the seed only writes missing files.
#
# Fields match the schema validated by api/pops.lua.  See
# POPS_AND_DNS_GUIDE.md §1 for what each field means.
wslproxy_pops:
  - id: pop0
    display_name: "London POP 0"
    public_ipv4: "187.124.112.155"
    provider: hetzner
    region: eu-west
    city: London
    country_code: GB
    status: active
    capacity_weight: 1.0
    tags:
      - production
      - primary
    metadata: {}
  - id: lon1
    display_name: "London POP 1"
    public_ipv4: "195.20.255.201"
    provider: ionos
    region: eu-west
    city: London
    country_code: GB
    status: active
    capacity_weight: 1.0
    tags:
      - production
      - secondary
    metadata: {}
