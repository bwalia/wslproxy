---
# Docker CE installation for Debian/Ubuntu
# Follows official Docker install docs: https://docs.docker.com/engine/install/debian/

- name: Install Docker prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes
  tags: [docker]

- name: Create apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: [docker]

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: yes
  tags: [docker]

- name: Add Docker apt repository
  copy:
    content: |
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable
    dest: /etc/apt/sources.list.d/docker.list
    mode: "0644"
  tags: [docker]

- name: Update apt cache after adding Docker repo
  apt:
    update_cache: yes
  tags: [docker]

- name: Install Docker CE packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  tags: [docker]

- name: Enable and start Docker service
  systemd:
    name: docker
    enabled: yes
    state: started
    daemon_reload: yes
  tags: [docker]

- name: Enable containerd service
  systemd:
    name: containerd
    enabled: yes
    state: started
  tags: [docker]

- name: Add users to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users }}"
  when: docker_users | length > 0
  tags: [docker]

- name: Verify Docker installation
  command: docker --version
  register: docker_version
  changed_when: false
  tags: [docker]

- name: Display Docker version
  debug:
    var: docker_version.stdout
  tags: [docker]

- name: Verify Docker Compose
  command: docker compose version
  register: docker_compose_version
  changed_when: false
  tags: [docker]

- name: Display Docker Compose version
  debug:
    var: docker_compose_version.stdout
  tags: [docker]

- name: Verify Docker service is active
  command: systemctl is-active docker
  register: docker_service_status
  changed_when: false
  tags: [docker]

- name: Display Docker service status
  debug:
    msg: "Docker service is {{ docker_service_status.stdout }}"
  tags: [docker]

- name: Run Docker hello-world smoke test
  command: docker run --rm hello-world
  register: docker_hello_world
  changed_when: false
  tags: [docker]

- name: Display hello-world output
  debug:
    var: docker_hello_world.stdout_lines
  tags: [docker]
