[defaults]
# Connection timeout (seconds) — how long to wait for SSH connection
timeout = 30

# Gathering facts timeout
gather_timeout = 30

# Forks — parallel task execution
forks = 5

# Retry files disabled (clutter)
retry_files_enabled = False

[ssh_connection]
# SSH connection arguments
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=30

# Pipelining improves performance
pipelining = True
