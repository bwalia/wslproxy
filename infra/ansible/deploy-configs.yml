---
# deploy-configs.yml - Ansible playbook to deploy server configs and rules
# Usage: ansible-playbook -i hosts deploy-configs.yml -e "target_env=prod"
#
# This playbook deploys server configurations and routing rules from the
# repository to target OpenResty/nginx servers.
#
# Host groups are defined in the inventory file:
#   - openresty_prod: Production servers
#   - openresty_int: Integration servers
#   - openresty_test: Test servers
#   - openresty_dev: Development servers
#   (openresty_acc was decommissioned along with 187.77.179.206)

- name: Deploy WSLProxy Server Configs and Rules
  hosts: "{{ host_group | default('openresty_' + (target_env | default('int'))) }}"
  become: yes
  gather_facts: yes

  vars:
    # Remote data directory
    remote_data_dir: "/opt/nginx/data"

    # Local data directory (relative to playbook)
    local_data_dir: "{{ playbook_dir }}/../../data"

    # Project code for source directory (e.g. "diytaxreturn")
    # When set, reads from data/servers/<project_code>/ instead of data/servers/<target_env>/
    # Files are always deployed to the remote servers/<target_env>/ directory
    project_code: ""

    # Resolved source directory - uses project_code if set, otherwise target_env
    source_subdir: "{{ project_code if project_code else target_env }}"

    # Backup settings
    backup_enabled: true
    backup_dir: "/opt/nginx/backups"
    backup_retention_days: 7

    # Validation settings
    validate_json: true

    # How config files reach the target:
    #   auto  - probe at runtime whether the controller IS the target (default)
    #   push  - always rsync from the controller over SSH
    #   local - controller and target are the same machine; rsync on the host
    config_sync_mode: auto

    # Nginx reload settings
    reload_nginx: false
    nginx_service: "openresty"

  tasks:
    - name: Display deployment information
      debug:
        msg: |
          ==========================================
          WSLProxy Config Deployment
          ==========================================
          Target Environment: {{ target_env }}
          Project Code: {{ project_code | default('(none)') }}
          Source Subdir: {{ source_subdir }}
          Target Host: {{ inventory_hostname }}
          Remote Data Dir: {{ remote_data_dir }}
          ==========================================

    - name: Validate target environment
      assert:
        that:
          - target_env in ['dev', 'int', 'test', 'acc', 'prod', 'lon1', 'diytaxreturn', 'diytaxreturn_wsl1']
        fail_msg: "Invalid target_env: {{ target_env }}. Must be one of: dev, int, test, acc, prod, lon1, diytaxreturn, diytaxreturn_wsl1"
        success_msg: "Target environment validated: {{ target_env }}"

    - name: Validate config sync mode
      assert:
        that:
          - config_sync_mode in ['auto', 'push', 'local']
        fail_msg: "Invalid config_sync_mode: {{ config_sync_mode }}. Must be one of: auto, push, local"
        quiet: true

    - name: Ensure remote directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0775'
        owner: www-data
        group: root
      loop:
        - "{{ remote_data_dir }}"
        - "{{ remote_data_dir }}/servers"
        - "{{ remote_data_dir }}/servers/{{ target_env }}"
        - "{{ remote_data_dir }}/rules"
        - "{{ remote_data_dir }}/rules/{{ target_env }}"

    - name: Ensure backup directory exists
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'
      when: backup_enabled

    - name: Create backup of existing configs
      archive:
        path:
          - "{{ remote_data_dir }}/servers/{{ target_env }}"
          - "{{ remote_data_dir }}/rules/{{ target_env }}"
        dest: "{{ backup_dir }}/configs-{{ target_env }}-{{ ansible_date_time.epoch }}.tar.gz"
        format: gz
      when: backup_enabled
      ignore_errors: yes
      register: backup_result

    - name: Display backup status
      debug:
        msg: "Backup created: {{ backup_result.dest | default('N/A') }}"
      when: backup_enabled and backup_result is succeeded

    - name: Clean up old backups
      shell: |
        find {{ backup_dir }} -name "configs-{{ target_env }}-*.tar.gz" -mtime +{{ backup_retention_days }} -delete
      when: backup_enabled
      ignore_errors: yes

    - name: Find local server config files
      find:
        paths: "{{ local_data_dir }}/servers/{{ source_subdir }}"
        patterns: "*.json"
      delegate_to: localhost
      become: no
      register: server_config_files

    - name: Find local rule config files
      find:
        paths: "{{ local_data_dir }}/rules/{{ source_subdir }}"
        patterns: "*.json"
      delegate_to: localhost
      become: no
      register: rule_config_files

    - name: Display files to be deployed
      debug:
        msg: |
          Server configs: {{ server_config_files.files | length }} file(s)
          Rule configs: {{ rule_config_files.files | length }} file(s)

    - name: Validate server config JSON syntax
      shell: "jq empty {{ item.path }}"
      delegate_to: localhost
      become: no
      loop: "{{ server_config_files.files }}"
      when: validate_json
      register: server_validation
      changed_when: false

    - name: Validate rule config JSON syntax
      shell: "jq empty {{ item.path }}"
      delegate_to: localhost
      become: no
      loop: "{{ rule_config_files.files }}"
      when: validate_json
      register: rule_validation
      changed_when: false

    # Bulk rsync for config deploy. Two paths:
    # - push  : rsync from the controller over SSH (delegate_to: localhost).
    #           Required for remote targets — without it, rsync runs on the
    #           inventory host and looks for local_data_dir there.
    # - local : controller and target are the same machine (a self-hosted
    #           runner deploying to itself); rsync runs on the host, no SSH
    #           hop. delegate_to: localhost would SSH back into the host and
    #           fail without keys.
    #
    # Which one is chosen comes from the runtime probe below, NOT from
    # `ansible_connection`. That variable cannot answer the question:
    #   - bare `ansible_connection` inside a `delegate_to: localhost` task
    #     resolves to the DELEGATE's connection ('local'), so `!= 'local'` was
    #     false for every host and BOTH branches skipped — no sync ever ran and
    #     the play still passed, because a skip is not a failure (107f8a66);
    #   - `hostvars[inventory_hostname].ansible_connection` only sees what the
    #     INVENTORY sets. `ansible-playbook --connection=local` — how the
    #     self-hosted int/test runners deploy to themselves — leaves it
    #     undefined, so the 'ssh' default picked the push branch and rsync tried
    #     to SSH from the int runner back into itself:
    #       bwalia@192.168.1.193: Permission denied (publickey,password).
    #
    # The probe asks the only question that actually matters — can the target
    # read local_data_dir at that path? — by creating a randomly named marker on
    # the controller and stat'ing it on the target. Visible ⇒ same machine (or
    # shared filesystem) ⇒ rsync locally. Not visible ⇒ push over SSH. Random
    # name matters: several hosts in this fleet run a runner under the same
    # user, so a fixed path would false-positive on a sibling's workspace.
    - name: Create controller-side marker for same-machine detection
      tempfile:
        state: file
        prefix: wslproxy-sync-probe.
      delegate_to: localhost
      become: false
      changed_when: false
      register: sync_probe_marker
      when: config_sync_mode == 'auto'

    - name: Probe whether the target can see the controller marker
      stat:
        path: "{{ sync_probe_marker.path }}"
      changed_when: false
      register: sync_probe
      when: config_sync_mode == 'auto'

    - name: Remove controller-side marker
      file:
        path: "{{ sync_probe_marker.path }}"
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false
      when: config_sync_mode == 'auto'

    - name: Resolve effective config sync mode
      set_fact:
        effective_sync_mode: >-
          {{ config_sync_mode if config_sync_mode != 'auto'
             else ('local' if (sync_probe.stat.exists | default(false)) else 'push') }}

    - name: Display effective config sync mode
      debug:
        msg: >-
          Config sync mode: {{ effective_sync_mode }}
          (requested: {{ config_sync_mode }},
          controller marker visible on target:
          {{ sync_probe.stat.exists | default('n/a') }})

    # Skip when find returned nothing (e.g. no data/servers/<env> in repo).
    - name: Sync server config files (push from controller)
      ansible.posix.synchronize:
        src: "{{ local_data_dir }}/servers/{{ source_subdir }}/"
        dest: "{{ remote_data_dir }}/servers/{{ target_env }}/"
        mode: push
        rsync_path: "sudo rsync"
        rsync_opts:
          - "--include=*.json"
          - "--exclude=*"
      delegate_to: localhost
      become: false
      when:
        - server_config_files.files | length > 0
        - effective_sync_mode == 'push'
      register: server_copy_push

    - name: Sync server config files (controller is the target)
      ansible.posix.synchronize:
        src: "{{ local_data_dir }}/servers/{{ source_subdir }}/"
        dest: "{{ remote_data_dir }}/servers/{{ target_env }}/"
        rsync_path: "sudo rsync"
        rsync_opts:
          - "--include=*.json"
          - "--exclude=*"
      when:
        - server_config_files.files | length > 0
        - effective_sync_mode == 'local'
      register: server_copy_local

    - name: Sync rule config files (push from controller)
      ansible.posix.synchronize:
        src: "{{ local_data_dir }}/rules/{{ source_subdir }}/"
        dest: "{{ remote_data_dir }}/rules/{{ target_env }}/"
        mode: push
        rsync_path: "sudo rsync"
        rsync_opts:
          - "--include=*.json"
          - "--exclude=*"
      delegate_to: localhost
      become: false
      when:
        - rule_config_files.files | length > 0
        - effective_sync_mode == 'push'
      register: rule_copy_push

    - name: Sync rule config files (controller is the target)
      ansible.posix.synchronize:
        src: "{{ local_data_dir }}/rules/{{ source_subdir }}/"
        dest: "{{ remote_data_dir }}/rules/{{ target_env }}/"
        rsync_path: "sudo rsync"
        rsync_opts:
          - "--include=*.json"
          - "--exclude=*"
      when:
        - rule_config_files.files | length > 0
        - effective_sync_mode == 'local'
      register: rule_copy_local

    # Insurance against the 107f8a66 failure mode: files found locally but
    # neither branch ran, and the play reporting success anyway.
    - name: Assert the config sync actually ran
      assert:
        that:
          - (server_copy_push is defined and not (server_copy_push.skipped | default(false)))
            or (server_copy_local is defined and not (server_copy_local.skipped | default(false)))
        fail_msg: >-
          {{ server_config_files.files | length }} server config(s) found under
          {{ local_data_dir }}/servers/{{ source_subdir }} but neither sync
          branch ran (effective_sync_mode={{ effective_sync_mode }}).
        quiet: true
      when: server_config_files.files | length > 0

    - name: Assert the rule sync actually ran
      assert:
        that:
          - (rule_copy_push is defined and not (rule_copy_push.skipped | default(false)))
            or (rule_copy_local is defined and not (rule_copy_local.skipped | default(false)))
        fail_msg: >-
          {{ rule_config_files.files | length }} rule config(s) found under
          {{ local_data_dir }}/rules/{{ source_subdir }} but neither sync
          branch ran (effective_sync_mode={{ effective_sync_mode }}).
        quiet: true
      when: rule_config_files.files | length > 0

    # Both branches register separately: a single shared register name meant the
    # skipped branch overwrote the one that ran (changed=false), so
    # fix-permissions below never fired after a successful push.
    - name: Note what the sync changed
      set_fact:
        server_configs_changed: >-
          {{ (server_copy_push.changed | default(false))
             or (server_copy_local.changed | default(false)) }}
        rule_configs_changed: >-
          {{ (rule_copy_push.changed | default(false))
             or (rule_copy_local.changed | default(false)) }}

    - name: Ensure SSL domain directory exists
      file:
        path: "{{ remote_data_dir }}/ssl"
        state: directory
        mode: '0775'
        owner: www-data
        group: root

    - name: Generate SSL domain files from server configs with ssl_enabled
      shell: |
        for config_file in {{ remote_data_dir }}/servers/{{ target_env }}/*.json; do
          [ -f "$config_file" ] || continue
          ssl_enabled=$(jq -r '.ssl_enabled // false' "$config_file" 2>/dev/null)
          server_name=$(jq -r '.server_name // empty' "$config_file" 2>/dev/null)
          if [ "$ssl_enabled" = "true" ] && [ -n "$server_name" ]; then
            ssl_file="{{ remote_data_dir }}/ssl/${server_name}.json"
            echo "{\"ssl_enabled\": true, \"server_name\": \"${server_name}\"}" > "$ssl_file"
            chown www-data:root "$ssl_file"
            chmod 664 "$ssl_file"
            echo "Created SSL domain file: $ssl_file"
          fi
        done
      register: ssl_domain_result
      changed_when: "'Created SSL domain file' in ssl_domain_result.stdout"

    - name: Display SSL domain files created
      debug:
        msg: "{{ ssl_domain_result.stdout_lines | default([]) }}"
      when: ssl_domain_result.stdout_lines | default([]) | length > 0

    - name: Run fix-permissions to ensure nginx worker can access all files
      command: /usr/sbin/fix-permissions.sh
      when: (server_configs_changed | default(false) | bool) or (rule_configs_changed | default(false) | bool)
      ignore_errors: yes

    - name: Display deployment summary
      debug:
        msg: |
          ==========================================
          Deployment Summary
          ==========================================
          Server configs deployed: {{ server_config_files.files | length }}
          Rule configs deployed: {{ rule_config_files.files | length }}
          ==========================================

    - name: List deployed server configs
      command: "ls -la {{ remote_data_dir }}/servers/{{ target_env }}/"
      register: deployed_servers
      changed_when: false

    - name: List deployed rule configs
      command: "ls -la {{ remote_data_dir }}/rules/{{ target_env }}/"
      register: deployed_rules
      changed_when: false

    - name: Display deployed files
      debug:
        msg: |
          === Deployed Server Configs ===
          {{ deployed_servers.stdout }}
          
          === Deployed Rule Configs ===
          {{ deployed_rules.stdout }}

    - name: Reload nginx/openresty to pick up new SSL domains
      service:
        name: "{{ nginx_service }}"
        state: reloaded
      when: (server_configs_changed | default(false) | bool) or ssl_domain_result.changed
      ignore_errors: yes

  handlers:
    - name: Reload nginx
      service:
        name: "{{ nginx_service }}"
        state: reloaded
