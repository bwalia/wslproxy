<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1010" viewBox="0 0 1240 1010" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>VPN-gated access: wslvpn and wslproxy implementation flow</title>
  <desc>Request path from a VPN client through Cloudflare DNS, nginx and the WSLProxy edge; the per-request rule pipeline inside WSLProxy; and the wslvpn control plane, gateway and WireGuard hub beneath it. Solid green marks shipped work, dashed amber marks work not yet built.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowPending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowDeny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowAllow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1240" height="1010" fill="#f8fafc"/>

  <text x="40" y="46" font-size="23" font-weight="600" fill="#0f172a">VPN-gated access — implementation flow</text>
  <text x="40" y="70" font-size="14" fill="#64748b">wslvpn (Zero Trust overlay) × wslproxy (OpenResty edge). All three steps shipped.</text>

  <!-- ── Band 1: request path ───────────────────────────────────────────── -->
  <rect x="28" y="96" width="1184" height="132" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="120" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.08em">REQUEST PATH</text>

  <rect x="44" y="134" width="184" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="136" y="160" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">VPN client</text>
  <text x="136" y="180" font-size="12" fill="#475569" text-anchor="middle">10.8.1.7 — overlay</text>

  <line x1="234" y1="167" x2="282" y2="167" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="288" y="134" width="184" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="380" y="160" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Cloudflare</text>
  <text x="380" y="180" font-size="12" fill="#475569" text-anchor="middle">DNS only — not in path</text>

  <line x1="478" y1="167" x2="526" y2="167" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="532" y="134" width="184" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="624" y="158" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">nginx</text>
  <text x="624" y="179" font-size="11.5" fill="#475569" text-anchor="middle">XFF := $remote_addr</text>

  <line x1="722" y1="167" x2="770" y2="167" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="776" y="134" width="392" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="972" y="158" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">WSLProxy edge — real_ip recovery</text>
  <text x="972" y="179" font-size="11.5" fill="#475569" text-anchor="middle">data/real_ip/*.conf · empty by default = fail closed</text>

  <!-- ── Band 2: rule pipeline ──────────────────────────────────────────── -->
  <rect x="28" y="248" width="1184" height="292" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="272" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.08em">INSIDE WSLPROXY — EVALUATED PER REQUEST</text>

  <rect x="44" y="290" width="228" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="158" y="315" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">rule_loader</text>
  <text x="158" y="336" font-size="11.5" fill="#475569" text-anchor="middle">expands access_profile into</text>
  <text x="158" y="353" font-size="11.5" fill="#475569" text-anchor="middle">allow + deny rule pairs</text>
  <text x="158" y="372" font-size="11" font-weight="600" fill="#166534" text-anchor="middle">fails closed → deny all</text>

  <line x1="278" y1="336" x2="322" y2="336" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="328" y="290" width="228" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="442" y="315" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">rule_matcher</text>
  <text x="442" y="336" font-size="11.5" fill="#475569" text-anchor="middle">path · country · token</text>
  <text x="442" y="354" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">client_ip: cidr</text>
  <text x="442" y="372" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">vpn_groups: identity</text>

  <line x1="562" y1="336" x2="606" y2="336" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="612" y="290" width="240" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="732" y="315" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">rule_selector</text>
  <text x="732" y="336" font-size="11.5" fill="#475569" text-anchor="middle">keeps passing rules, ranks by</text>
  <text x="732" y="353" font-size="11.5" fill="#475569" text-anchor="middle">priority → path specificity</text>
  <text x="732" y="372" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">a failing rule does not deny</text>

  <line x1="858" y1="336" x2="902" y2="336" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="908" y="290" width="260" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1038" y="326" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">gateway_resp</text>
  <text x="1038" y="350" font-size="11.5" fill="#475569" text-anchor="middle">renders the winning rule</text>

  <!-- split to outcomes -->
  <line x1="1038" y1="386" x2="1038" y2="412" stroke="#64748b" stroke-width="1.5"/>
  <line x1="964" y1="412" x2="1112" y2="412" stroke="#64748b" stroke-width="1.5"/>
  <line x1="964" y1="412" x2="964" y2="446" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowAllow)"/>
  <line x1="1112" y1="412" x2="1112" y2="446" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowDeny)"/>

  <rect x="890" y="450" width="148" height="58" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="964" y="475" font-size="13" font-weight="600" fill="#166534" text-anchor="middle">305 proxy</text>
  <text x="964" y="494" font-size="11" fill="#475569" text-anchor="middle">to origin</text>

  <rect x="1050" y="450" width="124" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1112" y="475" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle">403 page</text>
  <text x="1112" y="494" font-size="11" fill="#475569" text-anchor="middle">"VPN required"</text>

  <!-- rules-come-in-pairs, sitting in the free space under loader/matcher -->
  <rect x="44" y="404" width="500" height="104" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="60" y="428" font-size="12.5" font-weight="600" fill="#92400e">Every protected path needs two rules</text>
  <text x="60" y="450" font-size="11.5" fill="#78350f">Alone, an allow rule on /admin falls through to the</text>
  <text x="60" y="467" font-size="11.5" fill="#78350f">domain's catch-all and serves the request off-VPN.</text>
  <text x="60" y="492" font-size="11.5" fill="#78350f"><tspan font-weight="600">allow</tspan> base+1 · path + cidr → proxy</text>
  <text x="330" y="492" font-size="11.5" fill="#78350f"><tspan font-weight="600">deny</tspan> base · path only → 403</text>

  <!-- identity lookup: clean vertical corridor at x=600, no crossings -->
  <path d="M 556 364 L 600 364 L 600 604 L 654 604" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowAllow)"/>
  <text x="614" y="452" font-size="11" fill="#166534">resolve remote_addr → user + groups</text>
  <text x="614" y="470" font-size="11" fill="#166534">cached 15s · fail closed · ANDed in or-mode</text>

  <!-- ── Band 3: wslvpn ─────────────────────────────────────────────────── -->
  <rect x="28" y="560" width="1184" height="270" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="584" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.08em">WSLVPN — CONTROL PLANE AND DATA PLANE</text>

  <rect x="660" y="600" width="330" height="104" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="825" y="626" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">control plane — identity</text>
  <text x="825" y="648" font-size="11.5" fill="#475569" text-anchor="middle">GET /api/v1/sessions/by-ip/{ip}</text>
  <text x="825" y="666" font-size="11.5" fill="#475569" text-anchor="middle">→ user, groups, expiry</text>
  <text x="825" y="689" font-size="11" font-weight="600" fill="#166534" text-anchor="middle">SHIPPED — service token</text>

  <rect x="44" y="600" width="330" height="104" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="209" y="626" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">wsl-gateway — adopt mode</text>
  <text x="209" y="648" font-size="11.5" fill="#475569" text-anchor="middle">reconciles against wg show dump</text>
  <text x="209" y="666" font-size="11.5" fill="#475569" text-anchor="middle">removal scoped to managed_range</text>
  <text x="209" y="689" font-size="11" font-weight="600" fill="#166534" text-anchor="middle">MERGED — PR #1</text>

  <line x1="380" y1="652" x2="424" y2="652" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="402" y="640" font-size="10.5" fill="#64748b" text-anchor="middle">wg</text>

  <rect x="430" y="600" width="200" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="530" y="630" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">WireGuard hub</text>
  <text x="530" y="652" font-size="11" fill="#475569" text-anchor="middle">home lab, pre-existing</text>
  <text x="530" y="672" font-size="11" fill="#475569" text-anchor="middle">interface wg0</text>

  <!-- address ranges -->
  <rect x="44" y="724" width="586" height="86" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="748" font-size="12" font-weight="600" fill="#334155">Disjoint ranges on one interface</text>
  <text x="60" y="770" font-size="11.5" fill="#475569"><tspan font-weight="600" fill="#166534">10.8.1.0/24</tspan> — Zero Trust overlay, control-plane owned, removable</text>
  <text x="60" y="790" font-size="11.5" fill="#475569"><tspan font-weight="600">10.8.0.0/24</tspan> — 9 existing peers, classified foreign, never touched</text>

  <rect x="660" y="724" width="508" height="86" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="676" y="748" font-size="12" font-weight="600" fill="#334155">Why disjoint</text>
  <text x="676" y="770" font-size="11.5" fill="#475569">IPAM cannot see addresses already live on the hub, so separate</text>
  <text x="676" y="790" font-size="11.5" fill="#475569">ranges prevent collisions and make removal a subnet check.</text>

  <!-- ── Footnote: what each step delivers ──────────────────────────────── -->
  <rect x="28" y="850" width="1184" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="874" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.08em">DELIVERY</text>

  <rect x="44" y="886" width="14" height="14" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="68" y="898" font-size="11.5" fill="#475569"><tspan font-weight="600" fill="#0f172a">Step 1</tspan> — cidr match + real_ip. Endpoint is VPN-only, but any device on the overlay reaches it.</text>

  <rect x="44" y="910" width="14" height="14" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="68" y="922" font-size="11.5" fill="#475569"><tspan font-weight="600" fill="#0f172a">Step 2</tspan> — access profiles. One field per domain expands to allow/deny pairs; operators stop hand-pairing rules.</text>

  <rect x="44" y="934" width="14" height="14" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="68" y="946" font-size="11.5" fill="#475569"><tspan font-weight="600" fill="#0f172a">Step 3</tspan> — identity. Enforces which user and which group, not merely which network. This is what makes it Zero Trust.</text>

  <!-- ── Legend ─────────────────────────────────────────────────────────── -->
  <rect x="44" y="968" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="72" y="979" font-size="11.5" fill="#475569">shipped</text>

  <rect x="146" y="968" width="18" height="13" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="174" y="979" font-size="11.5" fill="#475569">pre-existing</text>

  <text x="1168" y="979" font-size="11" fill="#94a3b8" text-anchor="end">docs/VPN_ACCESS.md · api/ip_cidr.lua · api/access_profile.lua</text>
</svg>
