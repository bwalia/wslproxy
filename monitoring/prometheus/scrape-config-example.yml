# Example Prometheus scrape config for the WSLProxy fleet.
# Merge into the prometheus.yml of the server backing int-grafana.
#
# The dashboard's "Node (Region)" variable is driven by the `instance` label,
# so keep one target per proxy node.

scrape_configs:
  - job_name: wslproxy
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["prod-our-v1.wslproxy.com"]
        labels: { node: pop0, env: prod }
      # Add lon1 here once its metrics vhost is exposed, e.g.:
      # - targets: ["prod-lon1.wslproxy.com"]
      #   labels: { node: lon1, env: prod }

  # Optional but recommended — drives the Infrastructure row (CPU/mem/disk/net).
  # - job_name: wslproxy-node
  #   static_configs:
  #     - targets: ["85.190.106.189:9100", "lon1.pop0.uk:9100"]

  # Optional but recommended — drives SSL cert-expiry panels + alerts.
