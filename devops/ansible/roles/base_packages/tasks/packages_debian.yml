---
# Debian/Ubuntu package management

- name: Fix apt sources for Debian (replace Ubuntu mirrors with Debian mirrors)
  when: ansible_distribution == "Debian"
  copy:
    dest: /etc/apt/sources.list
    content: |
      deb http://deb.debian.org/debian {{ ansible_distribution_release }} main contrib non-free non-free-firmware
      deb http://deb.debian.org/debian {{ ansible_distribution_release }}-updates main contrib non-free non-free-firmware
      deb http://security.debian.org/debian-security {{ ansible_distribution_release }}-security main contrib non-free non-free-firmware
      deb http://deb.debian.org/debian {{ ansible_distribution_release }}-backports main contrib non-free non-free-firmware
    backup: yes
  tags: [base_packages, debian]

- name: Find stale Ubuntu source files on Debian systems
  when: ansible_distribution == "Debian"
  shell: grep -rl 'ubuntu.com' /etc/apt/sources.list.d/ 2>/dev/null || true
  register: ubuntu_source_files
  changed_when: false
  tags: [base_packages, debian]

- name: Remove stale Ubuntu source files on Debian systems
  when: ansible_distribution == "Debian" and ubuntu_source_files.stdout_lines | length > 0
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ ubuntu_source_files.stdout_lines }}"
  tags: [base_packages, debian]

- name: Update and upgrade apt packages
  apt:
    upgrade: yes
    update_cache: yes
    cache_valid_time: 86400
  tags: [base_packages, debian, ubuntu]

- name: Install common packages
  apt:
    name: "{{ _os_packages.Debian.common }}"
    state: present
  tags: [base_packages, debian, ubuntu]

- name: Install distribution-specific packages (Ubuntu)
  apt:
    name: "{{ _os_packages.Debian.distro_specific.Ubuntu }}"
    state: present
  when: ansible_distribution == "Ubuntu"
  tags: [base_packages, ubuntu]

- name: Install distribution-specific packages (Debian)
  apt:
    name: "{{ _os_packages.Debian.distro_specific.Debian }}"
    state: present
  when: ansible_distribution == "Debian"
  tags: [base_packages, debian]

- name: Install apt transport and Java dependencies
  ansible.builtin.package:
    name:
      - apt-transport-https
      - default-jre
      - gpg
  retries: 2
  register: result
  until: result is succeeded
  tags: [base_packages, logs-elk]
