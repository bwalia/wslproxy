---
# Bootstrap and OpenResty compilation from source

- name: Copy openresty bootstrap script
  template:
    src: bootstrap.sh.j2
    dest: /tmp/bootstrap.sh
    mode: 0777
  tags: [build]

- name: Execute the bootstrap.sh openresty bootstrap script
  shell: /tmp/bootstrap.sh
  async: 300
  poll: 15
  tags: [build]

- name: Copy openresty build script
  template:
    src: openresty.sh.j2
    dest: /tmp/openresty.sh
    mode: 0777
  tags: [build]

- name: Execute the openresty.sh build script
  shell: /tmp/openresty.sh 2>&1
  register: openresty_build_output
  async: 900
  poll: 30
  tags: [build]

- name: Show openresty build output (last 30 lines)
  debug:
    msg: "{{ openresty_build_output.stdout_lines[-30:] }}"
  when: openresty_build_output is defined
  tags: [build]

- name: Verify luarocks is available after build
  shell: |
    echo "=== which luarocks ==="
    which luarocks 2>/dev/null || echo "NOT FOUND in PATH"
    ls -la /usr/local/openresty/luajit/bin/luarocks 2>/dev/null || echo "NOT at /usr/local/openresty/luajit/bin/luarocks"
    ls -la /usr/local/bin/luarocks 2>/dev/null || echo "NOT at /usr/local/bin/luarocks"
    echo "=== PATH ==="
    echo $PATH
  register: luarocks_check
  changed_when: false
  tags: [build]

- name: Show luarocks verification
  debug:
    msg: "{{ luarocks_check.stdout_lines }}"
  tags: [build]
