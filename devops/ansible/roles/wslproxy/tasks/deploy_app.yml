---
# Deploy application files: HTML, API, settings, environment, CDN dependencies

- name: Sync HTML files
  ansible.posix.synchronize:
    src: ../../html/
    dest: /usr/local/openresty/nginx/html
  register: sync_html
  tags: [openresty, lapis, dashboard, html]

- debug:
    var: sync_html.stdout_lines
  tags: [openresty, lapis, dashboard, html]

- name: Sync API files
  ansible.posix.synchronize:
    src: ../../api/
    dest: /usr/local/openresty/nginx/html/api
  notify: Restart openresty
  register: sync_api
  tags: [openresty, lapis, dashboard, nginx]

- debug:
    var: sync_api.stdout_lines
  tags: [openresty, lapis, dashboard, nginx]

- name: Copy CDN dependencies script
  template:
    src: cdn-dependencies.sh.j2
    dest: /tmp/cdn-dependencies.sh
    mode: 0777
  tags: [openresty, lapis]

- name: Ensure nginx data directory exists
  ansible.builtin.file:
    path: /opt/nginx/data/
    state: directory
    owner: "www-data"
    group: root
    mode: 0775
  tags: [openresty, lapis]

- name: Copy Settings Config file
  copy:
    src: "{{ local_settings_file_path }}"
    dest: /opt/nginx/data/settings.json
    mode: 0777
    owner: "www-data"
    group: root
    remote_src: no
  tags: [openresty, lapis, dashboard]

- name: Copy Environment file
  copy:
    src: "{{ local_env_file_path }}"
    dest: "/tmp/.env"
    mode: 0777
    remote_src: no
  tags: [openresty, lapis, dashboard]

- name: Execute the cdn-dependencies.sh script
  shell: /tmp/cdn-dependencies.sh 2>&1
  register: cdn_deps_result
  tags: [openresty, lapis]

- name: Show cdn-dependencies output
  debug:
    msg: "{{ cdn_deps_result.stdout_lines[-30:] }}"
  when: cdn_deps_result is defined
  tags: [openresty, lapis]

- name: Verify critical Lua modules are installed
  shell: |
    echo "=== Checking lua-resty-jwt installation ==="
    find /usr/local/openresty /usr/local/share /usr/local/lib -name "jwt.lua" -path "*/resty/*" 2>/dev/null || echo "jwt.lua NOT FOUND anywhere"
    echo "=== Luarocks config ==="
    luarocks config 2>/dev/null || echo "luarocks not available"
    echo "=== Luarocks list ==="
    luarocks list 2>/dev/null | head -20 || echo "luarocks list failed"
  register: lua_module_check
  changed_when: false
  tags: [openresty, lapis]

- name: Show Lua module verification
  debug:
    msg: "{{ lua_module_check.stdout_lines }}"
  tags: [openresty, lapis]
