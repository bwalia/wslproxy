---
# wslproxy role: Deploy and configure OpenResty/WSLProxy
# This orchestrator calls focused task files in the correct order
# OS-specific variables are loaded automatically from vars/{Debian,Suse,RedHat}.yml

# Step 0: Load OS-specific variables
- name: Load OS-specific variables
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_os_family }}.yml"
    - "Debian.yml"
  tags: [always]

# Step 0.5: Auto-detect if OpenResty needs a full build
# If OpenResty is not installed or is the wrong version, force build steps
# even when --skip-tags build is used (code-only deploy)
- name: Check if OpenResty is installed
  shell: /usr/local/openresty/bin/openresty -v 2>&1 || echo "NOT_INSTALLED"
  register: openresty_installed_check
  changed_when: false
  failed_when: false
  tags: [always]

- name: Set expected OpenResty version
  set_fact:
    openresty_expected_version: "1.29.2.1"
  tags: [always]

- name: Determine if full build is required
  set_fact:
    openresty_needs_build: "{{ 'NOT_INSTALLED' in openresty_installed_check.stdout or openresty_expected_version not in openresty_installed_check.stdout }}"
  tags: [always]

- name: Report OpenResty status
  debug:
    msg: >-
      OpenResty status: {{ openresty_installed_check.stdout | trim }}.
      Expected version: {{ openresty_expected_version }}.
      Full build required: {{ openresty_needs_build }}.
  tags: [always]

# Track whether build steps have already run (to prevent double execution)
- name: Initialize build tracker
  set_fact:
    _build_steps_done: false
  tags: [always]

# Step 1: OS-specific package refresh (runs during explicit full build)
- name: Run OS-specific setup
  include_tasks: "os_setup_{{ ansible_os_family | lower }}.yml"
  tags: [openresty, lapis, build]

- name: Mark build steps as done
  set_fact:
    _build_steps_done: true
  tags: [openresty, lapis, build]

# Step 1 (auto): OS setup forced when OpenResty is missing (even with --skip-tags build)
- name: "Auto-build: Run OS-specific setup (OpenResty not installed)"
  include_tasks: "os_setup_{{ ansible_os_family | lower }}.yml"
  when: openresty_needs_build | bool and not _build_steps_done | bool
  tags: [always]

# Step 2: Load host variables
- name: Load host variables
  include_vars: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}/vars.yaml"

# Step 3: User and group setup (must run before bootstrap)
- name: Setup www-data user and groups
  include_tasks: user_setup.yml
  tags: [openresty, lapis, dashboard, nginx]

# Step 4: Bootstrap and compile OpenResty from source (runs during explicit full build)
- name: Bootstrap and build OpenResty
  include_tasks: openresty_build.yml
  tags: [openresty, lapis, build]

# Step 4 (auto): OpenResty build forced when not installed (even with --skip-tags build)
- name: "Auto-build: Bootstrap and build OpenResty (not installed)"
  include_tasks: openresty_build.yml
  when: openresty_needs_build | bool and not _build_steps_done | bool
  tags: [always]

# Step 5: Nginx configuration directories and base configs
- name: Configure nginx
  include_tasks: nginx_config.yml
  tags: [openresty, lapis, dashboard, nginx]

# Step 6: Deploy application files (HTML, API, settings, CDN deps)
- name: Deploy application
  include_tasks: deploy_app.yml
  tags: [openresty, lapis, dashboard]

# Step 6.5: Install and configure Varnish Cache (conditional)
- name: Setup Varnish Cache
  include_tasks: varnish_setup.yml
  when: varnish_enabled is defined and varnish_enabled | bool
  tags: [openresty, varnish]

# Step 7: Cron jobs for data sync and nginx restart
- name: Setup cron jobs
  include_tasks: cron_setup.yml
  tags: [openresty, nginx]

# Step 8: Systemd service and file descriptor limits
- name: Configure systemd and limits
  include_tasks: systemd_limits.yml
  tags: [openresty, lapis, nginx, limits]

# Step 9: PAM configuration (OS-specific paths)
- name: Configure PAM
  include_tasks: pam_config.yml
  tags: [openresty, lapis, nginx, limits]

# Step 10: OpenResty admin UI (conditional)
- name: Deploy OpenResty admin UI
  include_tasks: deploy_admin_ui.yml
  when: nginx_web_ui_enabled is defined and nginx_web_ui_enabled == "yes"
  tags: [openresty, lapis, dashboard]

# Step 11: Final config, permissions, SSL, tenants, service start, verification
- name: Finalize deployment
  include_tasks: finalize.yml
  tags: [openresty, lapis, dashboard, nginx]
