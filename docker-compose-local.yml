version: '3.8'

# Local Development Docker Compose Configuration
# Uses unique ports to avoid conflicts with common local services
# Includes proper volume mounts for hot-reload development
#
# Start with: ./dev.sh start
# Or directly: docker compose -f docker-compose-local.yml up -d --build

services:
  wslproxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: dev
        DNS_RESOLVER: 127.0.0.11
    container_name: wslproxy-local
    restart: unless-stopped

    ports:
      # HTTP proxy (default 80 → 8180 to avoid conflicts)
      - "8180:80"
      # HTTPS proxy (default 443 → 8443 to avoid conflicts)
      - "8443:443"
      # Admin Dashboard & API (default 8080 → 8280 to avoid conflicts)
      - "8280:8080"
      # Legacy Vite Admin fallback (port 8090 → 8290 externally)
      - "8290:8090"
      # Next.js Admin Dashboard (port 8099 → 8299 externally)
      - "8299:8099"

    volumes:
      # Hot-reload Lua API files (changes reflect per-request, no restart needed)
      - ./api:/usr/local/openresty/nginx/html/api

      # Hot-reload HTML/static files
      - ./html:/usr/local/openresty/nginx/html

      # Configuration files
      - ./data:/opt/nginx/data
      - ./nginx-dev.conf.tmpl:/usr/local/openresty/nginx/conf/nginx.conf

      # SSL certificates (persistent across restarts)
      - wslproxy-certs-local:/etc/resty-auto-ssl

      # Swagger documentation
      - ./html/swagger:/usr/local/openresty/nginx/html/swagger

      # Legacy Vite Admin dist (served on port 8090/8290)
      - ./openresty-admin/dist:/usr/local/openresty/nginx/html/openresty-admin/dist:ro

    environment:
      NGINX_CONFIG_DIR: /opt/nginx/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DNS_RESOLVER: 127.0.0.11
      LUA_LOG_LEVEL: debug
      SSL_STAGING: "true"
      # PostgreSQL storage backend (used when storage_type=pgsql in settings.json)
      WSLPROXY_PG_HOST: postgres
      WSLPROXY_PG_PORT: 5432
      WSLPROXY_PG_DB: wslproxy
      WSLPROXY_PG_USER: wslproxy
      WSLPROXY_PG_PASSWORD: wslproxy_local_dev

    depends_on:
      redis:
        condition: service_healthy
      demo-node-app:
        condition: service_healthy
      postgres:
        condition: service_healthy

    networks:
      wslproxy-local-network:
        ipv4_address: 172.177.0.2

    # Run as root in dev for easier file permissions
    user: root

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: wslproxy-redis-local
    restart: unless-stopped

    ports:
      # Redis (default 6379 → 6479 to avoid conflicts)
      - "6479:6379"

    volumes:
      - redis-data-local:/data

    command: redis-server --appendonly yes --loglevel debug

    networks:
      wslproxy-local-network:
        ipv4_address: 172.177.0.3

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Demo Node.js origin server (backend for proxy testing)
  # The WSLProxy gateway rule for "localhost" proxies to this app on port 3009
  demo-node-app:
    build:
      context: .
      dockerfile: demos-origins/node-app/Dockerfile
    container_name: demo-node-app-local
    restart: unless-stopped

    ports:
      # Node app (direct access for debugging)
      - "3009:3009"

    volumes:
      # Hot-reload: nodemon watches for file changes automatically
      - ./demos-origins/node-app/server.js:/app/server.js
      - ./demos-origins/node-app/login.html:/app/login.html
      - ./demos-origins/node-app/success.html:/app/success.html
      - ./demos-origins/node-app/jwt.js:/app/jwt.js
      - ./demos-origins/node-app/verifyToken.js:/app/verifyToken.js

    environment:
      NODE_ENV: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required - pass via environment or .env.local file}

    networks:
      wslproxy-local-network:
        ipv4_address: 172.177.0.10

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3009/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  # Optional third storage backend (set storage_type: pgsql in settings.json)
  postgres:
    image: postgres:16-alpine
    container_name: wslproxy-postgres-local
    restart: unless-stopped

    ports:
      # Exposed on 5436 to avoid conflicts with any local postgres on 5432
      - "5436:5432"

    environment:
      POSTGRES_DB: wslproxy
      POSTGRES_USER: wslproxy
      POSTGRES_PASSWORD: wslproxy_local_dev

    volumes:
      - postgres-data-local:/var/lib/postgresql/data
      # Schema is applied automatically on first start
      - ./infra/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

    networks:
      wslproxy-local-network:
        ipv4_address: 172.177.0.4

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wslproxy -d wslproxy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Adminer (Database UI) ─────────────────────────────────────────────────
  # Lightweight database management tool — connect to PostgreSQL at postgres:5432
  adminer:
    image: adminer:latest
    container_name: wslproxy-adminer-local
    restart: unless-stopped

    ports:
      - "8380:8080"

    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      wslproxy-local-network:
        ipv4_address: 172.177.0.7

  # ── Vite Admin Dashboard (old) ────────────────────────────────────────────
  # Legacy React-Admin (Vite) dashboard — runs alongside the new Next.js one
  # Vite dev server proxy eliminates CORS: browser → /api → wslproxy-local
  openresty-admin:
    build:
      context: ./openresty-admin
      dockerfile: Dockerfile
    container_name: wslproxy-admin-vite-local
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      # Bind-mount source for hot-reload (Vite Fast Refresh)
      - ./openresty-admin/src:/app/src
      - ./openresty-admin/public:/app/public
      - ./openresty-admin/index.html:/app/index.html
      - ./openresty-admin/vite.config.js:/app/vite.config.js
      - ./openresty-admin/.env:/app/.env
      # Persist node_modules inside the container (avoid Mac ↔ Linux ABI issues)
      - vite-admin-node-modules:/app/node_modules

    environment:
      # Proxy target: Vite dev server forwards /api and /health here server-side
      PROXY_TARGET: http://wslproxy-local:8080
      # Signal Docker mode so Vite binds to 0.0.0.0 and picks up PORT
      DOCKER_ENV: "true"
      PORT: 5173

    depends_on:
      wslproxy:
        condition: service_healthy

    networks:
      wslproxy-local-network:
        ipv4_address: 172.177.0.6

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5173 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Next.js Admin Dashboard (new) ────────────────────────────────────────
  # Standalone Next.js app — replaces the Vite build in openresty-admin
  # Runs on port 7619 (internal and external) with hot-reload in dev mode
  openresty-admin-next:
    build:
      context: ./openresty-admin-next
      dockerfile: Dockerfile
    container_name: wslproxy-admin-next-local
    restart: unless-stopped

    ports:
      - "7619:7619"

    volumes:
      # Bind-mount source for hot-reload (Next.js Fast Refresh)
      - ./openresty-admin-next/src:/app/src
      - ./openresty-admin-next/public:/app/public
      - ./openresty-admin-next/next.config.ts:/app/next.config.ts
      - ./openresty-admin-next/postcss.config.js:/app/postcss.config.js
      - ./openresty-admin-next/package.json:/app/package.json
      # Persist node_modules inside the container (avoid Mac ↔ Linux ABI issues)
      - next-admin-node-modules:/app/node_modules

    environment:
      # Internal docker network URL used by Next.js server-side rewrites
      WSLPROXY_API_URL: http://wslproxy-local:8080
      # Next.js dev server port
      PORT: 7619

    depends_on:
      wslproxy:
        condition: service_healthy

    networks:
      wslproxy-local-network:
        ipv4_address: 172.177.0.5

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7619 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  wslproxy-local-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.177.0.0/16
          gateway: 172.177.0.1

volumes:
  wslproxy-certs-local:
  redis-data-local:
  postgres-data-local:
  next-admin-node-modules:
  vite-admin-node-modules:
