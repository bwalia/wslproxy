# Heap harness for api/log_handler.lua + api/prometheus_metrics.lua (the
# per-request metrics path). Started by run.sh inside the wslproxy image; not
# a deployable config.
#
#   :8080  gateway: plays gateway_ack/gateway_resp's part (sets the ctx the
#          log phase reads), proxies to the origin, then log_handler runs
#   :9103  origin
#   :9104  control: /heap (full GC, then this worker's Lua heap), /series,
#          /metrics
worker_processes 2;
error_log /tmp/it/logs/error.log warn;
pid /tmp/it/logs/nginx.pid;

events { worker_connections 1024; }

http {
    lua_package_path "/heap/promlib/?.lua;/heap/api/?.lua;/heap/api/?/init.lua;/usr/local/openresty/lualib/?.lua;/usr/local/openresty/site/lualib/?.lua;;";
    lua_shared_dict prometheus_metrics 64m;
    lua_shared_dict traffic_stats 5m;
    access_log off;
    client_body_temp_path /tmp/it/body;
    proxy_temp_path /tmp/it/proxy;

    # The load generator sends the "client" address in X-Forwarded-For.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    init_by_lua_block {
        Cjson = require "cjson"
    }

    init_worker_by_lua_block {
        local ok, metrics = pcall(require, "prometheus_metrics")
        if ok then metrics.init() else ngx.log(ngx.ERR, "prometheus_metrics: ", tostring(metrics)) end
    }

    log_by_lua_block {
        local ok, log_handler = pcall(require, "log_handler")
        if ok and log_handler then log_handler.log_request() end
    }

    server {
        listen 8080;
        server_name _;
        location / {
            rewrite_by_lua_block {
                -- gateway_ack.lua: a configured server sets metric_host.
                if ngx.var.http_x_test_server == "1" then
                    ngx.ctx.metric_host = ngx.var.host
                end
                -- gateway_resp.lua: the selected backend's label.
                ngx.ctx.selected_backend_label = "backend-" .. (ngx.crc32_short(ngx.var.host) % 3)
            }
            proxy_pass http://127.0.0.1:9103;
        }
    }

    server {
        listen 127.0.0.1:9103;
        location / { return 200 "ok"; }
    }

    server {
        listen 127.0.0.1:9104;
        location /heap {
            content_by_lua_block {
                collectgarbage("collect")
                collectgarbage("collect")
                ngx.say(ngx.worker.id(), " ", math.floor(collectgarbage("count")))
            }
        }
        location /metrics {
            content_by_lua_block {
                require("prometheus_metrics").get_prometheus():collect()
            }
        }
        location /series {
            content_by_lua_block {
                local keys = ngx.shared.prometheus_metrics:get_keys(0)
                ngx.say(#keys)
            }
        }
    }
}
