# Integration harness for api/bot_defense/. Started by run.sh inside the
# wslproxy image; not a deployable config.
#
#   :8080  gateway — calls bot_defense.access() the way gateway_ack.lua does;
#          the per-server policy comes from X-Test-* request headers
#   :9103  origin  — echoes the X-WSL-Bot-* headers it received
#   :9104  control — flush state, /metrics

# Two workers, so behaviour counting has to work across them.
worker_processes 2;
error_log /tmp/it/logs/error.log info;
pid /tmp/it/logs/nginx.pid;

env NGINX_CONFIG_DIR;

events { worker_connections 256; }

http {
    lua_package_path "/api/?.lua;/api/?/init.lua;/usr/local/openresty/lualib/?.lua;/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/luajit/share/lua/5.1/?.lua;/usr/local/openresty/luajit/share/lua/5.1/?/init.lua;;";
    lua_shared_dict wsl_bot_defense 4m;
    lua_shared_dict prometheus_metrics 4m;
    access_log off;
    client_body_temp_path /tmp/it/body;
    proxy_temp_path /tmp/it/proxy;

    init_by_lua_block {
        Cjson = require "cjson"
    }

    init_worker_by_lua_block {
        local ok, metrics = pcall(require, "prometheus_metrics")
        if ok then metrics.init() end
        local bd_ok, bd = pcall(require, "bot_defense")
        if bd_ok then bd.init() else ngx.log(ngx.ERR, "bot_defense not available: ", tostring(bd)) end
    }

    log_by_lua_block {
        local bd_ok, bd = pcall(require, "bot_defense")
        if bd_ok then bd.log() end
    }

    server {
        listen 8080;
        location / {
            rewrite_by_lua_block {
                local mode = ngx.var.http_x_test_mode
                local policy
                if mode then
                    policy = {
                        mode = mode,
                        response_headers = true,
                        challenge_paths = { "/checkout" },
                        login_paths = { "/api/login" },
                        skip_paths = { "/webhooks/" },
                        monitor_paths = { "/ad/" },
                        limits = {
                            burst_per_10s = tonumber(ngx.var.http_x_test_burst) or 1000,
                            distinct_paths_per_min = 10,
                            errors_per_min = 5,
                            logins_per_5min = 3,
                            cookieless_requests = 3,
                            pages_without_assets = 5,
                        },
                    }
                end
                require("bot_defense").access({ server_name = ngx.var.host, bot_defense = policy })
            }
            proxy_pass http://127.0.0.1:9103;
        }
    }

    server {
        listen 127.0.0.1:9103;
        location / {
            content_by_lua_block {
                ngx.header["Set-Cookie"] = "origin=1; Path=/"
                local p = ngx.var.uri
                if p == "/missing" then return ngx.exit(404) end
                if p == "/api/login" then
                    ngx.status = 401
                    ngx.say('{"error":"invalid credentials"}')
                    return
                end
                if p:find("%.css$") then ngx.header["Content-Type"] = "text/css" end
                ngx.say(require("cjson").encode({
                    class = ngx.var.http_x_wsl_bot_class or "absent",
                    score = ngx.var.http_x_wsl_bot_score or "absent",
                    ivt = ngx.var.http_x_wsl_bot_ivt or "absent",
                    signals = ngx.var.http_x_wsl_bot_signals or "absent",
                }))
            }
        }
    }

    server {
        listen 127.0.0.1:9104;
        location = /flush {
            content_by_lua_block {
                ngx.shared.wsl_bot_defense:flush_all()
                ngx.say("ok")
            }
        }
        location = /metrics {
            content_by_lua_block {
                local p = package.loaded._prometheus_instance
                if p then p:collect() else ngx.say("no prometheus") end
            }
        }
    }
}
